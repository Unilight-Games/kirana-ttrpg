Max MP"}],"profLabel":"เลือก Proficiency"}}},{"id":"medical","nameEn":"Medical","nameTh":"การแพทย์","stats":["INT","AGI"],"levels":{"0":{"text":"สามารถพันแผลห้ามเลือดด้วย 8 Medical Check","proficiencies":[],"profLabel":""},"1":{"text":"สามารถจัดกระดูก, เย็บแผล, รักษาไข้ป่าและอาการป่วยทั่วไป ด้วย 8 Medical Check","proficiencies":[{"name":"Surgical Trainee","text":"ได้รับ Advantage ในการทอย Medical Check เมื่อต้องทำการเย็บแผลที่ต้องการความประณีต หรือการดูแลแผลผ่าตัด และป้องกันการติดเชื้อ (Toughness Healing +1)"},{"name":"Apothecary","text":"ได้รับ Advantage ในการทอย Medical Check เพื่อวินิจฉัยโรคจากการสังเกตอาการภายนอกและการซักถามประวัติผู้ป่วยเบื้องต้น (เก็บข้อมูลคนไข้ได้)"},{"name":"Paramedic","text":"ได้รับ Advantage ในการทอย Medical Check เพื่อทำการห้ามเลือด จัดการกับภาวะช็อก หรือการช่วยชีวิตขั้นพื้นฐาน (CPR) ในสถานการณ์คับขัน"}],"profLabel":"เลือก Proficiency"},"2":{"text":"สามารถผ่าตัดและต่ออวัยวะ (ยกเว้นสมองและดวงตา), รักษาฝีดาษและโรคระบาดทั่วไปด้วย 10 Medical Check","proficiencies":[{"name":"General Surgeon","text":"ความรู้ด้านกายวิภาคศาสตร์ของคุณเพิ่มพูน ทำให้เข้าใจโครงสร้างร่างกายของเผ่าพันธุ์มนุษย์ (หรือเผ่าพันธุ์หลักที่คุณศึกษา) อย่างละเอียด, สามารถรักษาเผ่าที่ต่างจากตัวคุณได้ด้วย +2 DC"},{"name":"Pathologist","text":"ได้รับ Advantage ในการทอย Medical Check เพื่อทำความเข้าใจกลไกการทำงานของโรค และคาดการณ์การลุกลามหรือผลกระทบระยะยาว"},{"name":"Field Medic","text":"ทักษะการจัดลำดับความสำคัญในการรักษา (Triage) ของคุณนั้นยอดเยี่ยม ทำให้สามารถช่วยชีวิตผู้คนได้จำนวนมากที่สุดในสถานการณ์ที่มีผู้บาดเจ็บหลายราย, สามารถ Long Rest เพื่อรักษา Tough พันธมิตรในแคมป์ได้สูงสุด 2 คน"}],"profLabel":"เลือก Proficiency"},"3":{"text":"","proficiencies":[{"name":"Surgical Specialist","text":"สามารถผ่าตัดสมองและดวงตาด้วย 14 Medical Check, สามารถต่อรองกับความตายด้วย 14 Medical Check หาก Success จะสามารถฟื้นคืนชีพพันธมิตรได้หนึ่งคนต่อ Session"},{"name":"Plague Doctor","text":"สามารถสร้างยาที่มีฤทธิ์ในการรักษาโรคหรือภาวะที่ดูเหมือนจะไม่มีทางรักษาได้ (ผลลัพธ์และความยากขึ้นอยู่กับดุลยพินิจของผู้คุมชะตาและทรัพยากรที่มี), วินิจฉัยศพด้วย Advantage"},{"name":"Combat Medic","text":"หาก Long Rest สามารถทอย 12 Medical Check เลือกรักษา Tough ทั้งหมดของพันธมิตรหนึ่งคนได้"}],"profLabel":"เลือก Proficiency"}}},{"id":"lore","nameEn":"Lore","nameTh":"ความรอบรู้","stats":["INF","INT"],"levels":{"0":{"text":"สามารถรับรู้เรื่องในดินแดนที่ตนอาศัยด้วย 8 Lore Check","proficiencies":[],"profLabel":""},"1":{"text":"สามารถเรียนรู้ประวัติศาสตร์ ศาสนา เผ่า อักษรที่ไม่รู้จักและการเมืองโดยสังเขป ด้วย 10 Lore Check","proficiencies":[{"name":"Student of the Past","text":"ได้รับ Advantage ในการทอย Lore Check ที่เกี่ยวข้องกับการระบุอายุวัตถุโบราณ การตีความจารึก หรือการวิเคราะห์เหตุการณ์ในอดีต"},{"name":"Student of Laws","text":"ได้รับ Advantage ในการทอย Lore Check ที่เกี่ยวข้องกับกฎหมาย การเมืองท้องถิ่น มารยาททางสังคม หรือการตรวจสอบเอกสารราชการ"},{"name":"Faith Keeper","text":"ได้รับ Advantage ในการทอย Lore Check ที่เกี่ยวข้องกับศาสนศาสตร์ การระบุตัวตนของผู้นับถือ หรือการตีความความหมายของวัตถุมงคล , เลือกความเชื่อต่อไปนี้"},{"name":"(Initial Blood - จันทร์โลหิต)","text":"หาก Short Rest สามารถฟื้นฟู 1 HP เพิ่มเติมให้กับพันธมิตรทุกคน"},{"name":"(Shadow Embrace - บุตรราตรี)","text":"หากยืนอยู่ในเงามืดแล้วพยายามลอบเร้น (Stealth) จะได้รับ AGI Advantage , เป้าหมายที่พยายามองหาคุณในที่ที่มีแสงน้อยจะได้รับ Disadvantage"},{"name":"(The Hidden Sun - เงาสุริยันต์)","text":"สามารถจ่าย 1 MP เพื่อจุดไฟ หรือก่อกองเพลิงขนาดเล็กได้"},{"name":"(Uncharted Paths - นอกรีต)","text":"การเรียนรู้ความรู้ต้องห้าม และการผูกพันธมิตรกับเผ่าพันธ์ุอื่นที่ต่างจากคุณ ยกเว้นไตรมรณา จะได้รับ Advantage"}],"profLabel":"เลือก Proficiency"},"2":{"text":"สามารถรู้เรื่องอดีต และปัจจุบันของตัวบุคคลดัง ด้วย 12 Lore Check","proficiencies":[{"name":"Ancient Archivist","text":"สามารถเชื่อมโยงเหตุการณ์ในอดีตที่ดูเหมือนไม่เกี่ยวข้องกันเพื่อวิเคราะห์กับสถานการณ์ปัจจุบัน หรือคาดการณ์แนวโน้มที่จะเกิดขึ้นในอนาคตอันใกล้ได้อย่างมีเหตุผล"},{"name":"Lawmaker","text":"ความรู้ของคุณครอบคลุมระบบกฎหมาย , โครงสร้างทางการเมือง , และธรรมเนียมการปกครองของหลายอาณาจักรและวัฒนธรรม คุณสามารถวิเคราะห์ข้อกฎหมายที่ซับซ้อน , หาช่องโหว่ , ตีความเจตนารมณ์ , หรือใช้ความรู้เพื่อสร้างความได้เปรียบในการเจรจาต่อรองหรือการว่าความได้ด้วย 12 Lore Check"},{"name":"Truth Seeker","text":"เลือกความเชื่อต่อไปนี้ หากมีความเชื่อก่อนหน้าจะเลือกได้แค่ความเชื่อเดียวกันเท่านั้น หาก Long Rest สามารถทำพิธีกรรมซับซ้อนเหล่านี้ได้"},{"name":"(Purifier - จันทร์โลหิต)","text":"สามารถชะล้างแหล่งน้ำให้สะอาดด้วยเลือด , ฟื้นฟู 1 Sanity ให้กับพันธมิตรทุกคนที่ Long Rest"},{"name":"(Guardian of Night - บุตรราตรี)","text":"คุณสามารถเขียนอักขระ กางอาณาเขต ทำให้โดยรอบแคมป์ที่คุณอยู่อาศัยปลอดภัยจากมอนสเตอร์"},{"name":"(Enlightened Flames - เงาสุุริยันต์)","text":"หนึ่งครั้งต่อ Session หากมีแสงไฟ สามารถทอย 12 INT Check หาก Success จะได้เรียนรู้ Knowledge ใด ๆ 1 EXP หรือสอน Knowledge ที่คุณมีให้กับพันธมิตร 2 EXP หากเก็บครบ 10 EXP จะสามารถ Upgrade Knowledge นั้นได้"},{"name":"(Unbound Spirits - นอกรีต)","text":"ป้องกันการโจมตีทาง Psychic และ Sanity ด้วย Advantage"}],"profLabel":"เลือก Proficiency"},"3":{"text":"สามารถรู้อนาคตที่กำลังจะเกิดในอีกไม่กี่วินาที ด้วย 14 Lore Check","proficiencies":[{"name":"Memories Sanctuary","text":"หาก Long Rest หรืออยู่ในสถานการณ์ที่สำคัญ จะสามารถหยั่งรู้อดีตของบุคคล , สถานที่ , หรือวัตถุสำคัญหนึ่งชิ้น เพื่อค้นพบความลับ , เหตุการณ์สำคัญ , จุดเปลี่ยน , หรือความเชื่อมโยงที่ถูกปกปิดหรือบิดเบือนไปจากความเป็นจริงได้"},{"name":"Paragon of Order","text":"หาก Long Rest หรือเมื่อมีอำนาจและทรัพยากรเพียงพอ จะสามารถร่างรัฐธรรมนูญหรือวางระบบกฎหมายใหม่ให้กับชุมชนหรือองค์กร ซึ่งจะมีผลผูกพันและเปลี่ยนแปลงโครงสร้างอำนาจได้ และมีอำนาจชี้ขาดข้อพิพาททางกฎหมายที่ซับซ้อนได้"},{"name":"Beliver of Divine","text":"เลือกความเชื่อต่อไปนี้ หากมีความเชื่อก่อนหน้าจะเลือกได้แค่ความเชื่อเดียวกันเท่านั้น"},{"name":"(Luna Incarnate - จันทร์โลหิต)","text":"ได้รับ Skill Carion: Electrical และ Bleeding Immunity และการ Parry ด้วยแขนที่ Success จะไม่เสีย HP , สามารถยืดอวัยวะต่างๆ ให้เป็นรยางค์ด้วยความยาวสองเท่าจากขนาดตัวคุณได้ , โดน Fire Damage x2 , หากเป็น Carrion Caretaker อยู่แล้วจะลบล้างสถานะ โดน Fire Damage x2 ออกและเปลี่ยนชื่อเป็น Carion Prime แทน"},{"name":"(Yantra - นอกรีต)","text":"หนึ่งครั้งต่อ Session หากมีหมึกอาคม สามารถ Long Rest เพื่อเปลี่ยน 1 Sorcery Skill ให้ใช้เป็น Reaction Sorcery ได้"},{"name":"(Dawnbringer - เงาสุริยันต์)","text":"หนึ่งครั้งต่อ Session หากมีแสงไฟ สามารถทอย 12 INT Check หาก Success จะสามารถสอนหรือเรียนรู้ Tactical Skill กับพันธมิตรได้"}],"profLabel":"เลือก Proficiency"}}},{"id":"nature-survival","nameEn":"Nature & Survival","nameTh":"ธรรมชาติเเละการเอาตัวรอด","stats":["PER","VIT"],"levels":{"0":{"text":"จุดไฟ ผ่าฟืน หาของป่า ตามรอยเท้า 8 Nature Check","proficiencies":[],"profLabel":""},"1":{"text":"จำเสียงของสัตว์ได้ แยกแยะมอนเตอร์กับสัตว์ และพืชพิษได้ ด้วย 8 Nature Check","proficiencies":[{"name":"Hunter","text":"ได้รับ Advantage ในการทอย PER Check เพื่อตามรอย (Track) สัตว์หรือบุคคลในสภาพแวดล้อมธรรมชาติ ไม่ว่าร่องรอยนั้นจะจางหายเพียงใด , สามารถสร้างกับดักสัตว์ขนาดเล็กถึงขนาดกลาง หรือกับดักเพื่อเตือนภัยจากวัสดุธรรมชาติ (ไม้ , กระดูก , เถาวัลย์ , หิน)"},{"name":"Herbalist","text":"ได้รับ Advantage ในการทอย INT หรือ PER Check เพื่อค้นหาและระบุชนิดของพืชพรรณ เห็ดรา หรือผลไม้ป่า ว่าสิ่งใดกินได้ เป็นยา หรือมีพิษร้ายแรง"},{"name":"Wanderer","text":"สามารถทำ 12 PER Check คาดการณ์การเปลี่ยนแปลงของสภาพอากาศในระยะสั้นถึงระยะกลางได้อย่างแม่นยำ จากการสังเกตเมฆ , ลม , และพฤติกรรมของสัตว์ และสามารถนำทางในพื้นที่ที่ไม่คุ้นเคยได้โดยลักษณะทางภูมิศาสตร์ , เมื่อ Rest สามารถทอย 10 INT Check เพื่อคาดการสภาพอากาศวันถัดไปได้ , ได้รับ PER Advantage ในการหาทิศทาง"}],"profLabel":"เลือก Nature & Survival Proficiency"},"2":{"text":"","proficiencies":[{"name":"Predator","text":"มีความรู้เรื่องถิ่นที่อยู่อาศัยของสัตว์, มีโอกาสได้รับทรัพยากรเนื้อเพิ่มขึ้น 2 ชิ้น หากทอยชำแหละได้เลขคู่ , หากซ่อนตัว (Stealth) แล้ว Ambush สำเร็จจะทำให้คุณสามารถ Attack Roll เป็น Free Action ทันที 1 ครั้ง"},{"name":"Botanist","text":"สามารถคาดการณ์ได้ว่าพืชพรรณที่มีคุณสมบัติพิเศษชนิดใดจะพบได้ในพื้นที่และฤดูกาลใดเป็นพิเศษ และสามารถ \"ชำระ\" อาหารและน้ำที่ปนเปื้อน (พิษหรือความสกปรก) ได้ด้วย 10 Nature & Survival Check"},{"name":"Pathfinder","text":"พันธมิตรและคุณได้รับ Advantage ในการทอย VIT เพื่อต้านทานผลกระทบจากสภาพอากาศที่เลวร้าย"}],"profLabel":"เลือก Nature & Survival Proficiency"},"3":{"text":"เข้าฌาน ด้วย 12 Nature Check","proficiencies":[{"name":"Beast Slayer","text":"+1 Combat Dice เมื่อ Attack และ +1 Parry Dice เมื่อ Defend จากเป้าหมายที่เป็น Monster และ Beast"},{"name":"Druid","text":"สื่อสารกับธรรมชาติได้ด้วย 12 Nature Check , หากทำการ Long Rest สามารถทำพิธีวงแหวนนางฟ้า เพื่อให้ได้รับไอเทมประเภทพืชแบบสุ่ม 1 อย่าง (ทอยจำนวนด้วย 1D6) จากภูมิประเทศที่ตนตั้งแคมป์อยู่ , หากเป็นเผ่าพฤกษาจะได้รับ 2 อย่าง (2D6) แทน"},{"name":"Wastelander","text":"ความต้องการอาหารลดลง , อดอาหารได้ 2 วัน ถึงจะติดสถานะ Starve หากเป็นเคอร์ซิกันจะอดอาหารได้ 3 วันแทน , หากมีอาการเจ็บป่วยจะเริ่มทอย Recovery Check (VIT) ที่ 12 DC แทน (ปกติ 14 DC)"}],"profLabel":"เลือก Nature & Survival Proficiency"}}},{"id":"range","nameEn":"Range","nameTh":"ต่อสู้ระยะไกล","stats":["AGI","PER"],"levels":{"0":{"text":"ความแม่นยำในระยะ 10 เมตร (หากไกลเกินกว่านั้น -1 CV ต่อระยะ 10 เมตร)","proficiencies":[],"profLabel":""},"1":{"text":"ความแม่นยำในระยะ 30 เมตร (หากไกลเกินกว่านั้น -1 CV ต่อระยะ 10 เมตร), สามารถ Overwatch ด้วยอาวุธระยะไกลได้","proficiencies":[{"name":"Archer","text":"ลดราคาซื้อหัวลูกศรทุกชนิด 1 เหรียญ และประดิษฐ์หัวลูกศรเองได้จากไม้และขนนก"},{"name":"Marksman","text":"หลังการ Focus ด้วยอาวุธปืนหรืออุปกรณ์ จะ +2 CV หรือ +2 Damage Mod. ให้กับการยิงอาวุธปืนหรืออุปกรณ์ครั้งถัดไป"},{"name":"Trickster","text":"อาวุธมือเดียวทุกชนิดนับว่ามีสถานะ Throwable และ +1 PDMG ให้กับการปาอาวุธที่มี Throwable"}],"profLabel":"เลือก Weapon Proficiency"},"2":{"text":"ความแม่นยำในระยะ 50 เมตร (หากไกลเกินกว่านั้น -1 CV ต่อระยะ 10 เมตร), อาวุธระยะไกลสามารถ Focus หลัง Maneuver ได้","proficiencies":[{"name":"Archer II","text":"ธนูสามารถ Focus เพื่อทำ Ricochet Shot โจมตีเป้าหมายที่อยู่หลังที่กำบังได้ (เป้าหมายไม่ได้ Advantage จากที่กำบัง)"},{"name":"Marksman II","text":"อาวุธปืนและหน้าไม้สามารถบรรจุกระสุนด้วย Cast Action ได้"},{"name":"Trickster II","text":"เพิ่มขีดจำกัดการปาอาวุธจากสถานะ Throwable เป็นสูงสุดครั้งละ 2 ชิ้น"}],"profLabel":"เลือก Weapon Proficiency"},"3":{"text":"ความแม่นยำในระยะ 100 เมตร (นอกระยะ Combat, หากไกลเกินกว่านั้น -1 CV ต่อระยะ 10 เมตร)","proficiencies":[{"name":"Archer III","text":"ธนูสั้นสามารถ Focus เพื่อรับสถานะ Armor Penetrate ให้กับการ Range Attack ครั้งถัดไป"},{"name":"Marksman III","text":"อาวุธปืนมานาสามารถ ทำ Focus เพื่อ Overcharge ได้ Free แม้จะ Maneuver ไปแล้วในเทิร์นนี้"},{"name":"Trickster III","text":"สามารถร่าย Sorcery ประเภทเสริมพลัง ลงอาวุธหรืออุปกรณ์ที่มี Throwable ได้โดยจ่าย MP ครึ่งเดียว Overcharge คือ การจ่าย MP เท่ากับ Weapon Damage เพื่อเพิ่ม Plasma Damage 1d6 เพิ่มเติมให้กับการโจมตีครั้งถัดไป"}],"profLabel":"เลือก Weapon Proficiency"}}},{"id":"scavenging","nameEn":"Scavenging","nameTh":"การขุดค้น","stats":["PER","VIT"],"levels":{"0":{"text":"การหาของพื้นฐานที่ควรมี ณ สถานที่ใดๆ 8 Scavenging Check","proficiencies":[],"profLabel":""},"1":{"text":"สามารถขุดแร่โลหะ , คริสตัล และโบราณวัตถุ ด้วย 8 Scavenging Check","proficiencies":[{"name":"Miner","text":"ได้รับ Advantage ในการขุดดินหรือหิน , สามารถปีนภูเขาและแทรกช่องแคบด้วย Advantage"},{"name":"Tailor","text":"ได้รับ Advantage ในการทอย Scavenging Check เมื่อค้นหาเศษผ้า , เครื่องนุ่งห่มที่ยังอยู่ในสภาพดี , ชิ้นส่วนเครื่องหนัง , หรือเส้นใยธรรมชาติในซากปรักหักพังหรือแหล่งทิ้งร้าง และสามารถ ซ่อมแซมเสื้อผ้า , เกราะหนังเบา , หรืออุปกรณ์ที่ทำจากวัสดุเหล่านี้ในระดับพื้นฐาน"},{"name":"Salvager","text":"ได้รับ Advantage ในการทอย Scavenging Check เมื่อค้นหาเศษโลหะ , ส่วนประกอบทางกลไกพื้นฐาน (เช่น ฟันเฟือง , สปริง , ท่อ) , หรือเครื่องมือง่ายๆ ที่ยังพอจะชำแหละหรือนำมาดัดแปลงได้ , สามารถแยกชิ้นส่วนอุปกรณ์ที่ไม่ซับซ้อน เพื่อนำส่วนประกอบที่มีประโยชน์ออกมาได้อย่างปลอดภัย ด้วยการทอย 10 Scavenging Check"}],"profLabel":"เลือก Scavenge Proficiency"},"2":{"text":"สามารถขุดแร่หายาก บัลลาเดียม , อดาแมนเทียม , แมนนาร์อ็อกไซน์ , กลาสสตีล , อัญมณี ด้วย 10 Scavenging Check","proficiencies":[{"name":"Prospector","text":"ได้รับ Advantage ในการทอย Scavenging Check เมื่อต้องการค้นหา , ขุดเจาะ , หรือสกัดทรัพยากรแร่ธาตุและโลหะ"},{"name":"Slik Weaver","text":"สามารถแยกชิ้นส่วนเสื้อผ้า , เกราะหนัง , หรืออุปกรณ์ที่ซับซ้อน เพื่อนำวัสดุที่ดีที่สุดกลับมาใช้ใหม่ , เสริมความแข็งแรงและความทนทานให้กับเครื่องแต่งกายหรืออุปกรณ์ที่ทำจากผ้าและหนัง"},{"name":"Salvage Expert","text":"สามารถแยกชิ้นส่วนเครื่องจักรหรือกลไกที่ซับซ้อน เพื่อนำชิ้นส่วนหายากหรือวัสดุพิเศษกลับมาใช้ใหม่ได้ด้วย 12 Scavenging Check , มีโอกาสที่จะค้นพบแบบแปลน (Blueprint) หรือเรียนรู้เทคโนโลยีจากอุปกรณ์ที่แยกชิ้นส่วน"}],"profLabel":"เลือก Scavenge Proficiency"},"3":{"text":"สามารถหาแร่ในตำนานได้ ด้วย 14 Scavenging Check","proficiencies":[{"name":"Master Miner","text":"คุณรู้ตำแหน่งของสายแร่ในตำนานที่ไม่มีใครรู้จัก และสามารถขุดมันขึ้นมาได้โดยไม่ทำให้เสียหาย"},{"name":"Artisan Tailor","text":"สามารถสร้างสรรค์เสื้อผ้าหรือเครื่องป้องกันจากวัสดุในตำนานที่หามาได้ มอบค่าสถานะพิเศษหรือความสามารถใหม่ๆ ให้กับผู้สวมใส่"},{"name":"Master Salvager","text":"สามารถกู้คืนเทคโนโลยีโบราณหรือเวทมนตร์ที่สูญหายจากซากปรักหักพังในตำนานได้สำเร็จ และสามารถนำกลับมาสร้างใหม่หรือซ่อมแซมให้ใช้งานได้อีกครั้ง"}],"profLabel":"เลือก Scavenge Proficiency"}}},{"id":"sorceries","nameEn":"Sorceries","nameTh":"ศาสตร์เวท","stats":["INT","INF"],"levels":{"0":{"text":"ใช้งานเวทมนตร์ขั้น Novice ได้","proficiencies":[],"profLabel":""},"1":{"text":"ใช้งานเวทมนตร์ขั้น Expert ได้","proficiencies":[{"name":"Attunement","text":"หากอยู่ใกล้สิ่งแวดล้อมที่คล้ายกับ Sorceries ของคุณ (เช่น ฝนตกแล้วใช้เวทน้ำ) ก่อนใช้ Sorcery สามารถทอย 10 INT Check เพื่อดึงธาตุที่อยู่ใกล้ๆ มาช่วยร่าย หากสำเร็จจะส่งผลให้ Sorcery นั้น -1 Mana Cost"},{"name":"Enchanter","text":"หนึ่งครั้งต่อรอบการเล่น สามารถประกาศเสริมความรุนแรงของ Sorcery ที่ทำ Attack Roll ได้ ด้วยการทอย 10 VIT Saving Throw หากสำเร็จทำการทอย 1d6 Damage เพิ่มเติม หากล้มเหลว ทำการทอย 1d3 Damage เพิ่มเติม และคุณจะติดสถานะ Prone หลังใช้ Sorcery นั้น"},{"name":"Slayer Aura","text":"ใช้ได้ 1 ครั้งต่อ Short Rest, สามารถทอย 10 INF เพื่อแผ่จิตสังหาร หาก Success จะทำให้การทอย Intimidate ครั้งถัดไปได้รับ Advantage"}],"profLabel":"เลือก Sorceries Proficiency"},"2":{"text":"ใช้งานเวทมนตร์ขั้น Master ได้, ทุกเวทที่ใช้นับจากนี้ไม่ต้องใช้ Utterance (U)","proficiencies":[{"name":"Recaller","text":"หลังการใช้ Sorceries ประเภท Attack หาก Failed ทอย 12 INT Check เพื่อคืน Mana ที่ใช้ไปกลับมาได้ครึ่งหนึ่ง"},{"name":"Channeler","text":"เมื่อใช้ Sorcery ที่สั่งเป้าหมายทอย Saving Throw หรือพยายามหลบการตรวจจับจะ +1 DC ให้กับ Sorcery นั้น"},{"name":"Psychic","text":"สามารถประกาศ Cast เพื่อใช้ 12 INT Check ในการอ่านอารมณ์หรือพฤติกรรมของบุคคลได้"}],"profLabel":"เลือก Sorceries Proficiency"},"3":{"text":"ปลดล็อคคุณสมบัติที่ 3 ของเวทมนตร์, ทุกเวทที่ใช้นับจากนี้ไม่ต้องใช้ Gesture (G)","proficiencies":[{"name":"Dual Caster","text":"สามารถร่าย 2 Sorceries พร้อมกัน ใน 1 Action ได้โดยจ่าย MP เพียงครึ่งเดียวปัดเศษลง แต่ทั้งสอง Sorceries จะต้องมีประเภท Sorcery ที่ต่างกัน"},{"name":"Arc-Nova","text":"สามารถประกาศ Cast ด้วย Proficiency นี้ และทำการทอย 12 VIT Check เพื่อดูดพลังงานมานาจากรอบข้างมาใช้ หากสำเร็จจะทำให้คุณติดสถานะ Energize (ทุกครั้งที่ทอยติด Perfect Strike คุณจะได้รับ 1 Instant Action) จนถึงเทิร์นการเล่นถัดไปของคุณ"},{"name":"Substitution","text":"จ่าย 1 Action Point เพื่อทำให้ Skill ในเทิร์นนี้ที่ร่ายด้วย Sanity สามารถจ่ายได้ด้วย 5 MP แทน 1 Sanity และ Skill ที่ร่ายโดยใช้ Mana สามารถจ่าย 1 Sanity แทน 5 MP ได้, เวทที่ร่ายด้วยจิตจะสามารถใช้เป็น Swift Action"}],"profLabel":"เลือก Sorceries Proficiency"}}},{"id":"melee","nameEn":"Melee","nameTh":"ต่อสู้ระยะใกล้","stats":["STR","VIT"],"levels":{"0":{"text":"ชำนาญระดับชาวบ้าน","proficiencies":[],"profLabel":""},"1":{"text":"","proficiencies":[{"name":"Blade Master","text":"อาวุธมีคม (Rip) มีสถานะ \"หาก Parry สำเร็จจะได้รับ Perfect Strike ให้กับ Melee Attack ครั้งถัดไปของคุณ\" เพิ่มเติม"},{"name":"Overseer","text":"หลังทำ Overwatch จะสามารถเลือก 1 เป้าหมาย ที่อยู่ใน Engagement Zone ของคุณเพื่อทำการ Overwatch ให /* ---- DOM helpers (textContent only: ข้อมูลจาก db ถือว่าไม่น่าไว้ใจเสมอ) ---- */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid == null || kid === false) continue;
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
const $ = (sel, root=document) => root.querySelector(sel);
function clear(e){ while (e.firstChild) e.removeChild(e.firstChild); return e; }
function tag(text, cls){ return h('span', {class:'tag' + (cls ? ' ' + cls : ''), text}); }
function signed(n){ return (n > 0 ? '+' : '') + n; }
function uid(){ const a='abcdefghijkmnpqrstuvwxyz23456789'; let s=''; const r=crypto.getRandomValues(new Uint8Array(12)); for (const b of r) s+=a[b%a.length]; return s; }
let toastT=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add('hidden'), 3200); }
function modal(content){ const m=$('#modal'); clear(m); if(!content){ m.classList.add('hidden'); return; }

/* ---- Dice: 2d6 ตามไฟล์แกน, Advantage/Disadvantage = 3d6 เก็บ 2 ดี/แย่ ---- */
function rollD6(){ return 1 + (crypto.getRandomValues(new Uint8Array(1))[0] % 6); }
function roll2d6(mode='normal'){
  const n = mode === 'normal' ? 2 : 3;
  const dice = Array.from({length:n}, rollD6);
  let kept;
  if (mode === 'adv') kept = [...dice].sort((a,b)=>b-a).slice(0,2);
  else if (mode === 'dis') kept = [...dice].sort((a,b)=>a-b).slice(0,2);
  else kept = dice.slice();
  // mark which indexes were dropped (one die only)
  const keptIdx = [];
  const pool = kept.slice();
  dice.forEach((d,i)=>{ const j = pool.indexOf(d); if (j>=0){ pool.splice(j,1); keptIdx.push(i);} });
  const sum = kept[0]+kept[1];
  const crit = kept[0]===6 && kept[1]===6 ? 'success' : (kept[0]===1 && kept[1]===1 ? 'failure' : null);
  const dbl = kept[0]===kept[1];
  return {dice, kept, keptIdx, sum, crit, double: dbl, mode};
}
/* ตัดสินผลเฉพาะเมื่อระบุ DC: ถึง DC = สำเร็จ, [6,6]/[1,1] ตัดสินทันที · ไม่ระบุ DC = ไม่บอกสำเร็จ/ล้มเหลว (อาจเป็นทอย Parry หรือทอยที่ GM ตัดสินเอง) บอกแค่ว่าออกคู่ */
function judge(total, r, dc){
  if (dc != null){
    if (r.crit === 'success') return {cls:'res-crit', text:'Critical Success [6,6] ผ่านทันที'};
    if (r.crit === 'failure') return {cls:'res-crit', text:'Critical Failure [1,1] ล้มเหลวทันที'};
    return total >= dc ? {cls:'res-full', text:`สำเร็จ (ถึง DC ${dc})`} : {cls:'res-fail', text:`ล้มเหลว (DC ${dc})`};
  }
  if (r.double) return {cls:'res-crit', text:`ออกคู่ [${r.kept[0]},${r.kept[1]}]`};
  return {cls:'', text:''};
}
/* ทอยป้องกัน (Parry/Evade): DC = ผลทอยโจมตีของอีกฝ่าย · เท่ากัน = Perfect (ได้ 1 AP คืน) · ไม่ใส่ DC = ไม่ตัดสิน */
function judgeDefense(total, dc, kind){
  const nm = kind==='parry' ? 'Parry' : 'Evade';
  if (dc == null) return {cls:'', text:''};
  if (total === dc) return {cls:'res-crit', text:`Perfect ${nm} (เท่ากับ ${dc} ได้ 1 AP คืน)`};
  return total > dc ? {cls:'res-full', text:`ป้องกันได้ (${total} > ${dc})`} : {cls:'res-fail', text:`ป้องกันไม่ได้ (${total} < ${dc})`};
}
/* ค่าซื้อด้วย Insight Point (ตารางในไฟล์แกน): Mod ติดลบ→0 ขั้นละ 3 · 0→1 3 · 1→2 4 · 2→3 5 · 3→4 6 · 4→5 7 · Knowledge Level Up 4 / 6 / 9 */
function ipCostStat(mod){ if (mod >= 5) return null; if (mod < 0) return 3; return [3,4,5,6,7][mod]; }
function ipCostKnowledge(level){ if (level >= 3) return null; return [4,6,9][level]; } // ผู้ใช้เคาะ 29 ส.ค. 2026 (บทที่ 13 V.3): Lv1 4 · Lv2 6 · Lv3 9 IP
function renderDice(r){
  return h('span', {class:'inline-roll'}, r.dice.map((d,i)=>h('span',{class:'die' + (r.keptIdx.includes(i)?'':' drop'), text:d})));
}

/* ---- Character model & computation ---- */
/* สำเนาที่ส่งเข้าห้อง: โหมด "full" = ทั้งชีท · โหมด "min" = เฉพาะค่าที่หมากและ GM ต้องใช้ (ชื่อ รูป วงศา HP Sanity สถานะ) */
function roomCopyOf(copy){
  if ((copy.shareMode||'full') !== 'min') return copy;
  const cur = copy.current || {};
  return { id: copy.id, name: copy.name, kin: copy.kin, size: copy.size, portrait: copy.portrait||null, ownerId: copy.ownerId, ownerName: copy.ownerName, shareMode: 'min', done: true, updatedAt: copy.updatedAt,
    current: { hp: cur.hp, mp: cur.mp, sanity: cur.sanity, temp: cur.temp, tough: cur.tough || {} }, armor: copy.armor || {}, details: { appearance: (copy.details||{}).appearance || '', signature: (copy.details||{}).signature || '' } };
}
/* ลบลิงก์ห้องที่ค้าง: ห้องถูกลบ หรือหมากของตัวละครถูกเอาออกไปแล้วขณะเราไม่อยู่ */
async function pruneRoomLinks(){
  if (!Store.db || Store.backend!=='firebase') return;
  const seen = {};
  for (const c of Store.chars){ if (!Store.isMine(c) || !(c.roomIds||[]).length) continue;
    for (const rid of [...c.roomIds]){
      try { if (!(rid in seen)) seen[rid] = docData(await Store.db.doc('rooms/'+rid).get()); } catch(e){ seen[rid] = undefined; }
      const room = seen[rid]; if (room === undefined) continue; // อ่านไม่ได้ (ห้องล็อกและเราไม่ใช่สมาชิก) ปล่อยไว้
      if (!room || !(room.tokens||[]).some(t=>t.charId===c.id)) Store.unshareFromRoom(c, rid);
    }
  }
}
function newChar(){
  return { id: uid(), name:'', kin:null, size:null, childhood:null, adulthood:null, evolver:{kin:null, pick:null, hindrance:null},
    personality:{}, extra:{}, choiceStats:[], talent:null, talentPicks:{}, knowledge:{}, prof:{}, skills:[], grants:[],
    adaptation:null, starterSet:null, details:{likes:'',dislikes:'',fears:'',backstory:'',appearance:'',signature:''},
    current:null, notes:'', createdAt:Date.now(), updatedAt:Date.now(), ownerId:null, step:0 };
}
const modOf = v => Math.max(-5, Math.min(5, Math.floor(v/2) - 5));

function findBg(kin, code){
  if (!kin || !code) return null;
  for (const list of ['childhood','specialChildhood','adulthood','specialAdulthood'])
    for (const b of kin[list]) if (b.code === code) return b;
  return null;
}
function compute(c){
  const kin = c.kin ? KIN[c.kin] : null;
  const raw = Object.fromEntries(STATS.map(s=>[s, kin ? (kin.raw[s]||0) : 0]));
  const from = Object.fromEntries(STATS.map(s=>[s, []]));
  const addStats = (obj, label) => { for (const [k,v] of Object.entries(obj||{})) if (STATS.includes(k)) { raw[k]+=v; from[k].push(`${label} ${signed(v)}`); } };
  const ch = findBg(kin, c.childhood), ad = findBg(kin, c.adulthood);
  if (ch) addStats(ch.stats, 'วัยเด็ก');
  if (ad) addStats(ad.stats, 'วัยผู้ใหญ่');
  for (const s of c.choiceStats||[]) { raw[s]+=1; from[s].push('พื้นหลัง (เลือก) +1'); }
  for (const [k,v] of Object.entries(c.extra||{})) if (v) { raw[k]+=v; from[k].push(`Extra ${signed(v)}`); }
  for (const [k,v] of Object.entries(c.ipStats||{})) if (v) { raw[k]+=v; from[k].push(`IP ${signed(v)}`); }
  const mod = Object.fromEntries(STATS.map(s=>[s, modOf(raw[s])]));
  const extraTotal = kin ? kin.extra : 0;
  const extraUsed = Object.values(c.extra||{}).reduce((a,b)=>a+(b||0),0);
  const size = c.size || (kin ? kin.sizes[0] : 'Medium');
  let capMult = {Small:3, Medium:3, Large:4, Huge:5}[size] || 3;
  let capNote = size==='Small' ? 'Small ใช้ตัวคูณเดียวกับ Medium' : '';
  if (kin && kin.id==='handerlaw-dwarves') { capMult = 4; capNote = 'Powerful Build: นับขนาดใหญ่ขึ้นหนึ่งขั้นเรื่องการแบก จึงใช้ ×4'; }
  const toughSizeBonus = {Large:1, Huge:2}[size] || 0; // ชีท Duck Family (AX2) และกฎ Bestiary: Large +1, Huge +2
  const tough = Math.floor((raw.VIT + raw.STR)/10) + 1 + toughSizeBonus;
  const d = {
    raw, mod, from, extraTotal, extraUsed, extraLeft: extraTotal - extraUsed, size,
    hp: 10 + mod.VIT + mod.STR,
    mp: 10 + mod.INF + mod.INT,
    sanity: 5 + mod.INF,
    toughness: tough, toughSizeBonus,
    passivePer: 7 + mod.PER,
    capacity: raw.STR * capMult, capMult, capNote,
    // ค่าพลังรอง (Ability Stats) ตามตารางค่าสถานะศักยภาพที่ล็อก 9 พ.ย. 2026
    fortitude: mod.VIT, will: mod.PER, reflex: Math.floor(mod.AGI/2)+1, sight: Math.floor(mod.PER/2)+1,
    might: Math.floor(mod.STR/2)+1, initiative: mod.PER, parryDice: Math.max(0, (c.current && c.current.parryBonus) || 0), combatDice: '2d6',
    speed: kin ? kin.speed : '',
    highest: [], knowledgeMods: {},
  };
  const best = Math.max(...STATS.map(s=>mod[s]));
  d.highest = STATS.filter(s=>mod[s]===best);
  for (const k of DATA.knowledge){ const lvl = c.knowledge[k.id]||0; const profs = (c.prof[k.id]||[]).length; d.knowledgeMods[k.id] = {level: lvl, prof: Math.max(lvl, profs)}; }
  return d;
}
function personalityValue(c, axisId){ const p = c.personality[axisId]; if (!p || p.value==null) return null; return p; }
/* คู่บุคลิกภาพ: ฝั่งที่เลือกเป็นบวก ฝั่งตรงข้ามติดลบเท่ากัน */
function persMod(c, side){ // side = 'Logic' etc.
  for (const ax of DATA.meta.personality){
    const p = c.personality[ax.id]; if (!p || p.value==null) continue;
    if (ax.left === side) return p.side==='left' ? p.value : -p.value;
    if (ax.right === side) return p.side==='right' ? p.value : -p.value;
  }
  return 0;
}
function budgetState(c){
  const used = []; for (const ax of DATA.meta.personality){ const p=c.personality[ax.id]; if (p && p.value!=null) used.push(p.value); }
  const pool = DATA.meta.personalityBudget.slice();
  const left = pool.slice(); for (const v of used){ const i=left.indexOf(v); if(i>=0) left.splice(i,1); }
  return {used, left};
}

/* ---- Storage: localStorage เสมอ + db เมื่อมี ---- */
const LS_KEY = 'kirana.chars.v1';
function loadLocal(){ try { return JSON.parse(localStorage.getItem(LS_KEY)||'[]'); } catch(e){ return []; } }
function saveLocal(list){ try { localStorage.setItem(LS_KEY, JSON.stringify(list)); } catch(e){} }
const Store = {
  chars: loadLocal(), db:null, user:null, room:null, me:null, isOwner:false, canWrite:null, online:false, backend:null,
  displayName:'', isDevUid:false, onlineUsers:[],
  listeners: new Set(),
  notify(){ for (const f of this.listeners) try{ f(); }catch(e){ console.error(e);} },
  upsert(c){ c.updatedAt = Date.now(); const i=this.chars.findIndex(x=>x.id===c.id); if(i>=0) this.chars[i]=c; else this.chars.push(c); saveLocal(this.chars); this.notify();
    if (this.db && this.me && this.canWrite!==false){ const copy = JSON.parse(JSON.stringify(c)); copy.ownerId = copy.ownerId || this.me; if (!c.ownerId) c.ownerId = copy.ownerId; copy.ownerName = this.displayName||copy.ownerName||''; this.db.doc('chars/'+c.id).set(copy).catch(e=>console.warn('db set', e));
      const roomCopy = roomCopyOf(copy); for (const rid of c.roomIds||[]) this.db.doc(`rooms/${rid}/chars/${c.id}`).set(roomCopy).catch(()=>{}); } },
  /* ตัวละครอยู่ในแคมเปญ (ถูกวางลงบอร์ดห้องใดห้องหนึ่ง) → ล็อกไม่ให้กลับไปแก้ในวิซาร์ด */
  inCampaign(c){ return !!(c && (c.roomIds||[]).length); },
  /* แชร์สำเนาชีทเข้าห้อง: GM และผู้เล่นในห้องเห็นได้เฉพาะตัวละครที่ถูกหยิบมาเล่นในแคมเปญนี้ */
  shareToRoom(c, rid){ c.roomIds = [...new Set([...(c.roomIds||[]), rid])]; this.upsert(c); },
  /* ถอนตัวละครออกจากห้อง: เลิกซิงก์และลบสำเนาในห้อง */
  unshareFromRoom(c, rid){ if (!c) return; c.roomIds = (c.roomIds||[]).filter(x=>x!==rid); if (this.isMine(c)) this.upsert(c); if (this.db) this.db.doc(`rooms/${rid}/chars/${c.id}`).delete().catch(()=>{}); },
  remove(id){ const c = this.get(id); this.chars = this.chars.filter(x=>x.id!==id); saveLocal(this.chars); this.notify(); if (this.db){ this.db.doc('chars/'+id).delete().catch(()=>{}); for (const rid of (c&&c.roomIds)||[]) this.db.doc(`rooms/${rid}/chars/${id}`).delete().catch(()=>{}); } },
  get(id){ return this.chars.find(x=>x.id===id) || (typeof Table!=='undefined' && Table.roomChars.find(x=>x.id===id)) || null; },
  isMine(c){ return !c.ownerId || !this.me || c.ownerId===this.me; },
  canEdit(c){ return this.isMine(c) || this.isDevUid; },
};
async function initCapabilities(){
  if (window.claude && window.claude.use){
    try {
      const [db, user, room] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('room')]);
      Store.db = db; Store.user = user; Store.room = room; Store.backend = 'claude';
      if (user){ try { Store.me = await user.id(); } catch(e){} try { Store.isOwner = !!user.isOwner(); } catch(e){} try { Store.canWrite = user.can('data.write'); } catch(e){} }
    } catch(e){ console.warn('capabilities', e); }
  } else if (window.KIRANA_FIREBASE && window.KIRANA_FIREBASE.projectId){
    try { await initFirebase(window.KIRANA_FIREBASE); } catch(e){ console.warn('firebase', e); toast('เชื่อมต่อ Firebase ไม่ได้: ' + (e && e.message ? e.message : e)); }
  }
  if (Store.db){
    Store.online = true;
    // ตัวละครที่แชร์ในโต๊ะเดียวกัน: ทุกคนอ่านได้ (GM ต้องเห็นชีทผู้เล่น)
    try {
      // ตัวละครของฉันเท่านั้น (ผู้พัฒนาเห็นทั้งหมด) — ชีทของคนอื่นเห็นได้ผ่านสำเนาในห้องที่เขาหยิบตัวละครมาเล่น
      const q = (Store.backend==='firebase' && !Store.isDevUid) ? Store.db.collection('chars').where('ownerId','==',Store.me) : Store.db.collection('chars');
      q.onSnapshot(snap => {
        const docs = snapDocs(snap);
        let changed=false;
        for (const d of docs){ if(!d || !d.id) continue; const i=Store.chars.findIndex(x=>x.id===d.id); if(i<0){ Store.chars.push(d); changed=true; } else if ((d.updatedAt||0) > (Store.chars[i].updatedAt||0)){ Store.chars[i]=d; changed=true; } }
        if (changed){ saveLocal(Store.chars); Store.notify(); }
        if (!Store._pruned){ Store._pruned = true; setTimeout(()=>pruneRoomLinks().catch(()=>{}), 1500); }
      }, err => console.warn('chars snapshot', err));
    } catch(e){ console.warn(e); }
  }
  updateOnline();
}
/* ---- Firebase backend (GitHub Pages): Firestore + Anonymous auth ห่อให้หน้าตาเหมือน db/user/room ของ claude.ai ---- */
async function initFirebase(cfg){
  const V = cfg.sdkVersion || '11.0.1';
  const base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{initializeApp}, A, F] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
  const app = initializeApp(cfg);
  const auth = A.getAuth(app);
  const fdb = F.getFirestore(app);
  FB = {A, F, auth, fdb};
  const plain = o => JSON.parse(JSON.stringify(o)); // Firestore ไม่รับ undefined
  const wrapDoc = snap => ({ exists: snap.exists(), id: snap.id, data: () => snap.data() });
  const docRef = path => { const ref = F.doc(fdb, path); return {
    set: d => F.setDoc(ref, plain(d)), update: d => F.updateDoc(ref, plain(d)), delete: () => F.deleteDoc(ref), get: async () => wrapDoc(await F.getDoc(ref)),
    onSnapshot: (ok, err) => F.onSnapshot(ref, s => ok(wrapDoc(s)), err) }; };
  const coll = (path, cons=[]) => ({
    orderBy: (f, d) => coll(path, [...cons, F.orderBy(f, d||'asc')]), limit: n => coll(path, [...cons, F.limit(n)]), where: (a, op, v) => coll(path, [...cons, F.where(a, op, v)]),
    doc: id => docRef(path + '/' + id),
    get: async () => ({ docs: (await F.getDocs(cons.length ? F.query(F.collection(fdb, path), ...cons) : F.collection(fdb, path))).docs.map(wrapDoc) }),
    onSnapshot: (ok, err) => F.onSnapshot(cons.length ? F.query(F.collection(fdb, path), ...cons) : F.collection(fdb, path), s => ok({ docs: s.docs.map(wrapDoc) }), err) });
  const db = { doc: docRef, collection: coll };
  // ---- login gate: config/site = {requireLogin, devUids, devIps} ----
  let site = null;
  try { const sn = await F.getDoc(F.doc(fdb, 'config/site')); if (sn.exists()) site = sn.data(); } catch(e){ console.warn('config read', e); }
  Store.site = site;
  const current = await new Promise(res => { const stop = A.onAuthStateChanged(auth, u => { stop(); res(u); }); setTimeout(()=>res(auth.currentUser), 6000); });
  let user = current;
  const needLogin = !!(site && site.requireLogin);
  if (needLogin){
    if (user && !user.isAnonymous) { /* ล็อกอิน Google อยู่แล้ว */ }
    else {
      const ip = await fetchPublicIp();
      Store.ip = ip;
      if (ip && (site.devIps||[]).includes(ip)){
        Store.isDevIp = true;
        if (!user) user = (await A.signInAnonymously(auth)).user;
      } else {
        user = await loginGate(A, auth); // รอจนกว่าจะล็อกอินสำเร็จ
      }
    }
  } else {
    if (!user) user = (await A.signInAnonymously(auth)).user;
  }
  Store.authUser = user;
  Store.db = db;
  Store.user = { id: async () => user.uid, isOwner: () => false, canEdit: () => false, can: () => true };
  Store.me = user.uid; Store.canWrite = true; Store.backend = 'firebase';
  Store.isDevUid = !!(site && (site.devUids||[]).includes(user.uid));
  Store.isDev = Store.isDevUid || Store.isDevIp;
  Store.displayName = user.isAnonymous ? (localStorage.getItem('kirana.nick') || 'ผู้เล่น-' + user.uid.slice(0,4)) : (user.displayName || (user.email||'').split('@')[0] || 'ผู้เล่น');
  // แคชในเครื่องอาจมีตัวละครของคนอื่นจากรุ่นก่อน (ตอนนั้นทุกคนเห็นทุกตัว) เก็บเฉพาะของฉัน
  if (!Store.isDevUid) { Store.chars = Store.chars.filter(c => !c.ownerId || c.ownerId === user.uid); saveLocal(Store.chars); }
  startSitePresence(F, fdb, user);
  Store.login = async () => { try { const prov = new A.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'}); if (auth.currentUser && auth.currentUser.isAnonymous){ try { await A.linkWithPopup(auth.currentUser, prov); } catch(e){ if (e && /credential-already-in-use|email-already-in-use/.test(e.code||'')) await A.signInWithPopup(auth, prov); else throw e; } } else await A.signInWithPopup(auth, prov); location.reload(); } catch(e){ toast('ล็อกอินไม่สำเร็จ: ' + (e && e.code || e)); } };
  Store.logout = async () => { try { await F.deleteDoc(F.doc(fdb, 'presence/' + user.uid)); } catch(e){} try { await A.signOut(auth); } catch(e){} try { localStorage.removeItem(LS_KEY); } catch(e){} location.reload(); };
  // presence ผ่าน Firestore: rooms/<id>/presence/<uid> อัปเดตทุก 40 วิ ถือว่าออนไลน์ถ้าไม่เกิน 100 วิ
  Store.room = { join: async (name) => {
    const path = 'rooms/' + name.replace(/^kirana-/, '') + '/presence';
    let state = {}; let timer = null; let unsub = null;
    const push = () => F.setDoc(F.doc(fdb, path + '/' + user.uid), plain({ ...state, at: Date.now() })).catch(()=>{});
    return {
      presence: (patch) => { state = { ...state, ...patch }; push(); if (!timer) timer = setInterval(push, 40000); },
      onPeers: (fn) => { unsub = F.onSnapshot(F.collection(fdb, path), s => { const now = Date.now(); fn(s.docs.map(d => d.data()).filter(p => p && (now - (p.at||0)) < 100000)); }, ()=>{}); },
      leave: () => { if (timer) clearInterval(timer); if (unsub) unsub(); F.deleteDoc(F.doc(fdb, path + '/' + user.uid)).catch(()=>{}); },
      emit: () => {}, on: () => {} };
  } };
}

/* ---- Glossary: wrap known terms in clickable spans ---- */
const GLOSSARY = DATA.glossary || {};
const GL_TERMS = Object.keys(GLOSSARY).sort((a,b)=>b.length-a.length);
const GL_RE = GL_TERMS.length ? new RegExp('(' + GL_TERMS.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')(?![A-Za-z])', 'g') : null;
/* ชื่อเฉพาะที่ห้ามขีดเส้นศัพท์ข้างใน (ชื่อสกิล Proficiency Trait พื้นหลัง ชุด ฯลฯ) เช่น "Yantra Master" ไม่ใช่ Master ระดับทักษะ */
const PROTECTED_NAMES = (()=>{
  const names = new Set();
  const add = (n)=>{ if (!n) return; n = String(n).replace(/^\(|\)$/g,'').trim(); if (n && /[A-Za-z]/.test(n)) names.add(n); };
  for (const sk of DATA.skills||[]) add(sk.nameEn);
  for (const k of DATA.knowledge||[]){ for (const L of Object.values(k.levels||{})) for (const p of L.proficiencies||[]) add(p.name.replace(/\s*-\s*[^)]*\)?$/,'')); }
  for (const kin of DATA.kins||[]){ for (const list of ['traits','benefits','hindrances']) for (const x of kin[list]||[]) add(x.nameEn); for (const list of ['childhood','specialChildhood','adulthood','specialAdulthood']) for (const b of kin[list]||[]) add(b.nameEn); for (const sk of kin.starterSkills||[]) add(sk.name.replace(/\(.*$/,'')); }
  for (const st of (DATA.sets && DATA.sets.sets)||[]) add(st.nameEn);
  // เก็บเฉพาะชื่อที่มีคำศัพท์อยู่ข้างใน (ชื่ออื่นไม่ต้องป้องกัน) และยาวก่อน
  const out = [...names].filter(n => { if (!GL_RE) return false; GL_RE.lastIndex = 0; return GL_RE.test(n) && !GLOSSARY[n]; }).sort((a,b)=>b.length-a.length);
  return out;
})();
const PROTECT_RE = PROTECTED_NAMES.length ? new RegExp('(' + PROTECTED_NAMES.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')(?![A-Za-z])', 'g') : null;
function protectedSpans(s){ const spans = []; if (!PROTECT_RE) return spans; PROTECT_RE.lastIndex = 0; let m; while ((m = PROTECT_RE.exec(s))){ const prev = s[m.index-1]; if (prev && /[A-Za-z0-9]/.test(prev)) continue; spans.push([m.index, m.index + m[0].length]); } return spans; }
/* คำศัพท์คำเดียวที่ชิดกับคำอังกฤษตัวใหญ่ที่ไม่ใช่ศัพท์ (เช่น "Yantra Master", "Martial Skill") ถือเป็นส่วนของชื่อ ไม่ขีด */
function partOfName(s, start, end, term){
  if (term.includes(' ')) return false;
  const before = s.slice(0, start).match(/([A-Z][A-Za-z'\-]*)\s$/); const after = s.slice(end).match(/^\s([A-Z][A-Za-z'\-]*)/);
  const isTerm = (w)=> !!GLOSSARY[w] || STATS.includes(w);
  if (before && !isTerm(before[1])) return true;
  if (after && !isTerm(after[1])) return true;
  return false;
}
function termify(text){
  const frag = document.createDocumentFragment();
  if (text == null) return frag;
  const s = String(text);
  if (!GL_RE){ frag.append(s); return frag; }
  const prot = protectedSpans(s);
  let last = 0; GL_RE.lastIndex = 0; let m; let count = 0;
  while ((m = GL_RE.exec(s)) && count < 60){
    const start = m.index; const term = m[1]; const end = start + term.length;
    // avoid matching inside a latin word (e.g. "Cast" inside "Forecast")
    const prev = s[start-1]; if (prev && /[A-Za-z0-9]/.test(prev)) { continue; }
    if (prot.some(([a,b]) => start < b && end > a)) continue;
    if (partOfName(s, start, end, term)) continue;
    if (start > last) frag.append(s.slice(last, start));
    frag.append(h('span', {class:'term', tabindex:0, role:'button', dataset:{term}, onclick:(e)=>{ showTerm(term, e.currentTarget); }, onkeydown:(e)=>{ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); showTerm(term, e.currentTarget); } }}, term));

}

/* ---- Archetype engine ---- */
const ARCH = DATA.meta.archetypes;
function persVec(c){ // +value toward left pole
  const v = {}; for (const ax of DATA.meta.personality){ const p = c.personality[ax.id]; v[ax.id] = (p && p.value!=null) ? (p.side==='left' ? p.value : -p.value) : 0; } return v; }
// archetype affinity from personality (left = +): logic, confront, brave, others, compassion, order
const ARCH_PERS = {
  'Tank':          {confront: 2, others: 3, brave: 1, order: 1},
  'Fighter':       {confront: 3, brave: 2, order: 1},
  'Damage Dealer': {confront: 2, compassion: -2, logic: -1},
  'Striker':       {confront: 1, logic: -2, order: -2, compassion: -1},
  'Skirmisher':    {confront: -2, logic: -1, brave: 1, order: -1},
  'Rogue':         {confront: -2, brave: -2, others: -2, order: -2},
  'Support':       {others: 3, compassion: 3, confront: -1},
  'Controller':    {logic: 3, brave: -1, order: 2},
  'Specialist':    {logic: 3, order: 2, confront: -1},
  'Utility':       {brave: 1, logic: 1, confront: -1},

function archetypeScores(c, d){
  const pv = persVec(c); const out = [];

    for (const [ax, w] of Object.entries(ARCH_PERS[a.id]||{})) s += w * (pv[ax]||0);
    for (const [st, w] of Object.entries(a.weights)) s += w * (d.mod[st]||0) * 0.8;
    out.push({a, s});

  return out.sort((x,y)=>y.s-x.s);
}
const PERS_LINES = { // id → [leftTexts by level, rightTexts by level]
  logic: [['คิดก่อนทำ ชอบวิเคราะห์และวางแผน', 'ใช้เหตุผลนำอารมณ์ เชื่อข้อมูลมากกว่าลางสังหรณ์', 'นักวางแผนตัวยง ทุกการตัดสินใจต้องมีเหตุผลรองรับ'], ['ทำตามความรู้สึกแรก', 'เชื่อสัญชาตญาณมากกว่าตำรา', 'สัญชาตญาณดิบนำทุกอย่าง ตอบสนองก่อนที่สมองจะทัน']],

function personalityProfile(c, d){
  const bs = budgetState(c); if (bs.left.length) return null;
  const lines = [];
  for (const ax of DATA.meta.personality){ const p = c.personality[ax.id]; if (!p || !p.value) continue; const side = p.side==='left'?0:1; lines.push(PERS_LINES[ax.id][side][Math.min(2, p.value-1)]); }
  const zero = DATA.meta.personality.filter(ax=>{ const p=c.personality[ax.id]; return p && p.value===0; }).map(ax=>`${ax.left}/${ax.right}`);
  const sc = archetypeScores(c, d);
  const top = sc.slice(0,2).map(x=>x.a);
  const talents = [...new Set(top.flatMap(a=>a.talent))].filter(t => t==='EDU' || d.highest.includes(t));

/* Auto fill Extra: greedy, prefers points that complete an even number (raise Mod) on weighted stats */
function autoFillExtra(c, archId){
  const a = ARCH.find(x=>x.id===archId); if (!a || !c.kin) return;
  c.extra = {};
  let d = compute(c);
  let guard = 0;
  while (d.extraLeft > 0 && guard++ < 60){
    let best = null, bestScore = -1;
    for (const s of STATS){
      const w = a.weights[s] || 0.15; if (d.raw[s] >= 20) continue;
      const completes = (d.raw[s] + 1) % 2 === 0; // next point raises Mod
      const score = w * (completes ? 2.2 : 1) + (d.raw[s] < 10 ? 0.4 : 0);
      if (score > bestScore){ bestScore = score; best = s; }
    }
    if (!best) break;
    c.extra[best] = (c.extra[best]||0) + 1;
    d = compute(c);
  }
}

/* ---- Proficiency ที่มีตัวเลือกย่อย (ความเชื่อ): รายการที่ชื่อขึ้นต้นด้วย "(" ต่อท้าย Proficiency ก่อนหน้า ---- */
function profGroups(L){ const out = []; for (const p of (L && L.proficiencies) || []){ if (p.name.startsWith('(') && out.length) out[out.length-1].subs.push(p); else out.push({prof:p, subs:[]}); } return out; }
function faithKey(name){ const m = String(name||'').match(/-\s*([^)]+)\)?\s*$/); return m ? m[1].trim().replace(/([ั-ฺ็-๎])\1+/g,'$1') : null; }
function faithShort(name){ return String(name||'').replace(/^\(|\)$/g,'').trim(); }
function charFaith(c, exceptKey){ for (const [k,sl] of Object.entries(c.kslots||{})) if (k!==exceptKey && sl && sl.faith) return faithKey(sl.faith); return null; }
function profGroupOf(kid, profName){ const k = KNOW[kid]; if (!k) return null; for (const L of Object.values(k.levels||{})){ const g = profGroups(L).find(x=>x.prof.name===profName); if (g) return g; } return null; }
function slotIncomplete(sl){ if (!sl || !sl.id || !sl.prof) return true; const g = profGroupOf(sl.id, sl.prof); return !!(g && g.subs.length && !sl.faith); }
function profLabel(sl){ return sl.prof + (sl.faith ? ' · ' + faithShort(sl.faith) : ''); }
function profTexts(kid, sl){ const g = profGroupOf(kid, sl.prof); const sub = g && sl.faith ? g.subs.find(x=>x.name===sl.faith) : null; return { text: g ? g.prof.text : '', faithText: sub ? sub.text : '' }; }
/* ชีทรุ่นก่อน: เลือกความเชื่อในวงเล็บเป็น Proficiency ตรง ๆ → แปลงเป็น Proficiency แม่ + faith */
function migrateFaithSlots(c){ let changed=false; for (const sl of Object.values(c.kslots||{})){ if (!sl || !sl.id || !sl.prof || !sl.prof.startsWith('(')) continue; const k = KNOW[sl.id]; if (!k) continue; for (const L of Object.values(k.levels||{})){ const g = profGroups(L).find(x=>x.subs.some(f=>f.name===sl.prof)); if (g){ sl.faith = sl.prof; sl.prof = g.prof.name; changed=true; break; } } } return changed; }

/* ---- ทางเลือกในชุดเริ่มต้น: ไอเทมที่ชื่อขึ้นต้น "หรือ" เป็นทางเลือกของชิ้นก่อนหน้า ---- */
function setItemGroups(set){ const groups = []; for (const it of (set && set.items) || []){ if (/^หรือ\s/.test(it.name) && groups.length) groups[groups.length-1].items.push(it); else groups.push({items:[it]}); } return groups; }
function cleanAltName(n){ return String(n||'').replace(/^หรือ\s+/, '').replace(/\s*ต้องการ\s+[A-Z]+\s*\d+\s*$/, '').trim(); }
function itemRequirement(n){ const m = String(n||'').match(/ต้องการ\s+([A-Z]+)\s*(\d+)/); return m ? {stat:m[1], value:+m[2], label:`${m[1]} ${m[2]}`} : null; }
/* ไอเทมที่ตัวละครได้จริงตามทางเลือกที่เลือก (c.starterPicks = {groupIndex: itemIndex}) */
function chosenSetItems(c, set){ const picks = c.starterPicks || {}; const out = []; setItemGroups(set).forEach((g, gi) => { const idx = g.items.length > 1 ? Math.min(g.items.length-1, +(picks[gi]||0)) : 0; const it = g.items[idx]; const req = itemRequirement(it.name); out.push(Object.assign({}, it, {name: cleanAltName(it.name), effect: (it.effect||'') + (req ? ` · ต้องการ ${req.label}` : '')})); }); return out; }
/* Trait/พื้นหลังที่มีทางเลือกย่อยในข้อความ ("เลือกประเภทเป้าหมาย 1 กลุ่ม", "เลือก…1 อย่าง") → ให้ผู้เล่นระบุ */
function traitNeedsPick(text){ return /เลือก[^.\n]{0,60}?(1|หนึ่ง|๑)\s*(กลุ่ม|ประเภท|อย่าง|ชนิด|ภาษา|สาย|ค่า|แบบ|ทาง|ตัว|เผ่า|สำนัก|วงศา|เป้าหมาย|ธาตุ)/.test(String(text||'')) || /เลือก(ประเภท|กลุ่ม|เป้าหมาย|ธาตุ|ภาษา|สัตว์|อาวุธ)[^.\n]{0,40}(1|หนึ่ง)/.test(String(text||'')); }
function traitPickInput(c, key, placeholder, onChange){ c.traitPicks = c.traitPicks || {}; const inp = h('input',{value:c.traitPicks[key]||'', placeholder: placeholder||'ระบุทางเลือกที่เลือก', oninput:(e)=>{ c.traitPicks[key] = e.target.value; if (onChange) onChange(); }}); return h('div',{class:'traitpick'}, h('span',{class:'tag prop',text:'ทางเลือก'}), inp); }

/* ---- Knowledge Check (คำตัดสิน 9 พ.ย. 2026): 2d6 + ระดับความรู้ + Mod ค่าพลังกำกับ (ตัวที่สูงกว่าในคู่) + บุคลิกภาพถ้าเข้าบริบท ---- */
function knowledgeBonus(c, d, k){ const lv = (knowledgeLevels(c)[k.id]||0); let stat = k.stats[0], mod = d.mod[stat]; for (const st of k.stats) if (d.mod[st] > mod){ stat = st; mod = d.mod[st]; } return { lv, stat, mod, total: lv + mod }; }

const W = { char: null, step: 0, skFilter: '' };

function startWizard(existing){
  W.char = existing ? JSON.parse(JSON.stringify(existing)) : newChar();
  W.step = existing ? (existing.step||0) : 0;
  renderWizard();
}
function wizSave(){ W.char.step = W.step; Store.upsert(W.char); }

function renderWizard(){
  const root = clear($('#v-create'));
  if (!W.char) { root.append(h('div',{class:'card'}, h('h2',{text:'สร้างตัวละครใหม่'}), h('p',{class:'dim',text:'เดินทีละขั้น ทุกตัวเลือกบอกว่าได้อะไร แผงด้านขวาสรุปค่าปัจจุบันตลอดทาง'}), h('button',{class:'primary',onclick:()=>startWizard(null),text:'เริ่มสร้างตัวละคร'}))); return; }
  const c = W.char; migrateFaithSlots(c); const d = compute(c);
  const steps = h('div',{class:'steps'}, STEP_DEFS.map((s,i)=>h('button',{class: i===W.step?'cur':(stepDone(i)?'done':''), onclick:()=>{W.step=i; renderWizard();}, text:`${i+1}. ${s.key==='kin'?'วงศา':s.key==='bg'?'พื้นหลัง':s.key==='pers'?'บุคลิก':s.key==='extra'?'Extra':s.key==='talent'?'พรสวรรค์':s.key==='calc'?'คำนวณ':s.key==='details'?'รายละเอียด':'ชุดเริ่มต้น'}`})));
  const def = STEP_DEFS[W.step];
  const head = h('div',{class:'stephead'}, h('div',null, h('h2',{text:def.title}), h('p',null, T(def.blurb))), h('div',{class:'row'}, h('button',{class:'small ghost',onclick:()=>{wizSave(); toast('บันทึกร่างแล้ว');},text:'บันทึกร่าง'}), h('button',{class:'small ghost',onclick:()=>{ if (confirm('ล้างตัวละครนี้และเริ่มใหม่?')) { startWizard(null);} },text:'เริ่มใหม่'})));
  const body = h('div');
  ({kin:stepKin, bg:stepBg, pers:stepPers, extra:stepExtra, talent:stepTalent, calc:stepCalc, details:stepDetails, set:stepSet})[def.key](body, c, d);
  const nav = h('div',{class:'navbtns'},
    h('button',{disabled: W.step===0, onclick:()=>{W.step--; renderWizard();}, text:'← ย้อนกลับ'}),
    W.step < STEP_DEFS.length-1
      ? h('button',{class:'primary', onclick:()=>{ const err = stepBlocker(W.step); if (err){ toast(err); return; } wizSave(); W.step++; renderWizard(); window.scrollTo({top:0}); }, text:'ขั้นต่อไป →'})
      : h('button',{class:'primary', onclick:finishWizard, text:'เสร็จสิ้น บันทึกตัวละคร'}));
  root.append(h('div',{class:'wiz'}, h('div',null, steps, head, body, nav), h('aside',{class:'side'}, coachPanel(c,d), sidePanel(c,d))));
}
function stepDone(i){ const c=W.char; const d=compute(c);
  switch(i){ case 0: return !!c.kin; case 1: return !!(c.childhood && c.adulthood); case 2: return budgetState(c).left.length===0;
    case 3: return c.kin && d.extraLeft===0; case 4: return !!c.talent; case 5: return !!c.kin; case 6: return !!c.name; case 7: return !!c.starterSet; }
  return false; }
function stepBlocker(i){ const c=W.char, d=compute(c);
  if (i===0 && !c.kin) return 'เลือกวงศาก่อน';
  if (i===0 && c.kin==='lunaryn' && c.evolver && c.evolver.kin && (!c.evolver.pick || !c.evolver.hindrance)) return 'Descendants of Evolver: เลือกทั้ง Trait/Skill และ Hindrance ของวงศาที่ยืมมา';
  if (i===1 && (!c.childhood || !c.adulthood)) return 'เลือกพื้นหลังทั้งวัยเด็กและวัยผู้ใหญ่';
  if (i===1){ const b=findBg(KIN[c.kin], c.childhood); if (b && b.statsChoice && (c.choiceStats||[]).length!==b.statsChoice.count) return `พื้นหลังนี้ให้เลือกค่าพลัง ${b.statsChoice.count} ค่า`; }
  if (i===2 && budgetState(c).left.length) return 'แจกค่าบุคลิกภาพให้ครบทั้ง 6 คู่';
  if (i===3 && d.extraLeft!==0) return d.extraLeft>0 ? `ยังเหลือแต้ม Extra ${d.extraLeft} แต้ม` : 'ใช้แต้ม Extra เกิน';
  if (i===4 && !c.talent) return 'เลือก Talent ก่อน';
  if (i===4){ const t = DATA.talents.find(x=>x.key===c.talent); const kin = KIN[c.kin];
    for (let j=0;j<t.steps.length;j++){ const st=t.steps[j]; const key=`talent-${j}`;
      if (st.kind==='skills' && ((c.skillSlots||{})[key]||[]).length < st.count) return `ขั้น ${j+1} ของ Talent: เลือกทักษะให้ครบ ${st.count}`;
      if (st.kind==='knowledge'){ const keys = st.count>1 ? Array.from({length:st.count},(_,q)=>`${key}-${q}`) : [key]; for (const kk of keys){ const sl=(c.kslots||{})[kk]; if (slotIncomplete(sl)) return `ขั้น ${j+1} ของ Talent: เลือกความรู้ Proficiency (และความเชื่อ) ให้ครบ`; } }
      if (st.kind==='choice' && !(c.talentPicks||{})[key]) return `ขั้น ${j+1} ของ Talent: เลือก 1 อย่าง`;
      if (st.kind==='grant' && st.altPools && (kin.traits.some(x=>x.nameEn==='Nimble Grace') || kin.starterSkills.some(x=>x.name.includes('Nimble Grace'))) && ((c.skillSlots||{})[key]||[]).length<1) return `ขั้น ${j+1} ของ Talent: เลือก Tactical & General Skill แทน Nimble Grace`;
    }
    const fr=(c.kslots||{}).free; if (slotIncomplete(fr)) return 'อัปเกรด Knowledge 1 ระดับ และเลือก Proficiency (ขั้น 5 ของไฟล์แกน)';
    for (let g=0; g<kin.knowledgeGrants.length; g++){ const sl=(c.kslots||{})[`kin-${g}`]; if (slotIncomplete(sl)) return `ของจากวงศา (${kin.knowledgeGrants[g].source}): เลือกความรู้และ Proficiency`; }
    if (kin.adaptationChoice && !c.adaptation) return 'เลือก Adaptation 1 อย่าง (Cross-Cultural Adaptation)';
  }
  if (i===6 && !c.name.trim()) return 'ตั้งชื่อตัวละครก่อน';
  return null; }

/* ลำดับช่องความรู้ตามที่ปรากฏบนหน้า: Talent (talent-*) → ฟรี (free) → ของวงศา (kin-*) → ซื้อด้วย IP (ip*) แล้วเรียงตามชื่อ เลือกช่องล่างไม่กระทบช่องบน */
function slotGroup(key){ return key.startsWith('talent') ? 0 : key==='free' ? 1 : key.startsWith('kin-') ? 2 : 3; } // เรียงตามลำดับที่ปรากฏบนหน้า: Talent → ฟรี → ของวงศา → IP
function slotBefore(a, b){ const ga = slotGroup(a), gb = slotGroup(b); if (ga !== gb) return ga < gb; return a.localeCompare(b, undefined, {numeric:true}) < 0; }
function knowledgeLevels(c){
  const lv = Object.fromEntries(DATA.knowledge.map(k=>[k.id,0]));
  for (const slot of Object.values(c.kslots||{})) if (slot && slot.id) lv[slot.id] = Math.min(3, lv[slot.id]+1);
  return lv;
}
function allSkills(c){
  const out = new Set();
  for (const arr of Object.values(c.skillSlots||{})) for (const n of arr||[]) out.add(n);
  for (const g of c.grants||[]) out.add(g);
  const kin = c.kin ? KIN[c.kin] : null;
  if (kin){ const d = compute(c); for (const s of kin.starterSkills) if (starterCondOk(s.condition, d)) out.add(cleanSkillName(s.name)); }
  if (c.evolver && c.evolver.pick && c.evolver.pick.startsWith('S:')) out.add(cleanSkillName(c.evolver.pick.slice(2)));
  return [...out];
}
const SKILL_LC = Object.fromEntries(DATA.skills.map(s => [s.nameEn.toLowerCase(), s.nameEn]));
function cleanSkillName(n){ const cands = []; const m = n.match(/\(([A-Za-z][^)]*)\)/); if (m) cands.push(m[1].trim()); const m2 = n.match(/^([A-Za-z][A-Za-z' \-]+)/); if (m2) cands.push(m2[1].trim()); for (const c of cands){ if (SKILL_BY_NAME[c]) return c; if (SKILL_LC[c.toLowerCase()]) return SKILL_LC[c.toLowerCase()]; } return n.replace(/:.*$/,'').trim(); }
function starterCondOk(cond, d){
  if (!cond) return true;
  const m = cond.match(/(\d+)\s*(STR|AGI|VIT|PER|INF|INT)/);
  if (m && d.raw[m[2]] < +m[1]) return false;
  return true; // เงื่อนไขอื่น (เช่น เพศ) ให้ผู้เล่นตัดสินเอง แสดงไว้ในชีท
}
function poolMatch(sk, pool, kin){
  if (sk.category==='Granted') return false;
  switch(pool){
    case '*': return true;
    case 'Sorcery:Novice': return sk.category==='Sorcery' && sk.tier==='Novice';
    case 'Kins Unique': return sk.category==='Kins Unique' && kin && kin.uniqueGroups.includes(sk.subcategory);
    case 'Qi': return sk.subcategory==='Qi';
    case 'Stance': return sk.subcategory==='Stance';
    case 'Trick': return sk.category==='Trick';
    case 'Survival': return sk.category==='Survival';
    case 'Martial': return sk.category==='Martial';
    case 'Martial:notQiStance': return sk.category==='Martial' && sk.subcategory!=='Qi' && sk.subcategory!=='Stance';
    default: return sk.subcategory===pool;
  }
}

function skillPicker(c, slotKey, pools, count, title){

  box.append(lst);
  return box;

function knowledgePicker(c, slotKey, opts, title){
  // opts: {from:[], exclude:[], fixed:'', maxLevel:2, maxBefore:1}
  c.kslots = c.kslots || {};
  const slot = c.kslots[slotKey] || (c.kslots[slotKey] = {id:null, prof:null});
  if (opts.fixed) slot.id = opts.fixed;
  const box = h('div',{class:'card',style:'margin-top:10px'});
  box.append(h('h4',null, title, ' ', h('span',{class:'tag '+(!slotIncomplete(slot) ? 'ok':'warn'), text: slot.id ? (slot.prof ? `${KNOW[slot.id].nameEn} · ${profLabel(slot)}` + (slotIncomplete(slot) ? ' (เลือกความเชื่อ)' : '') : 'เลือก Proficiency') : 'ยังไม่เลือก'})));
  // ระดับ "ก่อนช่องนี้" นับเฉพาะช่องที่มาก่อนตามลำดับคงที่ (Talent → ฟรี → ของวงศา → IP ตามลำดับบนหน้า) ไม่งั้นสองช่องที่เลือกความรู้เดียวกันจะนับกันเองแล้วเด้งไประดับถัดไปทั้งคู่ ทำให้ Proficiency ที่เลือกไว้หายไฮไลต์
  const others = Object.entries(c.kslots).filter(([k])=>k!==slotKey).map(([,v])=>v);
  const before = Object.entries(c.kslots).filter(([k])=>k!==slotKey && slotBefore(k, slotKey)).map(([,v])=>v);
  const lvBefore = Object.fromEntries(DATA.knowledge.map(k=>[k.id,0]));
  for (const s of before) if (s && s.id) lvBefore[s.id]++;
  if (!opts.fixed){
    const btns = DATA.knowledge.filter(k => (!opts.from || opts.from.includes(k.id)) && !(opts.exclude||[]).includes(k.id)).map(k=>{
      const before = lvBefore[k.id]; const after = before+1;
      const blocked = after>3 || (opts.maxLevel && after>opts.maxLevel) || (opts.maxBefore!=null && before>opts.maxBefore);
      return h('button',{class:'small'+(slot.id===k.id?' primary':''), disabled: blocked && slot.id!==k.id, title: blocked?'ระดับเกินเพดานของช่องนี้':'', onclick:()=>{ slot.id=k.id; slot.prof=null; renderWizard(); }, text:`${k.nameEn} (${k.stats.join('/')}) Lv${before}→${after}`});
    });

  }
  if (slot.id){
    const k = KNOW[slot.id]; const newLv = Math.min(3, lvBefore[slot.id]+1);
    const L = k.levels[String(newLv)];
    // ถ้าช่องก่อนหน้าเปลี่ยนจนระดับของช่องนี้ขยับ Proficiency เดิมอาจไม่อยู่ในระดับใหม่ → ล้างให้เลือกใหม่ (ไม่ปล่อยให้ค้างแบบมองไม่เห็น)
    if (slot.prof && !slot.prof.startsWith('(') && L && L.proficiencies.length && !L.proficiencies.some(p=>p.name===slot.prof)){ slot.prof = null; slot.faith = null; }
    box.append(h('div',{class:'infobox'}, h('b',{text:`${k.nameEn} ${k.nameTh} · ค่าพลังกำกับ ${k.stats.join(', ')} · ระดับ ${newLv}`}), h('div',{class:'desc'}, T(L && L.text ? L.text : ''))));
    if (L && L.proficiencies.length){

      const groups = profGroups(L);
      box.append(h('div',{class:'grid',style:'margin-top:6px'}, groups.map(g=>{ const p = g.prof; const taken = usedProfs.has(p.name) && slot.prof!==p.name; return h('div',{class:'sk'+(slot.prof===p.name?' sel':'')+(taken?' disabled':''), onclick:()=>{ if (taken){ toast('Proficiency นี้เลือกไปแล้วในช่องอื่น'); return; } if (slot.prof!==p.name){ slot.prof=p.name; slot.faith=null; } renderWizard();}}, h('div',{class:'h'}, h('b',{text:p.name}), g.subs.length ? tag(`เลือกความเชื่อ 1 จาก ${g.subs.length}`,'prop') : null, taken? tag('เลือกแล้ว','warn'):null), h('div',{class:'eff'}, T(p.text))); })));
      const sel = groups.find(g=>g.prof.name===slot.prof);

          h('div',{class:'grid',style:'margin-top:6px'}, sel.subs.map(f=>{ const key = faithKey(f.name); const blocked = !!(have && key && have!==key); return h('div',{class:'sk'+(slot.faith===f.name?' sel':'')+(blocked?' disabled':''), onclick:()=>{ if (blocked){ toast('ต้องเป็นความเชื่อเดียวกับที่ตัวละครมีอยู่'); return; } slot.faith = f.name; renderWizard(); }}, h('div',{class:'h'}, h('b',{text:faithShort(f.name)})), h('div',{class:'eff'}, T(f.text))); }))));
      } else slot.faith = null;
    } else if (L) { slot.prof = slot.prof || '(ระดับนี้ไม่มี Proficiency ให้เลือก)'; }
  }
  return box;
}

function finishWizard(){
  const c = W.char;
  for (let i=0;i<STEP_DEFS.length;i++){ const e=stepBlocker(i); if (e){ toast(e); W.step=i; renderWizard(); return; } }
  const d = compute(c);
  c.current = c.current || {hp:d.hp, mp:d.mp, sanity:d.sanity, tough:Object.fromEntries(DATA.meta.bodyParts.map(([k])=>[k,d.toughness])), ap:3, ip:0, money:15};

  Store.upsert(c);
  toast('บันทึกตัวละครแล้ว');
  location.hash = '#sheet-' + c.id;
}

function coachCompute(c, d, step){

  switch (step){
    case 0: { // วงศา
      if (!kin){ say('ask', coachPick(['เริ่มจากคำถามแรกของทุกชีวิต เจ้าเกิดมาเป็นอะไร การ์ดบอกจุดเด่นจุดด้อย แต่ค่าดิบข้างล่างต่างหากที่บอกว่าเจ้าจะทอยอะไรได้ดี', 'สิบสองวงศา สิบสองวิธีที่จะเจ็บ เลือกจากเรื่องราวที่อยากเล่าก่อน ตัวเลขค่อยตามมา เราช่วยเรื่องตัวเลขได้ แต่เรื่องราวต้องเป็นของเจ้า', 'อย่าเพิ่งมองแต่ค่าสูงสุด มองข้อเสียด้วย Hindrance ที่เจ้ารับได้คือ Hindrance ที่จะทำให้ตัวละครนี้น่าจดจำ'], seed)); break; }
      const K = COACH_KIN[kin.id] || {};
      const hi = STATS.slice().sort((a,b)=>kin.raw[b]-kin.raw[a]); const lo = hi[hi.length-1];
      say(K.mood||'smile', K.joke, K.play || `ค่าดิบสูงสุดคือ ${hi[0]} ${kin.raw[hi[0]]} ต่ำสุดคือ ${lo} ${kin.raw[lo]} ตรงนั้นคือจุดที่ศัตรูจะหาเจอ`, K.combo);

    case 3: { // Extra

      if (d.mod.INF < 0) say('think', 'INF ติดลบ Sanity ต่ำกว่าคนทั่วไป เวลา GM เรียก Saving Throw ทางใจ ให้เพื่อนที่พูดเก่งเป็นคนเจรจา ตัวละครนี้มีหน้าที่อื่น');

      else say('smile', coachPick([`${c.name.trim()} ชื่อดี เราจะจำไว้ ตอนนี้บอกเราหน่อยว่า${c.name.trim()}ต้องการอะไร และจำเป็นต้องได้อะไร สองอย่างนี้ไม่เหมือนกัน และช่องว่างระหว่างมันคือเรื่องทั้งหมด`, `${c.name.trim()} เราเคยรู้จักคนชื่อคล้ายกัน เขาไม่รอด แต่เจ้าอาจต่างออกไป`, `${c.name.trim()} ดี ทีนี้ Want คือสิ่งที่ตัวละครคิดว่าอยากได้ Need คือสิ่งที่ตัวละครต้องเรียนรู้ ถ้าสองอย่างนี้ขัดกัน เจ้าได้เรื่องราวมาฟรี`], seed));
      const kinT = kin ? KIN[kin.id] : null; const ch = findBg(kin, c.childhood), ad = findBg(kin, c.adulthood);
      if (!(dt.backstory||'').trim() && ch && ad) say('think', `เรื่องราว เขียนแค่สามบรรทัดก็พอ ${ch.name}ที่กลายเป็น${ad.name} ใครอยู่ในเรื่องนั้นบ้าง และใครที่ยังตามหาเจ้าอยู่${kinT && kinT.hindrances.length ? ` อย่าลืมผูก ${kinT.hindrances[0].name} เข้าไปด้วย ข้อเสียที่มีที่มาเล่นสนุกกว่าข้อเสียที่ติดมาเฉย ๆ` : ''}`);

      if ((dt.signature||'').trim()) say('smirk', 'เอกลักษณ์ที่ตกลงกับ GM ไม่กินช่องเก็บของ ไม่นับน้ำหนัก และบอกทุกคนว่าตัวละครนี้คือใครก่อนที่เจ้าจะพูด เลือกให้ดี');

        if (d.capacity < 30) say('think', 'ชุดที่หนักเกินไม่ได้ห้ามเลือก แต่ตัวละครจะช้าตั้งแต่ก้าวแรก ยอมทิ้งของบางชิ้นไว้กับเพื่อนก็ได้ นั่นก็เป็นเรื่องราว');

        if (over) say('panic', `หนัก ${set.totalWeight} กิโลกรัม บวกชุดยังชีพแล้วเกินที่แบกได้ ${d.capacity} กิโลกรัม ตัวละครนี้จะเดินช้าตั้งแต่ออกจากเมือง ทิ้งของบางชิ้น หรือเลือกชุดที่เบากว่า`);
        else say(null, `น้ำหนัก ${set.totalWeight} กิโลกรัม แบกไหว เหลือที่ว่างสำหรับของที่เก็บได้ระหว่างทาง`);
        if (set.backgrounds) say('ask', `ชุดนี้เข้ากับพื้นหลังอย่าง ${set.backgrounds.split(',')[0].trim()} ถ้าพื้นหลังของเจ้าไม่ใช่ ลองคิดว่าของพวกนี้มาอยู่ในมือได้อย่างไร ซื้อมา ขโมยมา หรือได้มาจากคนตาย`);
        say('smile', 'กดเสร็จสิ้นเมื่อพร้อม แล้วไปเจอกันที่ชีท เราจะอยู่ตรงปุ่มลอยข้างจอ ไม่ได้ไปไหน');
      }
      break; }
  }
  if (!out.lines.length) say('smile', 'เราดูอยู่ ทำต่อไปเถอะ');
  return out;
}

/* แผงที่วางไว้เหนือแผงสรุปด้านขวาของวิซาร์ด */
function coachPanel(c, d){
  if (Coach.off) return h('div',{class:'coach off'}, h('button',{class:'small ghost',onclick:()=>{ Coach.off=false; try{ localStorage.setItem('kirana.coach','on'); }catch(e){} renderWizard(); }}, nemImg('smile','coach-mini'), ' เรียกเนเมสไซอาร์กลับมา'));
  const r = coachCompute(c, d, W.step);
  const key = r.mood + '|' + r.lines.join('|');
  const changed = key !== Coach.lastKey; Coach.lastKey = key;
  const box = h('div',{class:'coach mood-'+r.mood+(changed?' fresh':'')},
    h('div',{class:'coach-portrait'}, h('div',{class:'coach-arch'}), nemImg(r.mood)),
    h('div',{class:'coach-bubble'},
      h('div',{class:'coach-name'}, h('b',{text:NEM.name}), h('span',{class:'dim',text:' · '+NEM.title}), h('button',{class:'small ghost coach-x',title:'ซ่อนเนเมสไซอาร์',onclick:()=>{ Coach.off=true; try{ localStorage.setItem('kirana.coach','off'); }catch(e){} renderWizard(); },text:'✕'})),
      ...r.lines.map(t => h('p',null, T(t)))));
  return box;
}
let coachT = null;
function coachLater(){ clearTimeout(coachT); coachT = setTimeout(()=>{ if (!W.char) return; const old = $('#v-create .coach'); if (!old) return; old.replaceWith(coachPanel(W.char, compute(W.char))); }, 500); }

function itemSlot(name, effect){

  const parts = {}; for (const [k] of DATA.meta.bodyParts) parts[k] = {a:0, b:0, types:new Set(), belt:0};
  for (const [slot, e] of Object.entries(c.equip||{})){ if (!e || !e.effect) continue; const ar = parseArmor(e.effect); if (!ar) continue; const targets = ARMOR_SLOT_PARTS[slot] || [];

/* จัดกรอบลงคอลัมน์: วัดความสูงจริงแล้ววางทีละกรอบลงคอลัมน์ที่เตี้ยที่สุด (ลำดับคงเดิม) */
function packColumns(cs, boxes){
  const n = window.innerWidth <= 760 ? 1 : (window.innerWidth <= 1100 ? 2 : 3);
  const cols = Array.from({length:n}, ()=>h('div',{class:'cscol'}));
  cs.append(...cols);
  // วัดในคอลัมน์แรกก่อน (ทุกคอลัมน์กว้างเท่ากัน)
  for (const b of boxes) cols[0].append(b);
  const heights = boxes.map(b => b.offsetHeight + 14);
  const tot = Array(n).fill(0);
  const hOf = new Map(boxes.map((b,i)=>[b, heights[i]]));
  boxes.forEach((b,i)=>{ let j = 0; for (let k=1;k<n;k++) if (tot[k] < tot[j]) j = k; cols[j].append(b); tot[j] += heights[i]; });
  // ปรับสมดุล: ย้ายกรอบจากคอลัมน์ที่สูงสุดไปต่อท้ายคอลัมน์ที่เตี้ยสุด เลือกกรอบที่ทำให้ส่วนต่างเหลือน้อยที่สุด (ไม่ย้ายกรอบแรกของคอลัมน์)
  for (let it=0; it<8; it++){
    let T=0, S=0; for (let k=1;k<n;k++){ if (tot[k] > tot[T]) T=k; if (tot[k] < tot[S]) S=k; }
    if (T===S) break; const diff = tot[T]-tot[S]; let best=null, bestGap=diff;
    for (const b of [...cols[T].children].slice(1)){ const hb = hOf.get(b)||0; const gap = Math.abs(diff - 2*hb); if (hb < diff && gap < bestGap){ bestGap = gap; best = b; } }
    if (!best) break; const hb = hOf.get(best); cols[S].append(best); tot[T] -= hb; tot[S] += hb;
  }
}

  volcano(g, rnd){ const n=noiseGrid(rnd,4); for (let y=0;y<MAP_H;y++) for (let x=0;x<MAP_W;x++) g[y][x] = n[y][x]>0.68? 'L' : (n[y][x]>0.55? 'r' : (n[y][x]<0.2? 'R' : '.')); sprinkle(g,rnd,'B',3,'L'); },

function generateMap(kind, seed){
  if (!GEN[kind]) kind = 'field';

  const g = blank('.');
  GEN[kind](g, rnd);
  return { kind, seed: String(seed), w: MAP_W, h: MAP_H, cells: g.map(r=>r.join('')).join('') };
}
function mapCell(map, x, y){ if (!map || !inb(x,y)) return 'R'; return map.cells[y*MAP_W + x] || '.'; }
function setMapCell(map, x, y, ch){ if (!inb(x,y)) return; const a = map.cells.split(''); a[y*MAP_W+x] = ch; map.cells = a.join(''); }
function cellPassable(map, x, y){ const t = TILE[mapCell(map,x,y)]; return !!(t && t.pass); }
function cellDist(a, b){ return Math.max(Math.abs(a.x-b.x), Math.abs(a.y-b.y)); } // Chebyshev: ทแยง = 1 ช่อง
function rangeBand(cells){ const m = cells*CELL_M; if (cells <= 1) return {id:'eng', label:'เขตปะทะ', m}; if (m <= 25) return {id:'near', label:'เขตใกล้เคียง', m}; return {id:'far', label:'เขตไกล', m}; }
function freeCell(map, tokens, preferRows, rnd=Math.random){
  for (let guard=0; guard<400; guard++){ const y = preferRows[Math.floor(rnd()*preferRows.length)]; const x = Math.floor(rnd()*MAP_W); if (cellPassable(map,x,y) && !tokens.some(t=>t.x===x&&t.y===y)) return {x,y}; }
  for (let y=0;y<MAP_H;y++) for (let x=0;x<MAP_W;x++) if (cellPassable(map,x,y) && !tokens.some(t=>t.x===x&&t.y===y)) return {x,y};
  return {x:0,y:0};
}
/* ย่อภาพตัวละครเป็นรูปหมาก 56px (เก็บในเอกสารห้องได้โดยไม่หนัก) */
function makeThumb(dataUrl){
  return new Promise(res => { if (!dataUrl) return res(null); const img = new Image(); img.onload = ()=>{ const cv = document.createElement('canvas'); cv.width = cv.height = 56; const ctx = cv.getContext('2d'); const s = Math.min(img.width, img.height); ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 56, 56); res(cv.toDataURL('image/jpeg', 0.7)); }; img.onerror = ()=>res(null); img.src = dataUrl; });
}

    const box = h('div',{class:'dicebox'}, h('div',{class:'dice-who'}, h('span',{class:'who',text:m.who||''}), ' ', h('b',{text:m.text||'ทอยเต๋า'}), r.mode&&r.mode!=='normal'? [' ', tag(r.mode==='adv'?'Advantage':'Disadvantage', r.mode==='adv'?'ok':'neg')]:null, r.chosen? [' ', tag('เลือกลูกเอง','prop')]:null, m.gmOnly? [' ', h('span',{class:'gm',text:'ลับ'})]:null),

    const settle = ()=>{ const tot = box.querySelector('.dice-total'); const parts = [`${(r.kept||[]).join('+')}`]; if (m.mod) parts.push(signed(m.mod)); if (m.pm) parts.push(`${m.persSide||''} ${signed(m.pm)}`); tot.textContent = parts.join(' ') + ' = ' + m.total; tot.classList.add('show'); const j = box.querySelector('.dice-judge'); if (m.judge){ j.textContent = m.judge.text||''; j.className = 'dice-judge show ' + (m.judge.cls||''); } if (m.dc!=null) j.textContent += ` (DC ${m.dc})`; if (r.crit==='success' || r.double) box.classList.add('crit'); };

function itemCatalog(){ const out = []; const seen = new Set(); const add = (it, src)=>{ const name = cleanAltName(it.name).replace(/\(เสนอ\)\s*/,'').replace(/\s*×\s*\d+/,'').trim(); if (seen.has(name)) return; seen.add(name); out.push({name, effect: it.effect||'', weight: parseFloat(it.weight)||0, price: it.price||'', src}); }; for (const it of DATA.sets.common.items) add(it, 'ชุดยังชีพ'); for (const st of DATA.sets.sets) for (const it of st.items) add(it, st.nameEn); return out; }
async function sendGift(r, t, item){
  const gift = { id: uid(), toCharId: t.charId, toName: t.name, item: {name:item.name, effect:item.effect||'', weight:+item.weight||0, qty:+item.qty||1}, from: Store.displayName||'GM', fromId: Store.me||'local', at: Date.now() };

const giftsApplied = new Set();
function applyGift(rid, g, force){
  if (!g || giftsApplied.has(g.id)) return;
  const c = Store.chars.find(x=>x.id===g.toCharId && (force || Store.isMine(x)));
  if (!c) return; // ไม่ใช่ตัวละครของฉัน เจ้าของจะรับเอง
  giftsApplied.add(g.id);
  if (!c.inventory) ensureSheetState(c, compute(c)); // ชีทที่ยังไม่เคยเปิด: เติมชุดเริ่มต้นก่อน ไม่งั้นของเริ่มต้นจะหาย
  c.inventory = c.inventory || [];
  const it = g.item||{}; const ex = c.inventory.find(x=>x.name===it.name && (x.effect||'')===(it.effect||''));
  if (ex) ex.qty = (ex.qty||1) + (it.qty||1); else c.inventory.push({name:it.name, effect:it.effect||'', qty:it.qty||1, weight:it.weight||0});

  if (Store.db && !force) Store.db.doc(`rooms/${rid}/gifts/${g.id}`).delete().catch(()=>{});

}

/* สถานะ: บทที่ (ch) บรรทัด (ln) เก็บใน localStorage kirana.tutor (รุ่นเก่าเก็บเป็นเลขบท) */
const Tutor = (()=>{ let s = { ch:0, ln:0, auto:false, timer:null, typing:null, done:false }; try { const raw = localStorage.getItem('kirana.tutor'); if (raw){ const v = JSON.parse(raw); if (typeof v === 'number') s.ch = v; else if (v && typeof v === 'object'){ s.ch = v.ch|0; s.ln = v.ln|0; } } } catch(e){} return s; })();
function tutorSave(){ try { localStorage.setItem('kirana.tutor', JSON.stringify({ch:Tutor.ch, ln:Tutor.ln})); } catch(e){} }
function tutorStopTimers(){ if (Tutor.typing){ clearInterval(Tutor.typing); Tutor.typing = null; } if (Tutor.timer){ clearTimeout(Tutor.timer); Tutor.timer = null; } }

function renderTutorial(){
  const root = clear($('#v-tutor'));
  tutorStopTimers();
  if (Tutor.ch < 0 || Tutor.ch >= LESSONS.length) Tutor.ch = 0;
  const L = LESSONS[Tutor.ch];
  if (Tutor.ln < 0 || Tutor.ln >= L.lines.length) Tutor.ln = 0;
  const go = (hash, isNew)=>{ if (isNew) startWizard(null); location.hash = hash; };
  const setLesson = (i, ln)=>{ Tutor.ch = i; Tutor.ln = ln||0; tutorSave(); renderTutorial(); };

  const stage = h('div',{class:'vn scene-'+(L.scene||'study'), tabindex:0, role:'region', 'aria-label':'บทเรียน '+L.title});
  const sprite = nemImg(L.lines[Tutor.ln][0], 'vn-sprite-img');
  const nameEl = h('div',{class:'vn-name'}, h('b',{text:NEM.name}), h('span',{text:NEM.title}));
  const textEl = h('div',{class:'vn-text'});
  const nextEl = h('div',{class:'vn-next',text:'▼'});
  const counter = h('span',{class:'vn-count num'});
  const choices = h('div',{class:'vn-choices hidden'});
  const autoBtn = h('button',{class:'small ghost'+(Tutor.auto?' on':''), title:'เล่นต่อเองเมื่อพูดจบ', onclick:(e)=>{ e.stopPropagation(); Tutor.auto = !Tutor.auto; autoBtn.classList.toggle('on', Tutor.auto); autoBtn.textContent = Tutor.auto ? 'อัตโนมัติ: เปิด' : 'อัตโนมัติ'; if (Tutor.auto && !Tutor.typing) armAuto(); }, text: Tutor.auto ? 'อัตโนมัติ: เปิด' : 'อัตโนมัติ'});
  const top = h('div',{class:'vn-top'},
    h('div',{class:'vn-title'}, h('div',{class:'kicker',text:`บทที่ ${Tutor.ch+1} / ${LESSONS.length}`}), h('h2',{text:L.title})),
    h('div',{class:'row vn-tools'},
      h('button',{class:'small ghost',onclick:(e)=>{ e.stopPropagation(); openLessonMenu(); },text:'สารบัญ'}),
      h('button',{class:'small ghost',onclick:(e)=>{ e.stopPropagation(); toggleLog(); },text:'อ่านทั้งบท'}),
      autoBtn,
      h('button',{class:'small ghost',onclick:(e)=>{ e.stopPropagation(); finishChapter(); },text:'ข้ามบท'})));
  const box = h('div',{class:'vn-box'}, nameEl, textEl, h('div',{class:'vn-foot'}, counter, nextEl), choices);
  const log = h('div',{class:'vn-log hidden'});
  const figHost = h('div',{class:'vn-fighost'});
  stage.append(h('div',{class:'vn-bg'}), h('div',{class:'vn-fog'}), top, h('div',{class:'vn-sprite'}, sprite), figHost, box, log);
  root.append(stage);
  root.append(h('p',{class:'dim vn-hint',text:'คลิกที่ฉาก หรือกด Space / Enter / → เพื่อพูดต่อ · คลิกระหว่างที่ตัวอักษรกำลังขึ้นเพื่อแสดงทั้งบรรทัด · ความคืบหน้าถูกจำไว้ในเครื่องนี้'}));

  function openLessonMenu(){
    const list = h('div',{class:'vn-menu'});
    LESSONS.forEach((x,i)=> list.append(h('button',{class:'toc-i'+(i===Tutor.ch?' on':'')+(i<Tutor.ch?' done':''),onclick:()=>{ modal(null); setLesson(i,0); }}, h('span',{class:'num dim',text:String(i+1).padStart(2,'0')}), h('span',{text:x.nav}), i<Tutor.ch ? h('span',{class:'tag ok',text:'จบแล้ว'}) : null)));
    modal(h('div',null, h('h2',{text:'สารบัญบทเรียน'}), h('p',{class:'dim',style:'font-size:13px',text:'เลือกบทที่อยากฟัง เนเมสไซอาร์จะเริ่มเล่าตั้งแต่ต้นบท'}), list, h('div',{class:'row',style:'margin-top:12px'}, h('button',{class:'small ghost',onclick:()=>{ modal(null); setLesson(0,0); },text:'เริ่มใหม่ตั้งแต่บทแรก'}))));
  }
  function toggleLog(){
    if (!log.classList.contains('hidden')){ log.classList.add('hidden'); return; }
    clear(log);
    log.append(h('div',{class:'row',style:'justify-content:space-between'}, h('b',{text:'บทนี้ทั้งบท'}), h('button',{class:'small ghost',onclick:(e)=>{ e.stopPropagation(); log.classList.add('hidden'); },text:'ปิด'})));
    L.lines.forEach(([m,t,f],i)=> log.append(h('div',{class:'vn-logline'+(i===Tutor.ln?' cur':''), onclick:(e)=>{ e.stopPropagation(); Tutor.ln = i; tutorSave(); showLine(); log.classList.add('hidden'); }}, h('img',{src:nemSrc(m),alt:''}), h('div',null, T(t)))));
    log.classList.remove('hidden');
  }
  function armAuto(){ if (!Tutor.auto) return; if (Tutor.timer) clearTimeout(Tutor.timer); const len = L.lines[Tutor.ln][1].length; Tutor.timer = setTimeout(()=>{ Tutor.timer=null; if (Tutor.auto) advance(); }, 1400 + Math.min(4000, len*22)); }
  function typeOut(text, onDone){
    tutorStopTimers();
    clear(textEl); textEl.classList.add('typing');
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let i = 0; const span = h('span'); textEl.append(span);
    const finish = ()=>{ if (Tutor.typing){ clearInterval(Tutor.typing); Tutor.typing=null; } clear(textEl); textEl.classList.remove('typing'); textEl.append(T(text)); nextEl.classList.add('show'); if (onDone) onDone(); };
    if (reduce){ finish(); return; }
    nextEl.classList.remove('show');
    Tutor.typing = setInterval(()=>{ i += 2; span.textContent = text.slice(0, i); if (i >= text.length) finish(); }, 18);
    textEl._finish = finish;
  }
  function figFor(ln){ for (let i=ln;i>=0;i--){ const f = L.lines[i][2]; if (f !== undefined) return f; } return null; }
  function showFig(ln){ const spec = figFor(ln); const key = JSON.stringify(spec||null); if (figHost.dataset.key === key) return; figHost.dataset.key = key; clear(figHost); const node = vnFigure(spec); if (node) figHost.append(node); stage.classList.toggle('has-fig', !!node); }
  function showLine(){
    const [mood, text] = L.lines[Tutor.ln];
    showFig(Tutor.ln);
    Tutor.done = false;
    choices.classList.add('hidden');
    sprite.src = nemSrc(mood); stage.className = 'vn scene-'+(L.scene||'study')+' mood-'+mood;
    sprite.classList.remove('nem-pop'); void sprite.offsetWidth; sprite.classList.add('nem-pop');
    counter.textContent = `${Tutor.ln+1} / ${L.lines.length}`;
    typeOut(text, ()=>{ if (Tutor.ln === L.lines.length-1) showChoices(); else armAuto(); });
  }
  function showChoices(){
    Tutor.done = true; nextEl.classList.remove('show');
    clear(choices);
    if (L.tryHash) choices.append(h('button',{class:'ghost',onclick:(e)=>{ e.stopPropagation(); go(L.tryHash, L.tryNew); },text:'ลองทำ: '+L.tryLabel}));
    if (Tutor.ch < LESSONS.length-1) choices.append(h('button',{class:'primary',onclick:(e)=>{ e.stopPropagation(); setLesson(Tutor.ch+1, 0); },text:'บทถัดไป →'}));
    else choices.append(h('button',{class:'primary',onclick:(e)=>{ e.stopPropagation(); go('#wizard', true); },text:'สร้างตัวละครตัวแรก'}));
    if (Tutor.ln > 0) choices.append(h('button',{class:'small ghost',onclick:(e)=>{ e.stopPropagation(); Tutor.ln=0; tutorSave(); showLine(); },text:'ฟังบทนี้อีกครั้ง'}));
    choices.classList.remove('hidden');
  }
  function finishChapter(){ Tutor.ln = L.lines.length-1; tutorSave(); const [mood, text] = L.lines[Tutor.ln]; sprite.src = nemSrc(mood); showFig(Tutor.ln); counter.textContent = `${Tutor.ln+1} / ${L.lines.length}`; tutorStopTimers(); clear(textEl); textEl.append(T(text)); showChoices(); }
  function advance(){
    if (Tutor.typing){ textEl._finish && textEl._finish(); return; }
    if (Tutor.done){ if (Tutor.ch < LESSONS.length-1) setLesson(Tutor.ch+1, 0); return; } // จบบท: คลิก/Space ไปบทถัดไป (บทสุดท้ายใช้ปุ่ม)
    if (Tutor.ln < L.lines.length-1){ Tutor.ln++; tutorSave(); showLine(); }
  }
  function back(){ tutorStopTimers(); if (Tutor.ln > 0){ Tutor.ln--; tutorSave(); showLine(); } else if (Tutor.ch > 0){ setLesson(Tutor.ch-1, LESSONS[Tutor.ch-1].lines.length-1); } }
  stage.addEventListener('click', (e)=>{ if (e.target.closest('button, .term, .vn-log, a')) return; advance(); });
  stage.addEventListener('keydown', (e)=>{ if (e.target.closest('input,textarea')) return; if (e.key===' ' || e.key==='Enter' || e.key==='ArrowRight'){ e.preventDefault(); advance(); } else if (e.key==='ArrowLeft'){ e.preventDefault(); back(); } });
  Tutor._advance = advance; Tutor._back = back; Tutor._stage = stage;
  showLine();
  setTimeout(()=>{ try { stage.focus({preventScroll:true}); } catch(e){} }, 50);
}
/* กด Space/→ ที่ไหนก็ได้ในหน้าสอนเล่น (นอกช่องกรอกข้อความ) */
document.addEventListener('keydown', (e)=>{
  const v = $('#v-tutor'); if (!v || !v.classList.contains('active')) return;
  if (e.target.closest('input,textarea,select,button,.modal')) return;
  if (document.activeElement === Tutor._stage) return; // stage จัดการเอง
  if (e.key===' ' || e.key==='Enter' || e.key==='ArrowRight'){ e.preventDefault(); Tutor._advance && Tutor._advance(); }
  else if (e.key==='ArrowLeft'){ e.preventDefault(); Tutor._back && Tutor._back(); }
});

  function feat(glyph, title, text){ return h('div',{class:'card featcard'}, h('div',{class:'glyph',text:glyph}), h('h4',{text:title}), h('div',{class:'desc'}, T(text))); }
}

/* ---- routing: #home #create(สอนเล่น) #wizard #chars #sheet-<id> #table #room-<id> #rules #dev ---- */
const ROUTE_VIEW = { home:'home', create:'tutor', tutor:'tutor', wizard:'create', chars:'chars', sheet:'sheet', table:'table', room:'table', rules:'rules', dev:'dev' };
function devAllowed(){ return !!(Store.isDevUid || (Store.backend==='firebase' && Store.site && !(Store.site.devUids||[]).length) || Store.backend!=='firebase'); }
function route(){
  let hash = location.hash.replace('#','') || 'home';
  let view = hash, arg = null;
  const m = hash.match(/^(sheet|room)-([a-z0-9]+)$/);
  if (m){ view = m[1]; arg = m[2]; }
  if (!ROUTE_VIEW[view]) { view='home'; }
  if (view==='dev' && Store.ready && !devAllowed()){ location.hash = '#home'; return; }
  for (const v of document.querySelectorAll('.view')) v.classList.remove('active');
  const target = ROUTE_VIEW[view];
  $('#v-'+target).classList.add('active');
  const navKey = view==='room' ? 'table' : (view==='sheet' || view==='wizard') ? 'chars' : target;
  for (const a of document.querySelectorAll('#nav a')) a.classList.toggle('active', a.dataset.v===navKey);
  document.body.className = document.body.className.replace(/\bbg-\S+/g,'').trim();
  document.body.classList.add(view==='home' || view==='tutor' || view==='create' ? 'bg-study' : 'bg-map');
  document.body.classList.toggle('on-tutor', target==='tutor');
  if (view!=='room' && view!=='sheet' && Table.roomId) Table.close(); // เปิดชีทจากห้องแล้วยังค้างห้องไว้ให้กลับได้
  if (view!=='sheet') HUD.hide();
  switch(view){
    case 'home': renderHome(); break;
    case 'create': case 'tutor': renderTutorial(); break;
    case 'wizard': renderWizard(); break;
    case 'chars': renderChars(); break;
    case 'sheet': renderSheet(arg); break;
    case 'table': renderTableHome(); break;
    case 'room': if (Table.roomId!==arg) Table.open(arg); else renderTable(); break;
    case 'rules': renderRules(); break;
    case 'dev': renderDev(); break;
  }
}
window.addEventListener('hashchange', route);
Store.listeners.add(()=>{ const hsh=location.hash; if (hsh==='#chars') renderChars(); else if (hsh==='' || hsh==='#home') renderHome(); });
route();
initCapabilities().then(()=>{ Store.ready = true; if (location.hash==='#table') renderTableHome(); if (location.hash==='#chars') renderChars(); if (location.hash==='#dev'){ if (devAllowed()) renderDev(); else location.hash='#home'; } const m = location.hash.match(/^#room-([a-z0-9]+)$/); if (m){ Table.close(); Table.open(m[1]); } if (Store.isDevUid) $('#nav-dev').classList.remove('hidden'); });
// test hook (read-only)
window.__kirana = { compute, roll2d6, judge, DATA, Store, knowledgeLevels, allSkills };

</script>
