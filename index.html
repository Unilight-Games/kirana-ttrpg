<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirana TTRPG Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Taviraj:wght@500;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
:root{
  /* Kirana: โลกใต้ม่านมานา หมึกน้ำเงินดำ กระดูกซีด เลือดจันทร์ มานาเขียวน้ำแข็ง */
  --ink:#0d1117; --ink-2:#141b24; --ink-3:#1c2531; --line:#2a3645; --line-2:#394759;
  --bone:#e6e1d6; --bone-dim:#a9b0ba; --bone-mute:#6e7a88;
  --blood:#c0392b; --blood-2:#e05a4a; --mana:#4fd1c5; --mana-2:#2a7f77; --gold:#d4a84a;
  --ok:#5bb97a; --warn:#e0a53a; --bad:#e05a4a;
  --font-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;
  --font-gothic:"Taviraj","IBM Plex Sans Thai",Georgia,serif;
  --font-black:"UnifrakturMaguntia","Taviraj",Georgia,serif;
  --velvet:rgba(58,13,19,.94); --velvet-2:rgba(32,7,11,.97); --brass:#b08a46; --parch:#f1e7d2;
  --radius:8px;
  /* layout: ซ้าย = งานหลัก (วิซาร์ด/ชีท/โต๊ะ), ขวา = แผงสรุป "ตอนนี้ได้อะไร" ติดตามทุกขั้น */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--bone);font-family:var(--font-body);font-size:15px;line-height:1.6;letter-spacing:0}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:28px}h2{font-size:22px}h3{font-size:17px}h4{font-size:15px}
a{color:var(--mana)}
button{font-family:inherit;font-size:14px;cursor:pointer;border-radius:6px;border:1px solid var(--line-2);background:var(--ink-3);color:var(--bone);padding:7px 12px;line-height:1.3}
button:hover{border-color:var(--mana-2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--mana);outline-offset:2px}
button.primary{background:var(--blood);border-color:var(--blood);color:#fff;font-weight:600}
button.primary:hover{background:var(--blood-2)}
button.ghost{background:transparent}
button.small{padding:3px 8px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:14px;background:var(--ink);color:var(--bone);border:1px solid var(--line-2);border-radius:6px;padding:7px 10px;line-height:1.5}
textarea{width:100%;min-height:70px;resize:vertical}
label{font-size:13px;color:var(--bone-dim)}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--bone-dim);line-height:1.5;white-space:nowrap}
.tag.stat{border-color:var(--mana-2);color:var(--mana)}
.tag.neg{border-color:var(--blood);color:var(--blood-2)}
.tag.prop{border-color:var(--gold);color:var(--gold)}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.muted{color:var(--bone-mute)}
.dim{color:var(--bone-dim)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.hidden{display:none!important}

/* shell */
.top{position:sticky;top:0;z-index:20;background:rgba(13,17,23,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.5px;display:flex;gap:10px;align-items:center}
.brand .moon{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--blood-2),var(--blood) 60%,#5a1710);box-shadow:0 0 12px rgba(224,90,74,.5)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--bone-dim);text-decoration:none;padding:6px 10px;border-radius:6px;font-size:14px}
nav a.active{color:var(--bone);background:var(--ink-3)}
nav a:hover{color:var(--bone)}
.online{margin-left:auto;font-size:12px;color:var(--bone-mute)}
.online .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bone-mute);margin-right:6px}
.online .dot.on{background:var(--ok)}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.view{display:none}.view.active{display:block}

/* cards */
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card.sel{border-color:var(--mana);box-shadow:0 0 0 1px var(--mana) inset}
.card.pick{cursor:pointer}
.card.pick:hover{border-color:var(--line-2);background:var(--ink-3)}
.card.disabled{opacity:.5;cursor:not-allowed}
.card h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3 .en{font-size:13px;color:var(--bone-mute);font-family:var(--font-body);font-weight:400}
.gives{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.desc{font-size:14px;color:var(--bone-dim)}
details summary{cursor:pointer;color:var(--mana);font-size:13px}
.two{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.three{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cs .grid.three{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

/* wizard layout */
.wiz{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:900px){.wiz{grid-template-columns:1fr}.side{position:static!important}}
.side{position:sticky;top:64px;max-height:calc(100vh - 76px);overflow:auto;scrollbar-width:thin;padding-right:2px}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.steps button{padding:5px 10px;font-size:13px;border-radius:999px}
.steps button.cur{border-color:var(--blood);color:#fff;background:var(--blood)}
.steps button.done{border-color:var(--mana-2);color:var(--mana)}
.stephead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stephead p{margin:4px 0 0;color:var(--bone-dim);max-width:70ch}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:13px}
.summary dt{color:var(--bone-mute)}.summary dd{margin:0}
.statgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.statbox{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 4px;text-align:center}
.statbox .k{font-family:var(--font-display);font-size:12px;color:var(--bone-mute)}
.statbox .v{font-size:18px;font-weight:600}
.statbox .m{font-size:12px;color:var(--mana)}
.statbox .d{font-size:11px;color:var(--gold)}
.warnbox{border:1px solid var(--warn);background:rgba(224,165,58,.08);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--warn)}
.okbox{border:1px solid var(--ok);background:rgba(91,185,122,.08);border-radius:6px;padding:8px 10px;font-size:13px}
.infobox{border:1px solid var(--line-2);background:var(--ink-3);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--bone-dim)}

/* personality */
.axis{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.axis .pole{font-size:13px}
.axis .pole b{font-family:var(--font-display);font-size:15px;display:block}
.axis .pole.r{text-align:right}
.axis .ctl{display:flex;flex-direction:column;align-items:center;gap:4px}
.axis .ctl .val{font-family:var(--font-display);font-size:22px;min-width:64px;text-align:center}
.axis.on .pole.active b{color:var(--mana)}
.budget{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.budget .chip{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line-2);font-family:var(--font-display)}
.budget .chip.used{opacity:.3;text-decoration:line-through}

/* extra points */
.alloc{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.alloc .box{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-align:center}
.alloc .box .k{font-family:var(--font-display);color:var(--bone-dim)}
.alloc .box .big{font-size:26px;font-weight:600}
.alloc .box .ctl{display:flex;justify-content:center;gap:8px;margin-top:6px}

/* skill picker */
.skfilter{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sklist{display:grid;gap:8px;max-height:460px;overflow:auto;padding-right:4px}
.sk{background:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.sk:hover{border-color:var(--line-2)}
.sk.sel{border-color:var(--mana)}
.sk .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sk .h b{font-family:var(--font-display)}
.sk .eff{font-size:13px;color:var(--bone-dim);margin-top:4px}

/* sheet */
.sheet{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:900px){.sheet{grid-template-columns:1fr}}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.res .r{background:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:8px}
.res .r .k{font-size:12px;color:var(--bone-mute);font-family:var(--font-display)}
.res .r .v{font-size:22px;font-weight:600;display:flex;gap:6px;align-items:baseline}
.res .r .v small{font-size:13px;color:var(--bone-mute);font-weight:400}
.bar{height:6px;border-radius:3px;background:var(--ink);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--mana)}
.bar.hp i{background:var(--blood-2)}.bar.san i{background:var(--gold)}
.rollbtn{display:inline-flex;gap:6px;align-items:center}
.body{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.body .p{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center;font-size:13px}
.body .p b{display:block;font-size:18px}
.log{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:360px;overflow:auto;font-size:13px}
.log .e{padding:6px 0;border-bottom:1px solid var(--line)}
.log .e:last-child{border-bottom:0}
.die{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;background:var(--bone);color:var(--ink);font-weight:700;font-family:var(--font-display);margin-right:3px}
.die.drop{opacity:.35;text-decoration:line-through}
.res-full{color:var(--ok)}.res-part{color:var(--warn)}.res-fail{color:var(--bad)}.res-crit{color:var(--mana)}

/* table */
.table-wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:1000px){.table-wrap{grid-template-columns:1fr}}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.zone{background:var(--ink-2);border:1px dashed var(--line-2);border-radius:var(--radius);padding:10px;min-height:140px}
.zone.eng{border-color:var(--blood);border-style:solid}
.zone.near{border-color:var(--gold)}
.zone.far{border-color:var(--mana-2)}
.zone h4{display:flex;justify-content:space-between;gap:6px;align-items:center}
.zone .range{font-size:11px;color:var(--bone-mute);font-family:var(--font-body);font-weight:400}
.tok{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-top:6px;font-size:13px}
.tok .ctl{flex-basis:100%;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tok .ctl select{padding:3px 6px;font-size:12px;max-width:140px}
.tok .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:12px;flex:none}
.tok.pc .av{background:var(--mana-2);color:#fff}.tok.npc .av{background:var(--blood);color:#fff}
.tok.hid{opacity:.55;border-style:dashed}
.tok.turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.tok .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok .mini{font-size:11px;color:var(--bone-mute);display:flex;gap:6px}
.chat{display:flex;flex-direction:column;gap:8px}
.chat .log{max-height:420px;min-height:200px}
.chat .e .who{color:var(--mana);font-weight:600}
.chat .e .gm{color:var(--gold);font-size:11px}
.init li{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;border-radius:4px}
.init li.cur{background:var(--ink-3);outline:1px solid var(--gold)}
.init ol{margin:0;padding-left:20px}
.clock{display:inline-grid;place-items:center}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink-3);border:1px solid var(--line-2);color:var(--bone);padding:10px 14px;border-radius:8px;z-index:50;font-size:14px;max-width:90vw}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
table.t th{color:var(--bone-mute);font-weight:500}
.tablewrap{overflow-x:auto}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;margin-bottom:24px}
@media (max-width:800px){.hero{grid-template-columns:1fr}}
.hero p{max-width:60ch;color:var(--bone-dim)}
.kicker{font-family:var(--font-display);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--blood-2)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
@media (max-width:600px){.online{display:none}.top-in{gap:8px}}
@media (prefers-reduced-motion:no-preference){.card.pick{transition:border-color .15s,background .15s}}
.sr{position:absolute;left:-9999px}
.inline-roll{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:60;padding:16px}
.modal .box{background:var(--ink-2);border:1px solid var(--line-2);border-radius:10px;padding:16px;max-width:720px;width:100%;max-height:90vh;overflow:auto}

/* ---- v0.3: stat colours, glossary, gate, personality bars, kin cards, sheet template ---- */
.statbox{border-top:3px solid var(--sc,var(--line-2))}
.statbox .k{color:var(--sc,var(--bone-mute))}
.statbox .v{color:var(--bone)}
.sc-STR{--sc:#e5484d}.sc-AGI{--sc:#3fb950}.sc-VIT{--sc:#f08c2e}.sc-PER{--sc:#e8c547}.sc-INF{--sc:#a371f7}.sc-INT{--sc:#58b7ff}
.tag.stat.sc{border-color:var(--sc);color:var(--sc)}
.term{border-bottom:1px dotted var(--mana);cursor:help;color:inherit}
.term:hover{color:var(--mana)}
.pop{position:absolute;z-index:80;background:var(--ink-3);border:1px solid var(--mana-2);border-radius:8px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:13px;line-height:1.55}
.pop-h{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.pop-h b{font-family:var(--font-display);font-size:15px;color:var(--mana)}
.pop-b{color:var(--bone)}
.pop-c{color:var(--bone-mute);font-size:11px;margin-top:6px}
.gate{max-width:420px}
/* personality bar */
.pbar{height:14px;border-radius:7px;overflow:hidden;display:flex;background:var(--ink);border:1px solid var(--line-2)}
.pbar .warm{background:linear-gradient(90deg,#e5484d,#f08c2e)}
.pbar .cool{background:linear-gradient(90deg,#2f81f7,#4fd1c5)}
.axis .pole.warm b{color:#f08c2e}.axis .pole.cool b{color:#58b7ff}
.axis .pole.warm.active b{color:#ff9d57;text-shadow:0 0 12px rgba(240,140,46,.5)}
.axis .pole.cool.active b{color:#7cc4ff;text-shadow:0 0 12px rgba(88,183,255,.5)}
.axis{grid-template-columns:1fr auto 1fr;grid-template-areas:"l c r" "bar bar bar"}
.axis .pole:first-child{grid-area:l}.axis .ctl{grid-area:c}.axis .pole.r{grid-area:r}.axis .pbar{grid-area:bar;margin-top:8px}
.lvl{display:flex;gap:4px}
.lvl button{min-width:34px}
/* kin cards */
.kin-card{position:relative;overflow:hidden}
.kin-card .ribbon{position:absolute;right:-28px;top:12px;transform:rotate(35deg);background:var(--ink-3);color:var(--bone-dim);font-size:11px;padding:2px 36px;border:1px solid var(--line-2)}
.kin-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0}
.kin-stats .s{text-align:center;border-radius:6px;padding:4px 2px;background:var(--ink);border-top:3px solid var(--sc)}
.kin-stats .s .k{font-family:var(--font-display);font-size:11px;color:var(--sc)}
.kin-stats .s .v{font-size:17px;font-weight:600}
.kin-stats .s .m{font-size:11px;color:var(--bone-dim)}
.pros{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.pros ul{margin:2px 0 0;padding-left:16px}
.pros .good{color:var(--ok)}.pros .bad{color:var(--blood-2)}
/* profile card */
.profile{border-left:3px solid var(--gold)}
.profile .arch{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
/* sheet (template) */
.cs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.cs .cscol{display:flex;flex-direction:column;gap:14px;min-width:0}
.cs .box{margin:0}
@media (max-width:1100px){.cs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.cs{grid-template-columns:1fr}}
.idgrid.two{grid-template-columns:auto 1fr auto 1fr}
.cs .box.notes .grid.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cs .box.notes textarea{min-height:64px}
.idgrid.two textarea{grid-column:2/-1}
.idgrid.two textarea+.k,.idgrid.two .k:has(+textarea){grid-column:1}
.cs .box{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.cs .box h4{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--bone-mute);margin-bottom:8px}
.portrait{aspect-ratio:3/4;max-width:240px;margin:0 auto;background:var(--ink);border:1px dashed var(--line-2);border-radius:8px;display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--bone-mute);font-size:13px;text-align:center}
.portrait img{width:100%;height:100%;object-fit:cover}
.resbar{margin:8px 0}
.resbar .l{display:flex;justify-content:space-between;font-size:13px}
.resbar .l b{font-family:var(--font-display)}
.resbar .bar{height:10px}
.resbar .ctl{display:flex;gap:4px;margin-top:4px}
.resbar .ctl input{width:64px;padding:3px 6px}
.idgrid{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.idgrid .k{color:var(--bone-mute)}
.idgrid input{width:100%;padding:3px 6px;font-size:13px}
table.stt{width:100%;border-collapse:collapse;font-size:13px}
table.stt th{font-size:11px;letter-spacing:1px;color:var(--bone-mute);font-weight:500;padding:4px}
table.stt td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
table.stt td.n{text-align:left;font-family:var(--font-display);font-weight:600;color:var(--sc)}
table.stt td.ov{font-weight:700;font-size:16px;color:var(--sc)}
.ptable{display:grid;grid-template-columns:1fr auto auto auto 1fr;gap:4px 8px;align-items:center;font-size:13px}
.ptable .v{font-family:var(--font-display);font-weight:600;min-width:28px;text-align:center}
.ptable .lw{color:#f08c2e;text-align:right}.ptable .rc{color:#58b7ff}
.body2{display:grid;grid-template-columns:1fr auto auto;gap:4px 8px;align-items:center;font-size:13px}
.body2 input{width:54px;padding:2px 4px;text-align:center}
.slots{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:13px;align-items:center}
.slots .k{color:var(--bone-mute)}
.slots input{width:100%;padding:3px 6px;font-size:13px}

/* ---- dice overlay & roll lock ---- */
.dice-overlay{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(5,8,12,.72);backdrop-filter:blur(3px);animation:fadein .18s ease-out;pointer-events:none}

.dicebox{background:var(--ink-2);border:1px solid var(--line-2);border-radius:14px;padding:22px 30px;min-width:300px;max-width:92vw;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(79,209,197,.15);animation:popin .32s cubic-bezier(.2,1.4,.4,1)}
.dicebox.crit{box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(212,168,74,.45);border-color:var(--gold)}
.dice-who{font-size:15px;color:var(--bone-dim);margin-bottom:12px}

.dice-row{display:flex;gap:14px;justify-content:center;margin:6px 0 12px}
.bigdie{width:72px;height:72px;border-radius:14px;background:var(--bone);color:var(--ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:40px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.4);transition:transform .25s}
.bigdie.tumble{animation:tumble .28s linear infinite}

.dice-total.show{opacity:1;transform:none}

.dice-judge.show{opacity:1}
@keyframes tumble{0%{transform:rotate(-8deg) translateY(0)}25%{transform:rotate(6deg) translateY(-10px)}50%{transform:rotate(-5deg) translateY(0)}75%{transform:rotate(9deg) translateY(-6px)}100%{transform:rotate(-8deg) translateY(0)}}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.lockbanner{font-size:13px;color:var(--gold);border:1px dashed var(--gold);border-radius:6px;padding:5px 10px;margin-top:8px;animation:fadein .2s}
.lockbanner.hidden{display:none}
body.roll-locked .rollbtn{opacity:.4;pointer-events:none;filter:grayscale(.6)}
body.roll-locked .dicepanel{opacity:.75}

/* ---- drawers (skill / equipment / bag) ---- */
.drawerbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.drawertab{font-family:var(--font-display);letter-spacing:.3px}

.eqlist{display:flex;flex-direction:column;gap:4px}

.eqslot .k{color:var(--bone-mute);font-size:13px;padding-top:6px}
.eqslot.filled .k{color:var(--mana)}
.eqbody input{padding:3px 6px;font-size:13px}
.eqbody .row>input:first-child{flex:1;min-width:140px;font-weight:600}

/* ---- dice picker ---- */
.pickbox{text-align:center}
.pickdie{cursor:pointer;border:3px solid transparent;transition:transform .15s,border-color .15s}

/* ---- IP shop cards ---- */
.ipshop .ipbal{font-family:var(--font-display);color:var(--gold);font-size:20px;margin-left:6px}

.ipshop .hand.all{justify-content:flex-start}
.ipcard{position:relative;width:196px;min-height:250px;display:flex;flex-direction:column;gap:6px;padding:28px 12px 12px;border-radius:12px;border:1px solid var(--line-2);background:linear-gradient(170deg,var(--ink-3),var(--ink-2) 60%,#0b0f14);box-shadow:0 10px 24px rgba(0,0,0,.45);transition:transform .18s,box-shadow .18s}

.ipcard.stat{border-color:var(--gold)}.ipcard.knowledge{border-color:var(--mana-2)}.ipcard.skill{border-color:var(--blood)}
.ipcard .cost{position:absolute;top:28px;right:10px;font-family:var(--font-display);font-weight:700;color:var(--gold);font-size:15px}

/* ---- HUD แบบเกม: ปุ่มลอย + หน้าต่างลอย ---- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:50}

.hud-dock{z-index:2;position:fixed;right:14px;top:38%;display:flex;flex-direction:column;gap:8px;padding:8px 6px;border-radius:16px;background:linear-gradient(180deg,#1b232e,#0f151c);border:1px solid #3a4758;box-shadow:0 12px 30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);cursor:grab;user-select:none}

.hud-grip{display:grid;place-items:center;color:var(--bone-mute);height:14px}
.hud-grip .ico{width:16px;height:16px;display:block}
.hud-btn{position:relative;width:62px;height:62px;padding:4px 2px 2px;border-radius:14px;border:1px solid #4a5a6e;background:radial-gradient(circle at 35% 30%,#2b3747,#161d26 70%);color:var(--bone);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.hud-btn .ico{width:30px;height:30px;display:block;color:var(--gold)}
.hud-btn .ico svg{width:100%;height:100%}
.hud-btn .lbl{font-size:10px;line-height:1;color:var(--bone-dim)}
.hud-btn:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 0 14px rgba(212,168,74,.25)}
.hud-btn.on{border-color:var(--gold);background:radial-gradient(circle at 35% 30%,#4a3b16,#1c1710 70%);box-shadow:0 0 16px rgba(212,168,74,.35)}
.hud-btn .badge{position:absolute;top:-6px;right:-6px;font-size:10px;font-family:var(--font-display);padding:1px 6px;border-radius:999px;background:var(--ink);border:1px solid var(--gold);color:var(--gold);white-space:nowrap}
.hud-btn .badge.neg{border-color:var(--blood-2);color:var(--blood-2)}
.hud-win{z-index:1;position:fixed;right:90px;top:12%;width:560px;max-width:calc(100vw - 24px);max-height:80vh;display:flex;flex-direction:column;border-radius:14px;border:1px solid #5a4a22;background:linear-gradient(180deg,#171d26,#0e1319);box-shadow:0 24px 60px rgba(0,0,0,.7),0 0 0 1px rgba(212,168,74,.15),inset 0 1px 0 rgba(255,255,255,.05);animation:popin .2s cubic-bezier(.2,1.2,.4,1)}
.hud-win.dragging{box-shadow:0 30px 70px rgba(0,0,0,.8)}
.hud-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #3a3222;background:linear-gradient(90deg,rgba(212,168,74,.12),transparent);border-radius:14px 14px 0 0;cursor:grab;user-select:none;font-family:var(--font-display)}
.hud-head .ico{width:22px;height:22px;color:var(--gold)}
.hud-head .ico svg{width:100%;height:100%}
.hud-head .hud-sub{font-size:12px;font-family:var(--font-body)}
.hud-x{margin-left:auto;width:28px;height:28px;padding:4px;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--bone-dim)}
.hud-x:hover{border-color:var(--blood);color:var(--blood-2)}
.hud-x .ico{width:100%;height:100%;display:block}
.hud-body{padding:10px 12px 12px;overflow:auto}
.hud-meter{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:8px}
.hud-meter .bar{flex:1;height:8px;border-radius:999px;background:var(--ink);border:1px solid var(--line-2);overflow:hidden}
.hud-meter .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mana-2),var(--gold))}
.hud-meter.over .bar i{background:var(--blood-2)}
.hud-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{position:relative;min-height:78px;padding:8px 8px 20px;border-radius:10px;border:1px solid #3b4454;background:linear-gradient(160deg,#222c38,#141a22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 2px 6px rgba(0,0,0,.4);cursor:pointer;transition:transform .1s,border-color .1s;font-size:12px}
.tile:hover{transform:translateY(-2px);border-color:var(--gold)}
.tile.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,168,74,.35),0 4px 10px rgba(0,0,0,.5)}

.tile .nm{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .qty{position:absolute;top:4px;right:6px;font-family:var(--font-display);color:var(--gold);font-size:12px}

.tile.add{display:grid;place-items:center;border-style:dashed;background:transparent;text-align:center;padding:8px}

.hud-detail{margin-top:10px;padding:10px;border-radius:10px;border:1px solid #3b4454;background:rgba(0,0,0,.25)}

.hud-detail .row>input:first-child{flex:1;min-width:140px;font-weight:600}
.hud-detail textarea{width:100%;margin-top:6px;padding:4px 6px;font-size:13px;min-height:28px;resize:none;overflow:hidden;line-height:1.45}
.hud-detail label{font-size:11px}
.hud-hint{font-size:12px;margin:8px 0 0}

.hud-win.book{width:720px}
.hud-win.dice{width:520px}
.hud-dice{padding:0}.hud-dice h3{display:none}.hud-dice .log{max-height:220px;overflow:auto}

@media (max-width:760px){.hud-win{right:6px;left:6px!important;width:auto;top:8vh;max-height:84vh}.hud-win.book{width:auto}.book{grid-template-columns:1fr}.book .toc{border-right:0;border-bottom:1px solid #3d341d;max-height:30vh}.hud-btn{width:54px;height:54px}.hud-btn .ico{width:24px;height:24px}.hud-dock{flex-direction:row;top:auto;bottom:12px;right:10px;padding:6px 8px}.hud-grip{width:14px;height:auto}}

.mapwrap{margin-bottom:10px}
.mapctl{margin-bottom:8px;align-items:center}

.cell{position:relative;background:#2b3a2e;cursor:pointer;min-width:0;min-height:0}
.cell:hover{outline:1px solid var(--gold);z-index:2}
.t-ground{background:#2e3b2a}.t-grass{background:#36522f;background-image:repeating-linear-gradient(135deg,transparent 0 3px,rgba(0,0,0,.12) 3px 4px)}
.t-T{background:#1d3a22;background-image:radial-gradient(circle at 50% 45%,#2f6b3a 0 36%,transparent 38%)}

.t-R{background:#4a4f57;background-image:radial-gradient(circle at 40% 40%,#6a7079 0 30%,transparent 32%)}.t-r{background:#3f4348;background-image:radial-gradient(circle at 30% 60%,#5a5f66 0 15%,transparent 17%),radial-gradient(circle at 70% 30%,#5a5f66 0 12%,transparent 14%)}

.t-S{background:#c2a35f}.t-s{background:#dfe8f0}.t-B{background:#8b6a3e;background-image:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.2) 3px 4px)}
.t-H{background:#5a3f2b;box-shadow:inset 0 0 0 2px #2d1f14}.t-M{background:#4a3f2a}.t-C{background:#7a6a55;background-image:linear-gradient(90deg,transparent 60%,#2a2219 60%)}
.t-P{background:#5b4a35;background-image:radial-gradient(circle,#8d8273 0 28%,transparent 30%)}.t-L{background:#8a2a12;background-image:radial-gradient(circle at 40% 50%,#ff7a2a 0 25%,transparent 27%)}
.t-chasm{background:#07090c}.t-G{background:#3a4238;background-image:linear-gradient(90deg,transparent 35%,#9aa 35% 65%,transparent 65%)}.t-A{background:#6a5a3a;background-image:radial-gradient(circle,var(--gold) 0 20%,transparent 22%)}.t-X{background:#4a2a14;background-image:radial-gradient(circle,#ffb24a 0 25%,transparent 28%)}

.gtok{position:absolute;inset:6%;border-radius:50%;background:var(--ink-2);border:2px solid var(--mana);display:grid;place-items:center;overflow:hidden;font-size:10px;font-weight:700;color:var(--bone);box-shadow:0 2px 6px rgba(0,0,0,.6);z-index:3}

.gtok.npc{border-color:var(--blood-2)}.gtok.hid{opacity:.55;border-style:dashed}.gtok.turn{box-shadow:0 0 0 3px var(--gold),0 2px 6px rgba(0,0,0,.6)}.gtok.sel{box-shadow:0 0 0 3px #fff,0 0 12px rgba(255,255,255,.6)}.gtok.down{filter:grayscale(1);opacity:.6}

.fig-res{display:grid;gap:6px}.fig-resrow{display:grid;grid-template-columns:64px 1fr 44px;align-items:center;gap:8px;font-size:12.5px}.fig-resrow .bar{height:10px;background:#1a1014;border-radius:5px;overflow:hidden}.fig-resrow .bar div{height:100%}
.fig-cost{display:flex;gap:8px;align-items:center;margin:6px 0}.fig-cost .k{color:#cbb58a}
.fig-topbar{display:flex;gap:10px;align-items:center;background:rgba(13,17,23,.9);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12.5px}
.fig-pop-dice{text-align:center;background:rgba(0,0,0,.45);border:1px solid var(--gold);border-radius:10px;padding:10px;margin-bottom:8px}.fig-pop-dice .who{color:#cbb58a;font-size:12px;margin-bottom:6px}.fig-pop-dice .fig-dice{justify-content:center}.fig-pop-dice .tot{font-size:24px;color:var(--gold);font-weight:700;margin-top:4px}
.fig-gmkey{font-size:28px;letter-spacing:4px;color:var(--gold);font-weight:700;background:rgba(0,0,0,.4);border:1px dashed var(--brass);border-radius:8px;padding:8px 14px;text-align:center}
@media (max-width:760px){.vn-fighost{left:2%;right:2%;width:auto;max-width:none;top:16%;bottom:calc(2% + 170px);justify-content:center}.vn.has-fig .vn-sprite{opacity:.35}.vn-fig{font-size:12.5px;padding:10px}.fig-stats{grid-template-columns:repeat(3,1fr)}}

.roombar{position:sticky;top:56px;z-index:15;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(58,13,19,.92);border:1px solid var(--brass);border-radius:8px;padding:6px 10px;margin-bottom:10px;color:var(--parch);backdrop-filter:blur(4px)}
/* ===== แป้นอาวุธ ===== */
.wboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.wslot{position:relative;background:linear-gradient(180deg,rgba(58,13,19,.55),rgba(20,8,10,.75));border:1px solid #6b5a3e;border-radius:8px;padding:6px 8px 18px;min-height:64px;cursor:pointer;font-size:12px}
.wslot:hover{border-color:var(--gold)}
.wslot.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.wslot.filled{border-color:var(--brass)}
.wslot.shield{background:linear-gradient(180deg,rgba(20,40,50,.6),rgba(10,18,24,.8))}
.wslot .sl{font-size:10.5px;color:#cbb58a;letter-spacing:.3px;text-transform:uppercase}
.wslot .nm{font-weight:700;color:var(--parch);font-size:13px;line-height:1.3;margin:2px 0}
.wslot .ef{font-size:11px;color:var(--bone-dim);line-height:1.35}.wslot .ef b{color:var(--blood-2)}
.wslot .wt{position:absolute;right:6px;bottom:3px;font-size:10px;color:var(--bone-mute)}
.cs .box.combat .wboard{margin-top:4px}
@media (max-width:760px){.wboard{grid-template-columns:1fr 1fr}}
/* ทางเลือกในชุดเริ่มต้น / Trait */
.altpick{display:grid;gap:6px;margin:8px 0}
.altpick .opt{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border:1px solid var(--line-2);border-radius:6px;cursor:pointer;background:var(--ink)}
.altpick .opt.sel{border-color:var(--gold);background:rgba(212,168,74,.08)}
.altpick .opt input{margin-top:4px}
.traitpick{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12.5px}.traitpick input{flex:1;min-width:120px;padding:3px 8px;font-size:12.5px}

/* ===== สถานะบนหมาก / ไอเทมจาก GM ===== */
.conds{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.cond{font-size:11px;padding:0 6px;border-radius:999px;border:1px solid var(--line-2);background:rgba(0,0,0,.3);color:var(--bone-dim);cursor:default;white-space:nowrap}
.cond.c-burning{border-color:#f08c2e;color:#f0a35a}.cond.c-poisoned{border-color:#5bb97a;color:#7fd39a}.cond.c-bleeding,.cond.c-deepwound{border-color:var(--blood);color:var(--blood-2)}.cond.c-stunned,.cond.c-unbalanced,.cond.c-confused{border-color:#e8c547;color:#e8c547}.cond.c-frightened,.cond.c-charmed{border-color:#a371f7;color:#c3a3ff}.cond.c-hidden,.cond.c-invisible{border-style:dashed}.cond.c-rooted,.cond.c-grappled{border-color:#8a6a3e;color:#c9a46a}
.gtok .cbadges{position:absolute;top:-6px;left:-4px;display:flex;gap:1px;font-size:10px;line-height:1;filter:drop-shadow(0 1px 2px #000);z-index:2}
.gtok.c-burning{box-shadow:0 0 0 2px #f08c2e,0 0 12px rgba(240,140,46,.9)}
.gtok.c-poisoned{box-shadow:0 0 0 2px #5bb97a,0 0 10px rgba(91,185,122,.8)}
.gtok.c-bleeding,.gtok.c-deepwound{box-shadow:0 0 0 2px var(--blood),0 0 10px rgba(192,57,43,.9)}
.gtok.c-stunned,.gtok.c-unbalanced,.gtok.c-confused{box-shadow:0 0 0 2px #e8c547,0 0 10px rgba(232,197,71,.8)}
.gtok.c-frightened,.gtok.c-charmed{box-shadow:0 0 0 2px #a371f7,0 0 10px rgba(163,113,247,.8)}
.gtok.c-rooted,.gtok.c-grappled{box-shadow:0 0 0 2px #8a6a3e}
.gtok.c-prone,.gtok.c-incapacitated{filter:saturate(.4)}.gtok.c-prone img{transform:rotate(90deg)}
.gtok.c-hidden,.gtok.c-invisible{opacity:.45;border-style:dashed}
.gtok.c-blinded img{filter:brightness(.4)}
@media (prefers-reduced-motion:no-preference){.gtok.c-burning{animation:flick .9s ease-in-out infinite alternate}.gtok.c-stunned{animation:wobble 1.2s ease-in-out infinite}.gtok.c-poisoned{animation:pulse-g 1.6s ease-in-out infinite}}
@keyframes flick{from{box-shadow:0 0 0 2px #f08c2e,0 0 8px rgba(240,140,46,.7)}to{box-shadow:0 0 0 2px #ffb24a,0 0 18px rgba(255,178,74,1)}}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes pulse-g{0%,100%{filter:none}50%{filter:hue-rotate(60deg) saturate(1.4)}}
.giftlist{max-height:40vh;overflow:auto;margin-top:8px;display:grid;gap:6px}
.gift{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--ink)}
</style>
</head>

<script id="kirana-data" type="application/json">{"glossary":{"Stunned":{"th":"มึนงง","text":"ผลกระทบ: ตัวละครไม่สามารถทำ Action ใดๆ ได้ในเทิร์นของตน และไม่สามารถทำการ Defend (Parry/Evade) ได้ ศัตรูที่โจมตีระยะประชิดใส่ตัวละครที่ติดสภาวะนี้จะได้รับ Advantage ในการทอย Attack การสิ้นสุด: โดยปกติจะสิ้นสุดลงเมื่อจบเทิร์นถัดไปของผู้ที่ถูกทำให้ติดสภาวะ, เป้าหมายถูกโจมตีสำเร็จ (ส่งผลให้เสีย HP) หรือตามที่ความสามารถนั้นๆ ระบุ","cat":"สภาวะ (Condition)"},"Unbalanced":{"th":"เสียสมดุล","text":"ผลกระทบ: ตัวละครติด Disadvantage ในการทอย Defend (Parry/Evade) ทั้งหมด และการทอย Challenge ที่ต้องใช้ STR หรือ AGI การสิ้นสุด: สิ้นสุดลงเมื่อตัวละครใช้ 1 Maneuver เพื่อตั้งหลัก หรือเมื่อจบเทิร์นถัดไป","cat":"สภาวะ (Condition)"},"Prone":{"th":"ล้ม / หมอบ","text":"ผลกระทบ: ตัวละครกำลังนอนราบอยู่บนพื้น อาจเกิดจากการถูกโจมตีจนล้ม, การลื่น, หรือการจงใจหมอบลงเพื่อหาที่กำบัง การโจมตีระยะประชิด (Melee Attack) ทั้งหมดที่เล็งมายังคุณจะได้รับ Advantage การโจมตีระยะไกล (Range Attack) ทั้งหมดที่เล็งมายังคุณจะติด Disadvantage การทอย Attack ของคุณจะติด Disadvantage คุณไม่สามารถเคลื่อนที่ด้วยความเร็วปกติได้ ทำได้เพียงคลาน (ความเร็วเหลือ 1 เมตรต่อวินาที) การสิ้นสุด: สิ้นสุดลงทันทีเมื่อคุณใช้ 1 Maneuver เพื่อลุกขึ้นยืน","cat":"สภาวะ (Condition)"},"Bleeding":{"th":"เลือดออก","text":"ผลกระทบ: เมื่อเริ่มต้นเทิร์น ตัวละครจะได้รับ Physical Damage ตามระดับของสภาวะ (เช่น Bleeding 1, 2, 3) สภาวะนี้สามารถซ้อนทับกันได้จากหลายแหล่ง หลังการสร้างความเสียหายจากสภาวะะนี้ ระดับสภาวะจะลดลงครึ่งหนึ่ง (ปัดลง) หาก Bleeding เท่ากับ HP ตัวละคร ตัวละครจะหมดสติทันที การสิ้นสุด: สามารถใช้ Action เพื่อทำการปฐมพยาบาล (8 DC Medical Check) เพื่อทำให้หาย หรือใช้ความสามารถพิเศษบางอย่าง","cat":"สภาวะ (Condition)"},"Deepwound":{"th":"แผลลึก","text":"ผลกระทบ: โดนความเสียหายที่เกิดจาก Bleeding เป็นสองเท่า การสิ้นสุด: โดยปกติจะสิ้นสุดลงเมื่อจบเทิร์นถัดไปของผู้ที่ถูกทำให้ติดสภาวะ หรือตามที่ความสามารถนั้นๆ ระบุ","cat":"สภาวะ (Condition)"},"Burning":{"th":"เผาไหม้","text":"ผลกระทบ: เมื่อเริ่มต้นเทิร์น ตัวละครจะได้รับ Fire Damage ตามระดับของสภาวะ + ทุก ๆ 10 Max HP ของตัวละคร (ยิ่ง Max HP เยอะ ยิ่งได้รับ Damage) หากตัวละครสวมใส่เกราะ เกราะในส่วนนั้นจะได้รับความเสียหาย (ลดค่า Durability ลง) ตามดุลยพินิจของ GM การสิ้นสุด: สามารถใช้ 1 Action เพื่อพยายามดับไฟ (ทอย AGI Check ด้วย 8 DC), การ Maneuver 1 ครั้ง จะ -1 Burning หรือใช้วิธีอื่น เช่น น้ำหรือเวทมนตร์","cat":"สภาวะ (Condition)"},"Poisoned":{"th":"ติดพิษ","text":"ผลกระทบ: ตัวละครติด Disadvantage ในการทอย Attack และการทอย Check ที่เกี่ยวข้องกับ STR, AGI, VIT ทั้งหมด พิษจะสร้างความเสียหายเมื่อจบเทิร์นตัวละครที่ติดสถานะ ตามจำนวนระดับของพิษคูณด้วย Action ที่เขาใช้ไปในเทิร์นนั้น การสิ้นสุด: สิ้นสุดลงเมื่อเวลาผ่านไปตามที่ระบุ หรือใช้ยาถอนพิษ หรือผ่านการทอย VIT Saving Throw (DC 10) เมื่อจบเทิร์น","cat":"สภาวะ (Condition)"},"Rooted":{"th":"ยึดติด","text":"ผลกระทบ: ตัวละครจะถูกยึดติดกับสิ่งของ ฉากหรือตัวละครใด ๆ ทำให้ไม่สามารถเคลื่อนที่ได้ออกจากเขตปะทะ (Engagement Zone) ปัจจุบัน และไม่สามารถกระโดดหรือ [ลอย] ได้ การสิ้นสุด: เมื่อจบรอบการเล่น หรือทำการทอย STR Saving Throw (10 DC) กับสถานะนี้ในเทิร์นของตัวเองสำเร็จ","cat":"สภาวะ (Condition)"},"Grappled":{"th":"ถูกจับ","text":"ผลกระทบ: ตัวละครไม่สามารถเคลื่อนที่ออกจากเขตปะทะ (Engagement Zone) ปัจจุบันได้ และติด Disadvantage ในการทอย Attack ใส่เป้าหมายอื่นที่ไม่ใช่ผู้ที่จับตนเองอยู่ การสิ้นสุด: ชนะการทอย STR Challenge AGI หรือ STR ต่อผู้ที่จับอยู่ หรือเมื่อผู้ที่จับปล่อยหรือถูกทำให้ติดสภาวะอื่น","cat":"สภาวะ (Condition)"},"Incapacitated":{"th":"หมดสติ","text":"ผลกระทบ: ตัวละครนอนหมดสติ ไม่สามารถทำ Action ใดๆ ได้ การโจมตีใดๆ ที่กระทำต่อตัวละครนี้จะถือว่าเป็น Perfect Strike โดยอัตโนมัติ การสิ้นสุด: ได้รับการรักษาจน HP กลับมาเป็นบวก หรือมีคนปลุกให้ตื่น (หากไม่ได้หมดสติจาก HP เหลือ 0) ## หิวโหย (Starving) ผลกระทบ: เป็นสภาวะที่เกิดจากการขาดสารอาหารอย่างต่อเนื่อง ทำให้ร่างกายและจิตใจอ่อนแอลง สภาวะนี้สามารถซ้อนทับกันได้ โดยจะเพิ่มขึ้น 1 ระดับในทุกๆ 3 ช่วงเวลา (Time Interval) ที่ตัวละครไม่ได้บริโภคอาหาร หากทำการพักยาว (Long Rest) จะรีเซ็ทตัวนับช่วงเวลาที่ไม่ได้กินอาหาร การสิ้นสุด: สภาวะนี้จะลดลง 1 ระดับ ทุกครั้งที่ตัวละครบริโภคอาหาร 1 หน่วย (Ration) หรือรับ","cat":"สภาวะ (Condition)"},"Exhaustion":{"th":"เหนื่อยล้า","text":"ผลกระทบ: เป็นสภาวะซ้อนทับได้ มีหลายระดับ แต่ละระดับจะเพิ่มผลเสียที่รุนแรงขึ้นเรื่อยๆ ระดับ 1: Disadvantage ในการทอย Knowledge Check ทั้งหมด ระดับ 2: ความเร็ว (Speed) ทั้งหมดลดลงครึ่งหนึ่ง ระดับ 3: Disadvantage ในการทอย Attack และ Saving Throw ทั้งหมด ระดับ 4: HP สูงสุดลดลงครึ่งหนึ่ง ระดับ 5: ไม่สามารถทำ Cast Action ได้ ระดับ 6: เสียชีวิต การสิ้นสุด: การพักผ่อนอย่างเต็มที่ (Long Rest) จะลดระดับความเหนื่อยล้าลง 1 ระดับ ## เมา (Intoxicated) ## ผลกระทบ: ตัวละครตกอยู่ในสภาวะมึนเมาจากแอลกอฮอล์หรือสารเคมีอื่น ทำให้การควบคุมร่างกายและการคิดวิเคราะห์ลดลงอย่างมาก แต่ในขณะเดียวกันก็มีความกล้าบ้าบิ่นเพิ่ม","cat":"สภาวะ (Condition)"},"Deafened":{"th":"หูหนวก","text":"ผลกระทบ: ตัวละครไม่ได้ยินเสียงใดๆ และจะทอย PER Check ที่เกี่ยวข้องกับการฟังเสียงล้มเหลวโดยอัตโนมัติ การสิ้นสุด: ตามระยะเวลาของความสามารถ","cat":"สภาวะ (Condition)"},"Blinded":{"th":"ตาบอด","text":"ผลกระทบ: ตัวละครมองไม่เห็น และจะทอย Check ที่ต้องใช้สายตาล้มเหลวโดยอัตโนมัติ การโจมตีทั้งหมดที่เล็งมายังตัวละครจะได้รับ Advantage และการโจมตีของตัวละครจะติด Disadvantage การสิ้นสุด: ตามระยะเวลาของความสามารถ --- สภาวะที่ส่งผลต่อความคิด, อารมณ์ และการตัดสินใจของตัวละคร","cat":"สภาวะ (Condition)"},"Frightened":{"th":"หวาดกลัว","text":"ผลกระทบ: ตัวละครไม่สามารถเคลื่อนที่เข้าใกล้ต้นตอของความกลัวได้ และติด Disadvantage ในการทอย Attack และ Ability Check ทั้งหมด ตราบใดที่ยังมองเห็นต้นตอของความกลัวนั้นอยู่ การสิ้นสุด: เมื่อต้นตอของความกลัวหายไปจากสายตา หรือผ่านการทอย Confront Saving Throw (DC 10) เมื่อจบเทิร์น","cat":"สภาวะ (Condition)"},"Fight or Flight":{"th":"สู้หรือหนี","text":"ผลกระทบ: เกิดขึ้นเมื่อ Sanity ลดลงเหลือ 0 เนื่องจากตัวละครอื่น หนี (Flight): หากตัวละครได้เริ่มเทิร์นก่อนศัตรูที่ทำให้ Sanity หมด จะหวาดผวาและต้องใช้เทิร์นทั้งหมดเพื่อวิ่งหนีออกจาก Combat สู้ (Fight): หากเริ่มเทิร์นทีหลัง จะทำการโจมตีปกติ 1 ครั้งใส่ศัตรูนั้นทันที แล้วจบเทิร์น การสิ้นสุด: เมื่อออกจาก Combat หรือเมื่อศัตรูตัวนั้นตายไป และจะมีผลกระทบทางอารมณ์อื่นตามมา","cat":"สภาวะ (Condition)"},"Charmed":{"th":"ต้องมนตร์","text":"ผลกระทบ: ตัวละครไม่สามารถโจมตีหรือกระทำการที่เป็นภัยต่อผู้ที่ร่ายมนตร์ใส่ได้ และผู้ร่ายจะได้รับ Advantage ในการทอย INF Clash ทั้งหมดต่อตัวละครนั้น การสิ้นสุด: ตามระยะเวลาของความสามารถ หรือเมื่อผู้ร่ายหรือพันธมิตรของผู้ร่ายทำอันตรายต่อตัวละคร","cat":"สภาวะ (Condition)"},"Confused":{"th":"สับสน","text":"ผลกระทบ: เมื่อเริ่มต้นเทิร์น ตัวละครต้องทอย 1d6 เพื่อกำหนดพฤติกรรม 1-2: โจมตีสิ่งมีชีวิตที่อยู่ใกล้ที่สุด (ไม่ว่ามิตรหรือศัตรู) 3-4: ไม่ทำอะไรเลยในเทิร์นนี้ 5-6: เกิดอุบัติเหตุไม่คาดคิดหรือทำร้ายตัวเอง สร้างความเสียหายเท่ากับ Might ของตนเอง การสิ้นสุด: ผ่านการทอย PER Saving Throw (DC 8) เมื่อจบเทิร์น --- หมวด 3: สภาวะจากสภาพแวดล้อมและเวทมนตร์ (Environmental & Magical Conditions) สภาวะที่เกิดจากสภาพแวดล้อมหรือผลของเวทมนตร์โดยตรง","cat":"สภาวะ (Condition)"},"Silenced":{"th":"ถูกทำให้เงียบ","text":"ผลกระทบ: ตัวละครไม่สามารถพูดหรือใช้เวทมนตร์ที่ต้องมีส่วนประกอบด้านเสียง (Verbal Component) ได้ การสิ้นสุด: เมื่อออกจากพื้นที่ที่ส่งผล หรือตามระยะเวลาของเวทมนตร์","cat":"สภาวะ (Condition)"},"Cover":{"th":"มีที่กำบัง","text":"ผลกระทบ: เป็นสภาวะเชิงบวก ตัวละครที่หาที่กำบัง (เช่น หลังกำแพง, เสา) จะทำให้ศัตรูที่โจมตีระยะไกลใส่ติด Disadvantage การสิ้นสุด: เมื่อตัวละครออกจากที่กำบัง","cat":"สภาวะ (Condition)"},"Hidden":{"th":"ซ่อนตัว","text":"ผลกระทบ: เป็นสภาวะเชิงบวกที่ได้จากการทอย Burglary (Stealth) ชนะ Passive PER ของศัตรู ศัตรูจะไม่สามารถเล็งเป้ามาที่ตัวละครได้โดยตรง และการโจมตีครั้งแรกจากสภาวะนี้จะได้รับ Advantage และนับว่าเป็น Perfect Strike การสิ้นสุด: เมื่อตัวละครทำการโจมตี หรือทำสิ่งที่เปิดเผยตำแหน่งของตนเอง","cat":"สภาวะ (Condition)"},"Invisible":{"th":"ล่องหน","text":"ผลกระทบ: การโจมตีทั้งหมดที่เล็งมายังตัวละครจะติด Disadvantage และการโจมตีของตัวละครจะได้รับ Advantage และจะนับว่าอยู่ในสถานะซ่อนตัวเสมอจนกว่าจะมีตัวละครใดที่สามารถทอย PER Challenge AGI (Burglary) ได้สำเร็จ การสิ้นสุด: เมื่อตัวละครทำการโจมตีหรือใช้เวทมนตร์ หรือตามระยะเวลาที่กำหนด #### ตีตรา (Marked) ผลกระทบ: ตัวละครถูก \"หมายหัว\" ทำให้กลายเป็นเป้าหมายที่โดดเด่นและเปราะบางในสนามรบ พันธมิตรของผู้ที่ตีตรา ซึ่งประกาศ Overwatch ไปก่อนหน้า หากระยะการโจมตีถึงเป้าหมาย จะสามารถลบล้าง Overwatch ของตัวเองและประกาศใช้ Attack เป็น Reaction ได้ (เป็นผลให้เป้าหมายอาจโดนการโจมตีหลายครั้งในเทิร์นเดียวกัน), ลำดับ","cat":"สภาวะ (Condition)"},"Devoured":{"th":"ถูกกลืนกิน","text":"ผลกระทบ: เป็นสภาวะที่อันตรายอย่างยิ่ง เกิดขึ้นเมื่อถูกอสูรกายขนาดมหึมาหรือตัวละครใด ๆ กลืนลงไปทั้งตัว ตัวละครจะถูกย้ายไปยัง \"เขตภายใน\" (Internal Zone) ซึ่งแยกจากการต่อสู้ภายนอกโดยสิ้นเชิง และจะติดสภาวะต่อไปนี้ทั้งหมด: ตาบอด (Blinded) ต่อโลกภายนอก หูหนวก (Deafened) ต่อโลกภายนอก ถูกพันธนาการ (Restrained): ไม่สามารถเคลื่อนที่ได้ และติด Disadvantage ในการทอย Attack และ AGI Saving Throw ย่อยสลาย (Digesting): เมื่อเริ่มต้นเทิร์นของตัวละคร จะได้รับ Acid Damage (หรือ Necrotic Damage ตามชนิดของตัวละครที่กลืนกิน) ตามดุลพินิจของ GM (ปกติ 1d3) ความเสียหายนี้ไม่สามารถป้องกันได้ด้วย Armor แต่ยังสามารถป้องกั","cat":"สภาวะ (Condition)"},"On-Hit":{"th":"โจมตีโดน","text":"คือการโจมตีที่โดนเป้าหมายไม่ว่าจะทำให้สูญเสียหรือไม่สูญเสีย HP ก็ตาม นับรวมกรณีของการ Parry ก็ถือว่า On-Hit ด้วย","cat":"ศัพท์กฎ (Terminology)"},"Successful Attack":{"th":"โจมตีสำเร็จ","text":"คือการโจมตีที่สามารถทำให้เป้าหมายสูญเสีย HP อย่างน้อย 1 หน่วย","cat":"ศัพท์กฎ (Terminology)"},"Challenge":{"th":"ท้าทาย","text":"คือการทอยลูกเต๋าเพื่อวัดค่าสถานะการทอยแข่งกันระหว่างตัวละครสองตัวละคร โดยสถานะที่นำหน้าคือสถานะที่ผู้ใช้ต้องทอย และสถานะตามคือสถานะที่ผู้ถูกท้าจะต้องทอย (เช่น INT Challenge AGI คือผู้ท้าใช้ INT ทอยแข่ง AGI ของอีกฝ่าย) หากฝ่ายผู้ท้าทอยได้มากกว่าหรือเท่ากับผู้ถูกท้า จะถือว่าการทอยครั้งนั้นสำเร็จ","cat":"ศัพท์กฎ (Terminology)"},"Saving Throw":{"th":"ทอยป้องกัน","text":"คือการทอยเพื่อป้องกันตัวจากการเป็นเป้าหมายหรือสถานะที่จะทำให้เกิดผลลัพธ์ใด ๆ ผู้เล่นสามารถเลือกที่จะไม่ทอยและยอมรับผลลัพธ์นั้นก็ได้","cat":"ศัพท์กฎ (Terminology)"},"Armor":{"th":"เกราะ","text":"คือค่าที่ช่วยลดทอนความเสียหายที่เกิดจากความเสียหายประเภทกายภาพ (Physical) ซึ่งมีคุณภาพอยู่ 5 ระดับ (1-5) มักมาในรูปแบบของเกราะที่ตัวละครสวมใส่, ผลของการป้องกันจะอยู่กับจุดที่มี Armor เท่านั้น เช่นใส่เกราะแขนข้างซ้าย Armor ก็จะมีผลอยู่กับเพียงแขนข้างซ้าย","cat":"ศัพท์กฎ (Terminology)"},"Resistance":{"th":"ป้องกัน","text":"คือค่าที่ช่วยลดทอนความเสียหายที่เกิดจากความเสียหายในแบบต่าง ๆ ซึ่งมีผลทั่วทั้งตัว มีอยู่ 3 รูปแบบคือ Sorceries Resistance (ความเสียหายที่ไม่ได้เป็นทางกายภาพเช่น Fire Damage, Frost Damage, Sonic Damage, Necrotic Damage), Physical Resistance (เช่น ความเสียหายกายภาพที่เกิดจากอาวุธหรือการโจมตีทางกายภาพ) และ Mind Resistance (ป้องกันความเสียหายที่ส่งผลต่อจิต หรือ Sanity) มักได้มาจากพื้นหลัง เผ่า หรือเครื่องรางบางชนิดที่เสริมการป้องกันแบบจำเพาะ","cat":"ศัพท์กฎ (Terminology)"},"Immune":{"th":"ภูมิคุ้มกัน","text":"มักมาพร้อมกับสิ่งที่ตัวละครมีความต้านทานจนถึงจุดที่ความเสียหายประเภทที่ระบุนั้นไม่มีผลต่อตัวละครอีกต่อไป (เช่น ตัวละครมี Poison Immune หมายความว่าความเสียหายที่เกิดจาก Poison จะไม่เป็นผลต่อตัวละครนั้นอีกต่อไป)","cat":"ศัพท์กฎ (Terminology)"},"Advantage":{"th":"","text":"เมื่อตัวละครได้รับการทอยแบบ Advantage พวกเขาจะได้ทอยลูกเต๋า 3d6 และเลือกผลลัพธ์ 2 ลูกที่ดีที่สุดมาใช้","cat":"ศัพท์กฎ (Terminology)"},"Disadvantage":{"th":"","text":"เมื่อตัวละครติดสถานะ Disadvantage พวกเขาจะต้องทอยลูกเต๋า 3d6 และเลือกผลลัพธ์ 2 ลูกที่แย่ที่สุดมาใช้","cat":"ศัพท์กฎ (Terminology)"},"AP":{"th":"Action Point","text":"คือ \"ค่าพลังงาน\" ที่ตัวละครสามารถใช้ได้ในแต่ละเทิร์นของการต่อสู้เพื่อกระทำการต่างๆ เช่น การโจมตี, การใช้สกิล, หรือการเคลื่อนที่เพิ่มเติม โดยปกติแล้วตัวละครจะได้รับ 1 AP ในตอนเริ่มต้นเทิร์น","cat":"ศัพท์กฎ (Terminology)"},"CV":{"th":"Combat Value","text":"คือผลรวมของลูกเต๋า 2 ลูกที่ผู้เล่นเลือกจากการทอย Attack Roll ซึ่งจะถูกนำไปเปรียบเทียบกับค่าป้องกัน (Defense) ของเป้าหมายเพื่อตัดสินว่าการโจมตีนั้นโดนหรือไม่","cat":"ศัพท์กฎ (Terminology)"},"Perfect Strike":{"th":"","text":"คือการกระทำที่เกิดขึ้นเมื่อผู้เล่นทอยลูกเต๋า 2 ลูกที่ใช้ในการโจมตีได้เลขหน้าเต๋าเหมือนกัน (Double) เช่น คุณทอยได้ 6 กับ 6 หรือ 1 กับ 1, ซึ่งทำให้เพิ่มความเสียหายจาก Might หรือ Sight เป็นสองเท่า ขึ้นอยู่กับว่าการโจมตีครั้งนั้นเป็นการโจมตีประเภทไหน","cat":"ศัพท์กฎ (Terminology)"},"Perfect Parry / Perfect Evade":{"th":"","text":"คือการกระทำที่เกิดขึ้นเมื่อผู้เล่นทอยลูกเต๋า 2 ลูกที่ใช้ในการป้องกัน (Defense) ได้จำนวนเลขเหมือนกันกับผู้ที่โจมตี (ไม่รวม CV ที่ถูกนำมารวมทีหลัง) ซึ่งจะทำให้ได้รับ 1 AP คืนมาทันที เช่นฝ่ายโจมตีทอย Attack Roll ได้ 6+3 เท่ากับ 9 แล้วคุณทอยได้ 4+5 ซึ่งก็เท่ากับ 9 เช่นกัน","cat":"ศัพท์กฎ (Terminology)"},"Perfect Parry":{"th":"","text":"คือการกระทำที่เกิดขึ้นเมื่อผู้เล่นทอยลูกเต๋า 2 ลูกที่ใช้ในการป้องกัน (Defense) ได้จำนวนเลขเหมือนกันกับผู้ที่โจมตี (ไม่รวม CV ที่ถูกนำมารวมทีหลัง) ซึ่งจะทำให้ได้รับ 1 AP คืนมาทันที เช่นฝ่ายโจมตีทอย Attack Roll ได้ 6+3 เท่ากับ 9 แล้วคุณทอยได้ 4+5 ซึ่งก็เท่ากับ 9 เช่นกัน","cat":"ศัพท์กฎ (Terminology)"},"Perfect Evade":{"th":"","text":"คือการกระทำที่เกิดขึ้นเมื่อผู้เล่นทอยลูกเต๋า 2 ลูกที่ใช้ในการป้องกัน (Defense) ได้จำนวนเลขเหมือนกันกับผู้ที่โจมตี (ไม่รวม CV ที่ถูกนำมารวมทีหลัง) ซึ่งจะทำให้ได้รับ 1 AP คืนมาทันที เช่นฝ่ายโจมตีทอย Attack Roll ได้ 6+3 เท่ากับ 9 แล้วคุณทอยได้ 4+5 ซึ่งก็เท่ากับ 9 เช่นกัน","cat":"ศัพท์กฎ (Terminology)"},"Proficiency":{"th":"","text":"คือความสามารถพิเศษที่ตัวละครจะได้รับเมื่อระดับความรู้ (Knowledge Level) ในทักษะใดทักษะหนึ่งเพิ่มขึ้น โดย Proficiency แต่ละระดับจะมอบความสามารถใหม่หรือเพิ่มประสิทธิภาพของทักษะความรู้นั้นๆ (เช่น Proficiency ของ Medical ทำให้ใช้ Action ปฐมพยาบาลได้เร็วขึ้น ทำให้สามารถพยายามรักษาคนได้ขณะต่อสู้)","cat":"ศัพท์กฎ (Terminology)"},"Hit Location":{"th":"","text":"คือการบาดเจ็บที่อิงตามตำแหน่งร่างกายที่ถูกโจมตีจากการทอย Attack Roll โดยการอิงจุดการโจมตี 6 ส่วนดังที่ปรากฎจากลูกเต๋าดังนี้ [2,3,11,12 = หัว], [4,9 ทำการทอย 1d6 หากออก 1-3 = ขาขวา, 4-6 = แขนขวา], [5,10 ทำการทอย 1d6 หากออก 1-3 = ขาซ้าย, 4-6 = แขนซ้าย] , [6,7,8 = ลำตัว] หาก Toughness ของตำแหน่งร่างกายเหลือ 0 ตัวละครจะใช้อวัยวะนั้นไม่ได้ชั่วคราวจนกว่า Toughness จะได้รับการรักษาหรือรอให้ค่อย ๆ ฟื้นกลับมาจากการพักยาว (Long Rest) ครั้งละ 1 Toughness (เลือกว่าจะให้ส่วนไหนฟื้นฟู), หาก Toughness ติดลบจนถึงจำนวนเลข Toughness ด้านบวกที่ตัวละครมี ตัวละครจะไม่สามารถใช้อวัยวะนั้นได้อีก (เช่นตัวละครมี 3 Toug","cat":"ศัพท์กฎ (Terminology)"},"Reaction":{"th":"","text":"คือ การกระทำที่ตัวละครสามารถทำได้นอกเทิร์นของตนเอง เพื่อตอบสนองต่อเหตุการณ์หรือการกระทำของตัวละครอื่น ซึ่งทำได้ไม่จำกัดแต่ GM อาจสร้างความท้าทายด้วยการสร้างสถานการณ์ที่ทำให้การใช้ Reaction มากเกินไปเสียเปรียบได้","cat":"ศัพท์กฎ (Terminology)"},"Critical Success":{"th":"ทอยสำเร็จอย่างสมบูรณ์แบบ","text":"คือการทอยลูกเต๋าในการ Check หรือ Saving Throw แล้วทอยได้หรือเลือก 6 กับ 6 มาเป็นผลลัพธ์ จะทำให้การทอยครั้งนั้นนับว่าผ่านทันที แม้จะต่ำกว่าเกณฑ์ความยาก (DC) ที่ GM วางไว้ก็ตาม","cat":"ศัพท์กฎ (Terminology)"},"Critical Failed":{"th":"ล้มเหลวอย่างร้ายแรง","text":"คือการทอยลูกเต๋าในการ Check หรือ Saving Throw แล้วทอยได้หรือเลือก 1 กับ 1 มาเป็นผลลัพธ์ จะทำให้การทอยครั้งนั้นนับว่าล้มเหลวทันที","cat":"ศัพท์กฎ (Terminology)"},"Critical Failure":{"th":"ล้มเหลวอย่างร้ายแรง","text":"คือการทอยลูกเต๋าในการ Check หรือ Saving Throw แล้วทอยได้หรือเลือก 1 กับ 1 มาเป็นผลลัพธ์ จะทำให้การทอยครั้งนั้นนับว่าล้มเหลวทันที","cat":"ศัพท์กฎ (Terminology)"},"STR":{"th":"พละกำลัง","text":"ค่าพลังหลัก ใช้ต่อสู้ประชิด พังประตู ยก แบก ทุ่ม และคำนวณ Might กับ HP","cat":"ศัพท์ระบบ"},"AGI":{"th":"ความคล่องแคล่ว","text":"ค่าพลังหลัก ใช้หลบหลีก (Evade) ซ่อนตัว อาวุธระยะไกล งานละเอียดของมือ และคำนวณ Reflex","cat":"ศัพท์ระบบ"},"VIT":{"th":"ความแข็งแรง","text":"ค่าพลังหลัก ใช้คำนวณ HP และ Toughness ต้านพิษ โรค ความเหนื่อยล้า","cat":"ศัพท์ระบบ"},"PER":{"th":"การรับรู้","text":"ค่าพลังหลัก ใช้สังเกต ค้นหา ปฏิกิริยา ลำดับเทิร์น (Initiative) และ Sight","cat":"ศัพท์ระบบ"},"INF":{"th":"อิทธิพล/บารมี","text":"ค่าพลังหลัก ใช้โน้มน้าว ข่มขู่ หลอกลวง สั่งการ และคำนวณ MP กับ Sanity","cat":"ศัพท์ระบบ"},"INT":{"th":"ปัญญา","text":"ค่าพลังหลัก ใช้ความรู้ ความจำ เทคโนโลยี เหตุผล เวทมนตร์ และคำนวณ MP","cat":"ศัพท์ระบบ"},"Mod":{"th":"ค่าดัดแปลง","text":"ตัวเลขที่เอาไปบวกกับการทอย = (ค่าพลัง ÷ 2) − 5 ปัดลง อยู่ระหว่าง −5 ถึง +5 ค่าพลัง 10 = Mod 0, 12 = +1, 14 = +2","cat":"ศัพท์ระบบ"},"Raw Stats":{"th":"ค่าพลังดิบ","text":"ตัวเลขค่าพลังก่อนแปลงเป็น Mod เริ่มจากวงศา บวกพื้นหลังและแต้ม Extra","cat":"ศัพท์ระบบ"},"Extra":{"th":"แต้ม Extra","text":"แต้มพิเศษจากวงศา (10 หรือ 14) ใช้เพิ่ม Raw Stats ตอนสร้างตัวละคร ค่าคู่เท่านั้นที่ขยับ Mod","cat":"ศัพท์ระบบ"},"HP":{"th":"พลังชีวิต","text":"Max HP = 10 + VIT Mod + STR Mod ลดเหลือ 0 เข้าสู่ขอบเหวแห่งความตาย","cat":"ศัพท์ระบบ"},"MP":{"th":"มานา","text":"Max MP = 10 + INF Mod + INT Mod ใช้จ่ายค่าร่ายเวทและสกิลบางอย่าง","cat":"ศัพท์ระบบ"},"Sanity":{"th":"สติสัมปชัญญะ","text":"Max Sanity = 5 + INF Mod เป็นแหล่งพลังที่ถูกดึงเมื่อเผชิญความบิดเบี้ยว ฝืนใจตัวเอง หรือจ่ายค่าสกิล","cat":"ศัพท์ระบบ"},"Toughness":{"th":"ความทนทาน","text":"((Raw VIT + Raw STR) ÷ 10) + 1 ปัดลง แยกตามอวัยวะ 6 ส่วน หมด = ใช้อวัยวะนั้นไม่ได้และทอยตารางบาดแผลฉกรรจ์ ติดลบถึงค่าเต็ม = เสียอวัยวะ","cat":"ศัพท์ระบบ"},"Speed":{"th":"ความเร็ว","text":"ความเร็วพื้นฐานตามวงศา Dash คือเคลื่อนที่ปกติ Run คือวิ่งเต็มสูบ (Speed + AGI Mod ต่อวินาที)","cat":"ศัพท์ระบบ"},"Capacity":{"th":"ขีดจำกัดการแบก","text":"น้ำหนักที่แบกไหวเป็นกิโลกรัม = STR × 3 (Medium), × 4 (Large), × 5 (Huge)","cat":"ศัพท์ระบบ"},"Passive PER":{"th":"การรับรู้แบบไม่ต้องทอย","text":"= 7 + PER Mod ใช้เป็น DC ให้ผู้อื่นทอยเมื่อพยายามซ่อนบางอย่างจากคุณ","cat":"ศัพท์ระบบ"},"Initiative":{"th":"ลำดับเทิร์น","text":"ทอย 2d6 + Initiative Mod ตอนเริ่มฉากต่อสู้ เรียงจากมากไปน้อย (เสนอ: Initiative Mod = PER Mod)","cat":"ศัพท์ระบบ"},"Reflex":{"th":"ปฏิกิริยา","text":"ค่าที่ใช้หลบหลีก (Evade) เสนอ = (AGI Mod ÷ 2) + 1 ปัดลง","cat":"ศัพท์ระบบ"},"Might":{"th":"พลังโจมตี","text":"ความเสียหายเพิ่มของอาวุธประชิดและมือเปล่า เสนอ = (STR Mod ÷ 2) + 1 ปัดลง Perfect Strike คูณ 2","cat":"ศัพท์ระบบ"},"Sight":{"th":"ความแม่นยำ","text":"ค่าที่ใช้กับ Focus (Precise) และการโจมตีระยะไกล เสนอ = (PER Mod ÷ 2) + 1 ปัดลง","cat":"ศัพท์ระบบ"},"Parry Dice":{"th":"เต๋าปัดป้อง","text":"จำนวนเต๋าเพิ่มตอน Parry เริ่มที่ 0 อุปกรณ์หลายชิ้นให้ +1","cat":"ศัพท์ระบบ"},"Combat Dice":{"th":"เต๋าต่อสู้","text":"เต๋าที่ใช้ทอยโจมตี ปกติ 2d6 เลือก 2 ลูกรวมเป็น Combat Value","cat":"ศัพท์ระบบ"},"Check":{"th":"การทอยตรวจสอบ","text":"ทอย 2d6 + Stat Mod + Personality (ถ้าเข้าบริบท) ไม่มี DC: 10+ สำเร็จเต็ม, 7-9 สำเร็จแต่มีราคา, 6 ลงไปล้มเหลว","cat":"ศัพท์ระบบ"},"DC":{"th":"ระดับความยาก","text":"Difficulty Class ตัวเลขที่ต้องทอยให้ถึง ง่าย 5 ปานกลาง 7 ยาก 10 ยากมาก 12 เกือบเป็นไปไม่ได้ 14+","cat":"ศัพท์ระบบ"},"Clash":{"th":"การทอยแข่ง","text":"ทั้งสองฝ่ายทอย Check แล้วเทียบกัน ฝ่ายสูงกว่าชนะ เท่ากันผู้ท้าทายชนะ","cat":"ศัพท์ระบบ"},"Luck Saving Throw":{"th":"ทอยวัดโชค","text":"ทอย 2d6 เปล่า ๆ ไม่บวกอะไร ผ่านที่ 8 ขึ้นไป ใช้เมื่อ GM ต้องการวัดโชคของฉาก","cat":"ศัพท์ระบบ"},"Full Success":{"th":"สำเร็จสมบูรณ์","text":"ผลรวม 10 ขึ้นไป (เมื่อไม่มี DC) ทำสำเร็จไร้ผลกระทบ","cat":"ศัพท์ระบบ"},"Partial Success":{"th":"สำเร็จแต่มีราคา","text":"ผลรวม 7-9 สำเร็จแต่ต้องแลกด้วยบางอย่าง เช่น เสีย HP อุปกรณ์พัง หรือดึงดูดความสนใจ","cat":"ศัพท์ระบบ"},"Failure":{"th":"ล้มเหลว","text":"ผลรวม 6 หรือต่ำกว่า GM กำหนดผลลัพธ์ที่เลวร้ายแต่ยังดำเนินเรื่องต่อได้","cat":"ศัพท์ระบบ"},"Personality":{"th":"บุคลิกภาพ","text":"6 คู่ขั้วตรงข้าม ฝั่งที่เลือกเป็นบวก อีกฝั่งติดลบเท่ากัน เอามาบวกการทอยเมื่อการกระทำสอดคล้องกับบุคลิก (Cross-Stats)","cat":"ศัพท์ระบบ"},"Cross-Stats":{"th":"การทอยผสมบุคลิก","text":"การบวกค่าบุคลิกภาพเข้ากับ Stat Check เมื่อการกระทำสอดคล้อง เช่น STR + Confront พังประตูเพื่อพุ่งเข้าปะทะ","cat":"ศัพท์ระบบ"},"Logic":{"th":"ตรรกะ","text":"ขั้วบุคลิก ใช้บวกเมื่อวิเคราะห์ วางแผน ใช้เครื่องมือวิทยาศาสตร์ ตรงข้ามกับ Instinct","cat":"ศัพท์ระบบ"},"Instinct":{"th":"สัญชาตญาณ","text":"ขั้วบุคลิก ใช้บวกเมื่อเอาตัวรอดตามสัญชาตญาณ ตอบสนองฉับพลัน ตรงข้ามกับ Logic","cat":"ศัพท์ระบบ"},"Confront":{"th":"เผชิญหน้า","text":"ขั้วบุคลิก ใช้บวกเมื่อพุ่งเข้าชนปัญหา ต่อสู้ ท้าทายตรง ๆ ตรงข้ามกับ Avoid","cat":"ศัพท์ระบบ"},"Avoid":{"th":"หลบเลี่ยง","text":"ขั้วบุคลิก ใช้บวกเมื่อวิ่งหนี หลีกเลี่ยงการปะทะ ตรงข้ามกับ Confront","cat":"ศัพท์ระบบ"},"Brave":{"th":"กล้าหาญ","text":"ขั้วบุคลิก ใช้บวกเมื่อสำรวจ ค้นหาความจริง สืบสวนสิ่งลี้ลับโดยไม่กลัว ตรงข้ามกับ Cautious","cat":"ศัพท์ระบบ"},"Cautious":{"th":"ระแวดระวัง","text":"ขั้วบุคลิก (ไฟล์แกนเรียก Paranoia) ใช้บวกเมื่อระวังตัว จับผิดคำโกหก ป้องกันการซุ่มโจมตี ตรงข้ามกับ Brave","cat":"ศัพท์ระบบ"},"Paranoia":{"th":"ระแวดระวัง","text":"ชื่อเดิมของขั้ว Cautious ในไฟล์แกน ใช้บวกเมื่อระวังตัว จับผิดคำโกหก ป้องกันการซุ่มโจมตี","cat":"ศัพท์ระบบ"},"Others":{"th":"เห็นแก่ส่วนรวม","text":"ขั้วบุคลิก ใช้บวกเมื่อปกป้องเพื่อน ช่วยเหลือผู้คน รับการโจมตีแทน ตรงข้ามกับ Self","cat":"ศัพท์ระบบ"},"Self":{"th":"รักตัวเอง","text":"ขั้วบุคลิก ใช้บวกเมื่อเอาตัวรอดคนเดียว ทิ้งคนอื่น ตรงข้ามกับ Others","cat":"ศัพท์ระบบ"},"Compassionate":{"th":"เห็นอกเห็นใจ","text":"ขั้วบุคลิก ใช้บวกเมื่อเยียวยาจิตใจ โน้มน้าวด้วยความเห็นใจ ตรงข้ามกับ Ruthless","cat":"ศัพท์ระบบ"},"Ruthless":{"th":"เลือดเย็น","text":"ขั้วบุคลิก ใช้บวกเมื่อตัดสินใจเด็ดขาด สังหาร ทำลายโดยไม่ลังเล ตรงข้ามกับ Compassionate","cat":"ศัพท์ระบบ"},"Order":{"th":"เจ้าระเบียบ","text":"ขั้วบุคลิก ใช้บวกเมื่อทำตามกฎ วินัย อ้างอำนาจ จัดระบบ ตรงข้ามกับ Chaos","cat":"ศัพท์ระบบ"},"Chaos":{"th":"ไร้ระเบียบ","text":"ขั้วบุคลิก ใช้บวกเมื่อแหกกฎ สร้างความวุ่นวาย คาดเดาไม่ได้ ตรงข้ามกับ Order","cat":"ศัพท์ระบบ"},"Kin":{"th":"วงศา","text":"เผ่าพันธุ์หรือกลุ่มวัฒนธรรมของตัวละคร กำหนด Raw Stats, Trait, Hindrance, แต้ม Extra และ Starter Skill","cat":"ศัพท์ระบบ"},"Trait":{"th":"ลักษณะติดตัว","text":"ความสามารถพิเศษถาวรที่ได้จากวงศา พื้นหลัง หรือ Proficiency","cat":"ศัพท์ระบบ"},"Hindrance":{"th":"ข้อเสีย","text":"จุดอ่อนหรือข้อจำกัดของวงศาที่ติดตัวตัวละครไปตลอด","cat":"ศัพท์ระบบ"},"Benefit":{"th":"ผลประโยชน์","text":"ของแถมของวงศาที่ให้เลือกตอนสร้างตัวละคร เช่น เพิ่มระดับความรู้ หรือยืม Trait จากวงศาอื่น","cat":"ศัพท์ระบบ"},"Starter Skill":{"th":"ทักษะเริ่มต้น","text":"ทักษะเฉพาะวงศาที่ได้ฟรีตอนสร้างตัวละคร บางอย่างมีเงื่อนไขค่าพลัง เช่น INT 15 ขึ้นไป","cat":"ศัพท์ระบบ"},"Childhood":{"th":"พื้นหลังวัยเด็ก","text":"เลือก 1 ใบ ให้แต้มสถานะ (มนุษย์ 3 แต้ม วงศาอื่น 2 แต้ม) และ Trait พิเศษ","cat":"ศัพท์ระบบ"},"Adulthood":{"th":"พื้นหลังวัยผู้ใหญ่","text":"เลือก 1 ใบ ให้แต้มสถานะและ Trait พิเศษ","cat":"ศัพท์ระบบ"},"Talent":{"th":"พรสวรรค์","text":"เลือก 1 อย่างตามค่าพลังที่ Mod สูงสุด (หรือ Educated) ให้ชุดสกิล ความรู้ และ Passive ตามสาย","cat":"ศัพท์ระบบ"},"Educated":{"th":"ผู้มีการศึกษา","text":"Talent ทางเลือกแทนสายค่าพลัง: Level Up 1 Knowledge (ไม่ถึงระดับ 2) และเลือก Sorceries Novice, Martial หรือ Survival 2 อย่าง","cat":"ศัพท์ระบบ"},"Knowledge":{"th":"ความรู้","text":"13 สาขา ระดับ 0-3 แต่ละระดับให้เลือก Proficiency 1 อย่าง Knowledge Check = 2d6 + จำนวน Proficiency","cat":"ศัพท์ระบบ"},"Level Up":{"th":"เพิ่มระดับ","text":"เพิ่มระดับความรู้ 1 ขั้น (0→1→2→3) พร้อมเลือก Proficiency ของระดับนั้น","cat":"ศัพท์ระบบ"},"Kins Unique":{"th":"ทักษะเฉพาะเผ่า","text":"ทักษะที่เลือกได้เฉพาะวงศาของตัวเอง (มนุษย์ทุกสายเลือกทักษะมนุษย์ทั่วไปได้ด้วย)","cat":"ศัพท์ระบบ"},"Qi":{"th":"ปราณ","text":"ศาสตร์พลังชีวิตภายใน สกิลสาย Martial ที่เสริมร่างกายและปล่อยกระบวนท่าพิเศษ","cat":"ศัพท์ระบบ"},"Stance":{"th":"กระบวนท่า","text":"ท่ายืนที่เปิดด้วย Swift Action ให้ความสามารถติดตัวชั่วขณะที่ยังอยู่ในท่านั้น","cat":"ศัพท์ระบบ"},"Trick":{"th":"ทักษะหลอกล่อ","text":"สกิลใช้เล่ห์เหลี่ยมสร้างความได้เปรียบ เช่น สาดทราย แสร้งอ่อนแอ","cat":"ศัพท์ระบบ"},"Survival":{"th":"ทักษะเอาตัวรอด","text":"สกิลช่วยเอาตัวรอดในสังคม ในป่า และเสริมความทรหด","cat":"ศัพท์ระบบ"},"Martial":{"th":"ทักษะนักสู้","text":"กลุ่มสกิลต่อสู้: มือเปล่า/ประชิด ระยะไกล กลยุทธ์ พิเศษ Qi และ Stance","cat":"ศัพท์ระบบ"},"Sorcery":{"th":"ศาสตร์เวท","text":"เวทมนตร์ 9 สำนัก แบ่งระดับ Novice/Expert/Master จ่าย MP หรือ Sanity และต้องมี Components (U/G/F)","cat":"ศัพท์ระบบ"},"Sorceries":{"th":"ศาสตร์เวท","text":"เวทมนตร์ 9 สำนัก แบ่งระดับ Novice/Expert/Master จ่าย MP หรือ Sanity และต้องมี Components (U/G/F)","cat":"ศัพท์ระบบ"},"Novice":{"th":"ระดับต้น","text":"ระดับของเวทที่เรียนได้ตั้งแต่สร้างตัวละคร","cat":"ศัพท์ระบบ"},"Expert":{"th":"ระดับชำนาญ","text":"ระดับกลางของเวท ต้องมีระดับความรู้สูงขึ้นหรือครูผู้สอน","cat":"ศัพท์ระบบ"},"Master":{"th":"ระดับปรมาจารย์","text":"ระดับสูงสุดของเวท ต้องมีปรมาจารย์หรือเนื้อเรื่องเปิดทาง","cat":"ศัพท์ระบบ"},"Components":{"th":"วิธีการร่าย","text":"สิ่งที่ต้องทำได้ขณะร่ายเวท: U = เปล่งเสียง, G = ท่วงท่ามือ, F = จิตเพ่ง (มองเห็นเป้าหมาย ถูกขัดต้องทอย Confront ST DC 10)","cat":"ศัพท์ระบบ"},"IP":{"th":"แต้มพัฒนา","text":"Insight Point ได้จาก Milestone (จบเซสชั่น +1, Minor +2, Major +3, Epic +4) ใช้ซื้อสกิล เพิ่ม Mod หรือเพิ่มระดับความรู้","cat":"ศัพท์ระบบ"},"Insight Point":{"th":"แต้มพัฒนา","text":"ได้จาก Milestone (จบเซสชั่น +1, Minor +2, Major +3, Epic +4) ใช้ซื้อสกิล เพิ่ม Mod หรือเพิ่มระดับความรู้","cat":"ศัพท์ระบบ"},"Milestone":{"th":"เหตุการณ์สำคัญ","text":"จุดในเรื่องที่ให้ IP: Minor (เป้าหมายย่อย) Major (ภารกิจสำคัญ) Epic (เป้าหมายหลักของเรื่อง)","cat":"ศัพท์ระบบ"},"Starter Set":{"th":"ชุดเริ่มต้น","text":"ชุดไอเทมอาชีพ 1 ใน 17 ชุด มูลค่าราว 50 เกรฟ ทุกคนได้ชุดยังชีพ 25 เกรฟและเงิน 15 เกรฟเท่ากัน","cat":"ศัพท์ระบบ"},"เกรฟ":{"th":"หน่วยเงิน","text":"สกุลเงินของเกรทแลนด์ ค่าห้องพักรวมราว 2 เกรฟ อาหารมื้อละ 1-2 เกรฟ","cat":"ศัพท์ระบบ"},"Swift Action":{"th":"แอ็กชันเร็ว","text":"1 ต่อเทิร์น ใช้ Maneuver, Focus, สกิลบางอย่าง หรือสื่อสาร","cat":"ศัพท์ระบบ"},"Basic Action":{"th":"แอ็กชันหลัก","text":"1 ต่อเทิร์น ใช้โจมตี ใช้ไอเทม หรือสกิลหลัก","cat":"ศัพท์ระบบ"},"Cast Action":{"th":"แอ็กชันร่าย","text":"1 ต่อเทิร์น ใช้ร่ายเวทหรือสกิลประเภท Cast","cat":"ศัพท์ระบบ"},"Cast":{"th":"ร่าย","text":"ประเภทสกิลที่ใช้ Cast Action ในเทิร์น","cat":"ศัพท์ระบบ"},"Free Action":{"th":"แอ็กชันฟรี","text":"ทำได้โดยไม่เสีย AP ตามเงื่อนไขของสกิล","cat":"ศัพท์ระบบ"},"Passive":{"th":"ติดตัวตลอด","text":"ความสามารถที่ทำงานเองโดยไม่ต้องใช้ Action","cat":"ศัพท์ระบบ"},"Maneuver":{"th":"เคลื่อนที่","text":"ใช้ Swift Action เปลี่ยนเขต (Zone) หรือหาที่กำบัง ใกล้เคียง→ไกล ต้องเพิ่ม 1 AP","cat":"ศัพท์ระบบ"},"Focus":{"th":"เพ่ง","text":"Swift Action ระบุเป้าหมายให้ชัด (Precise) ได้บวก CV ตาม Sight ในการโจมตีครั้งถัดไป","cat":"ศัพท์ระบบ"},"Overwatch":{"th":"ตั้งรับเฝ้าระวัง","text":"ประกาศเฝ้าเขตปัจจุบัน ใครเข้ามาจะถูกโจมตีทันที","cat":"ศัพท์ระบบ"},"Parry":{"th":"ปัดป้อง","text":"การป้องกันด้วยอาวุธ ทอย Combat Dice เทียบกับผู้โจมตี ไม่ประกาศป้องกัน = โดนเต็ม","cat":"ศัพท์ระบบ"},"Evade":{"th":"หลบหลีก","text":"การป้องกันด้วยการหลบ ใช้ Reflex ไม่ประกาศป้องกัน = โดนเต็ม","cat":"ศัพท์ระบบ"},"Defend":{"th":"ป้องกัน","text":"การเลือก Parry หรือ Evade เมื่อถูกโจมตี","cat":"ศัพท์ระบบ"},"Grab":{"th":"จับ","text":"การจับล็อกเป้าหมาย ทำให้ติดสภาวะ Grappled","cat":"ศัพท์ระบบ"},"Melee Attack":{"th":"โจมตีประชิด","text":"โจมตีได้เฉพาะเป้าหมายในเขตปะทะเดียวกัน ใช้ Combat Dice และ Might","cat":"ศัพท์ระบบ"},"Range Attack":{"th":"โจมตีระยะไกล","text":"ยิงได้ทุกเขต เขตไกลหรือมีที่กำบังติด Disadvantage ใช้ Sight","cat":"ศัพท์ระบบ"},"Unarmed Strike":{"th":"โจมตีมือเปล่า","text":"การโจมตีประชิดโดยไม่ใช้อาวุธ","cat":"ศัพท์ระบบ"},"Attack Roll":{"th":"ทอยโจมตี","text":"ทอย Combat Dice เลือก 2 ลูกเป็น CV เลขเหมือนกัน = Perfect Strike ผลรวมกำหนด Hit Location","cat":"ศัพท์ระบบ"},"Engagement Zone":{"th":"เขตปะทะ","text":"ระยะ 1-3 เมตร ทุกคนในเขตโจมตีประชิดกันได้","cat":"ศัพท์ระบบ"},"Nearby Zone":{"th":"เขตใกล้เคียง","text":"ระยะ 4-25 เมตร วิ่งเข้าร่วมวงได้ทันที ยิงใส่เขตปะทะได้","cat":"ศัพท์ระบบ"},"Far Zone":{"th":"เขตไกล","text":"ระยะ 26-100+ เมตร ยิงยากขึ้น เคลื่อนที่ไปถึงต้องใช้ Swift + 1 AP","cat":"ศัพท์ระบบ"},"Zone":{"th":"เขต","text":"ระยะแบบไม่ใช้แผนที่: เขตปะทะ ใกล้เคียง ไกล และนอกการต่อสู้","cat":"ศัพท์ระบบ"},"Short Rest":{"th":"พักสั้น","text":"การพักช่วงสั้นระหว่างผจญภัย ฟื้นทรัพยากรบางส่วนและรีเซ็ตความสามารถที่ระบุ","cat":"ศัพท์ระบบ"},"Long Rest":{"th":"พักยาว","text":"การพักเต็มคืน ฟื้น HP/MP และ Toughness 1 จุดในส่วนที่เลือก","cat":"ศัพท์ระบบ"},"Downtime":{"th":"ช่วงพัก","text":"ช่วงเวลาระหว่างการผจญภัย ใช้เรียนรู้ ฝึกฝน ทำอาหาร หรือใช้ IP","cat":"ศัพท์ระบบ"},"Fate Clock":{"th":"นาฬิกาชะตากรรม","text":"วงกลมแบ่งช่องที่ GM เติมทีละช่องเพื่อแสดงความคืบหน้าหรือภัยที่คืบคลานเข้ามา","cat":"ศัพท์ระบบ"},"Corruption":{"th":"มลภาวะแห่งจิตใจ","text":"ระดับความเสื่อมของจิตใจจากการสัมผัสสิ่งบิดเบี้ยว สะสมเป็นขั้น","cat":"ศัพท์ "ทนทานที่สุดในทีม รับความเสียหายแทนเพื่อน HP หรือ Toughness สูง","cat":"ศัพท์ระบบ"},"Fighter":{"th":"ไฟท์เตอร์","text":"นักสู้สมดุลทั้งโจมตีและทนทาน ปรับบทบาทได้หลากหลาย","cat":"ศัพท์ระบบ"},"Damage Dealer":{"th":"ดาเมจดีลเลอร์","text":"สร้างความเสียหายสม่ำเสมอ ครั้งเดียวรุนแรงหรือต่อเนื่องหลายครั้ง","cat":"ศัพท์ระบบ"},"Striker":{"th":"สไตรเกอร์","text":"พุ่งเข้าหาเป้าหมายสำคัญ (นักเวท พลธนู) แล้วกำจัดให้เร็วที่สุด","cat":"ศัพท์ระบบ"},"Skirmisher":{"th":"สเคอร์มิชเชอร์","text":"คล่องตัว เข้าโจมตีแล้วถอยเร็ว ตีจากด้านข้างหรือด้านหลัง","cat":"ศัพท์ระบบ"},"Rogue":{"th":"โร้ค","text":"ลอบเร้น ซุ่มโจมตี ใช้เล่ห์เหลี่ยม โจมตีแรกจากที่ซ่อนรุนแรง","cat":"ศัพท์ระบบ"},"Support":{"th":"ซัพพอร์ต","text":"รักษา มอบบัฟ ลบล้างดีบัฟให้เพื่อนร่วมทีม","cat":"ศัพท์ระบบ"},"Controller":{"th":"คอนโทรลเลอร์","text":"ควบคุมสนามรบ ทำให้ช้า ติดสถานะ หรือสร้างพื้นที่อันตราย","cat":"ศัพท์ระบบ"},"Specialist":{"th":"สเปเชียลลิสต์","text":"เชี่ยวชาญศาสตร์เฉพาะ เช่น Crafting Alchemy Connection พาทีมผ่านอุปสรรคที่ไม่ใช่การต่อสู้","cat":"ศัพท์ระบบ"},"Utility":{"th":"ยูทิลิตี้","text":"ทำได้หลายอย่าง ยืดหยุ่น แก้ปัญหาเฉพาะหน้า แต่ไม่เด่นสักด้าน","cat":"ศัพท์ระบบ"},"VIT Saving Throw":{"th":"ทอยป้องกันทางกาย","text":"ทอยป้องกันด้วย VIT Mod ต้านพิษ โรค ความเหนื่อยล้า และผลทางกาย (เดิมเรียก VIT Saving Throw)","cat":"ศัพท์ระบบ"},"PER Saving Throw":{"th":"ทอยป้องกันทางใจ","text":"ทอยป้องกันด้วย PER Mod ต้านความกลัว มายา และผลทางจิต ใช้เป็นค่าตั้งรับให้คนอื่นทอยแข่งได้ (เดิมเรียก Will)","cat":"ศัพท์ระบบ"}},"kins":[{"id":"lunaryn","name":"Lunaryn / Blood Moon","intro":["ลูนาร์ริน หรือที่รู้จักกันในนาม \"จันทร์โลหิต\" คือกลุ่มชาติพันธุ์มนุษย์ที่ทรงอิทธิพลและแพร่หลายที่สุดในยุคสมัยใหม่ พวกเขามีต้นกำเนิดจากลัทธิบูชาเลือดในอดีต และได้เติบโตจนกลายเป็นศูนย์กลางแห่งอารยธรรม การค้า และวิทยาการ ด้วยพันธุกรรมที่สามารถปรับตัวและดูดซับคุณสมบัติของเผ่าพันธุ์อื่นได้ ทําให้ลูนาร์รินมีความหลากหลายสูงทั้งในรูปลักษณ์และแนวคิด สังคมของพวกเขาให้ความสำคัญกับระเบียบปฏิบัติ ความก้าวหน้า และการปกป้องสมดุลของธรรมชาติและเผ่าพันธุ์ที่อ advantage ในการทอย INF Check ทั้งหมดจนกว่าการต่อสู้จะจบลง"},{"code":"CS2","name":"ผู้เกิดมาพร้อมแฝด","nameEn":"Twinborn","stats":{"INT":2,"VIT":1},"text":"Trait (Shared Soul): ตัวละครคุณจะมีอยู่สองร่างกายและบังคับได้เหมือนเป็นคน เดียวกัน (แต่ไม่สามารถเดินทางแยกจากกันโดยเจตนาได้) Shared AP Pool: แฝดทั้งสองร่างมี HP แยกกัน แต่ แชร์ Action Point ร่วมกัน ใน 1 เทิร์น ผู้เล่นยังคงมีแค่ 1 Swift, 1 Basic, 1 Cast ผู้เล่นต้องเลือกว่าจะให้ร่าง A เป็นคนตี (ใช้ Basic) และให้ร่าง B เป็นคนวิ่ง (ใช้ Swift) Spatial Advantage: คุณสามารถยืนคุมพื้นที่ 2 จุด (Zone) ได้พร้อมกัน ทำให้สร้างตำแหน่ง Flank หรือป้องกันเพื่อนได้กว้างขึ้น Fatal Connection: เนื่องจากเป็นวิญญาณดวงเดียวกัน ทำให้ตัวละครนั้นใช้ MP และ Sanity ร่วมกัน หากร่างใดร่างหนึ่งได้รับสภาวะผิดปกติทางจิตใจ (เช่น Sanity Damage, Frightened, Charmed) ร่างที่สองจะต้องได้รับผลกระทบนั้นโดยอัตโนมัติ"}],"adulthood":[{"code":"A1","name":"ทหารผ่านศึกแห่งจักรวรรดิ์","nameEn":"Legionary Vateran","stats":{"STR":2,"VIT":1},"text":"Trait (Shield Wall): 1 ครั้งต่อการพักสั้น เมื่อคุณต่อสู้ในเขตปะทะ (Engagement Zone) เดียวกันกับพันธมิตรอย่างน้อย 1 คน คุณจะได้รับ Advantage ในการทอย Defend (Parry/Evade)"},{"code":"A2","name":"พ่อค้าสมาพันธ์","nameEn":"Guild Merchant","stats":{"INF":2,"INT":1},"text":"Trait (Supply and Demand): เมื่อคุณอยู่ในเมืองหรือชุมชนใดๆ คุณจะรู้เสมอว่าจะหาตลาดมืดหรือพ่อค้าที่รับซื้อขายสินค้าผิดกฎหมายได้ที่ไหนและอย่างไร"},{"code":"A3","name":"นักสำรวจคาเรียน","nameEn":"Carrion Delver","stats":{"PER":2,"VIT":1},"text":"Trait (Carrion Sense): คุณมีสัมผัสพิเศษต่อสภาพแวดล้อมที่ผิดธรรมชาติ คุณได้รับ Advantage ในการทอย PER Check เพื่อค้นหาอันตรายจากสภาพแวดล้อม (Environmental Hazards) และกับดัก (Traps) ภายในดันเจี้ยนหรือซากปรักหักพัง"},{"code":"A4","name":"นักไต่สวนแห่งศาสนจักร","nameEn":"Crimson Inquisitor","stats":{"INF":2,"PER":1},"text":"Trait (Purity Scrutiny): 1 ครั้งต่อการสนทนา คุณสามารถใช้ 1 Action Point เพื่อจ้องมองเป้าหมายและทำการทอย PER Challenge INF ของเป้าหมาย หากคุณชนะ คุณจะสามารถถาม GM ได้ 1 คำถามเกี่ยวกับ \"สิ่งที่เป้าห essing","text":"บุตรราตรีจะมีประสิทธิภาพมากที่สุดในความมืด คุณจะเพิ่มพลังโจมตีและความแม่นยำในการโจมตีในเวลากลางคืน +2 Might, +1 CC. Dice ในเวลากลางคืนหรืออยู่ในที่มืดสนิท"},{"name":"กระเพาะเหล็ก","nameEn":"Iron Stomach","text":"การกินอาหารที่มีรูปลักษณ์หรือรสชาติแย่ และการกินเนื้อคนจะไม่ลด Sanity"},{"name":"มองเห็นในความมืด","nameEn":"Dark Vision","text":"ดวงตาของคุณปรับตัวเพื่อดูดกลืนแสงในความมืดสนิท คุณสามารถมองเห็นในแสงสลัวได้ไกลถึง 30 เมตร เสมือนเป็นแสงสว่าง และมองเห็นในความมืดได้เสมือนเป็นแสงสลัว แต่เห็นเป็นเฉดสีเทา"}],"hindrances":[{"name":"ภาระผู้ถูกขับไล่","nameEn":"Outcaster's Burden","text":"คุณเริ่มต้นเกมด้วยค่า Trust Score -1 กับตัวละครทุกคนที่มาจากวัฒนธรรมหลักของ Greatland (Lunaryn, Solrin และ Elves) คุณจะติด Disadvantage ในการทอย Connection Check กับพวกเขา จนกว่าค่า Trust Score ของคุณกับเป้าหมายจะกลายเป็นบวก"},{"name":"จิตใจอันดิบเถื่อน","nameEn":"Savage Heart","text":"Disadvantage ในการทอย INF และ INT Check เมื่อมีปฏิสัมพันธ์กับสังคมชั้นสูงหรือสถานการณ์ที่เป็นทางการ"}],"starterSkills":[{"condition":"หากมี 15 AGI หรือมากกว่า","name":"ประสานเงา (Umbral Choir)"},{"condition":"หากมี 15 PER หรือมากกว่า","name":"กลยุทธ์กองโจร (Guerrilla tactics)"}],"childhood":[{"code":"C1","name":"นักล่าประจำตระกูล","nameEn":"Clan Hunter","stats":{"AGI":2,"PER":1},"text":"Trait (Relentless Pursuit): หากคุณทอย Nature & Survival Check เพื่อติดตามร่องรอยแล้วล้มเหลว คุณสามารถเลือกที่จะทอยใหม่ได้ 1 ครั้ง แต่การกระทำนี้จะต้องแลกกับการ ใช้เวลาเพิ่มขึ้น 1 ช่วงเวลา (Time Interval)"},{"code":"C2","name":"นักวางกับดัก","nameEn":"Trapper's Apprentice","stats":{"INT":2,"AGI":1},"text":"Trait (Patient Snare): คุณสามารถใช้วัสดุจากธรรมชาติเพื่อสร้างกับดักพื้นฐาน (เช่น บ่วง, หลุมพราง) ได้อย่างรวดเร็วโดยไม่ต้องทอย Check และได้รับ Advantage ในการทอย Crafting Check เพื่อสร้างหรือปลดกับดักที่มีความซับซ้อน"},{"code":"C3","name":"ผู้สานต่อยันต์","nameEn":"Yantra Keeper's","stats":{"INT":2,"PER":1},"text":"Trait (Reading the Skin): คุณได้รับ Advantage ในการทอย Lore Check หรือ PER Check เพื่อสักยั ายขึ้น)"},{"code":"C4","name":"ผู้ถูกทอดทิ้ง","nameEn":"The Abandoned","stats":{"VIT":1,"PER":1},"text":"Trait (Final Instinct): หากค่า HP ของคุณลดลงเหลือ 0 ก่อนที่คุณจะตกอยู่ในสภาวะ Incapacitated คุณสามารถใช้ Reaction ของคุณเพื่อทำการโจมตีพื้นฐาน (Basic Attack) 1 ครั้งใส่เป้าหมายที่ทำให้คุณ HP เหลือ 0 ได้ทันที และการโจมตีนั้นจะนับว่าเป็น Perfect Strike (ยังคงต้องเคารพกติกา Zone)"},{"code":"C5","name":"ผู้ฝึกสัตว์ยักษ์","nameEn":"Young Beast-Wrangler","stats":{"INF":1,"PER":1},"text":"Trait (ท้าทายจ่าฝูง - Alpha's Challenge): 1 ครั้งต่อการพักยาว (Long Rest) คุณสามารถใช้ 1 Action เพื่อท้าทายจ่าฝูงของสัตว์ประเภท Beast ที่ไม่ใช่สิ่งมีชีวิตเหนือธรรมชาติได้ ทำการทอย INF (Presence) Check แข่งกับ INF Mod. + Sanity ของจ่าฝูง หากคุณชนะ ฝูงสัตว์นั้นจะเลิกมองคุณและพันธมิตรเป็นเป้าหมาย และจะไม่โจมตีก่อนเป็นเวลา 1 ชั่วโมง เว้นแต่จะถูกยั่วยุหรือถูกโจมตีก่อน"}],"specialChildhood":[],"adulthood":[{"code":"A1","name":"หัวหน้าเผ่าพลัดถิ่น","nameEn":"Exiled Chieftain","stats":{"INF":1,"STR":1},"text":"Trait (Coordinated Assault): 1 ครั้งต่อเทิร์น หากคุณอยู่ในเขตปะทะ (Engagement Zone) เดียวกันกับพันธมิตรอย่างน้อย 1 คน คุณสามารถใช้ Swift Action เพื่อ \"ชี้เป้า\" (Marked) เป้าหมาย 1 ตนได้ การโจมตีครั้งถัดไปของ \"คุณ\" และ \"พันธมิตร\" คนนั้นที่ทำใส่เป้าหมายที่ถูกชี้เป้าก่อนจะถึงเทิร์นถัดไปของคุณ จะได้รับโบนัส Combat Value (CV) +2"},{"code":"A2","name":"ผู้ถือสัตย์สาบาน","nameEn":"Oathsworn","stats":{"INF":1,"VIT":1},"text":"Trait (Oath of Honor): ในช่วงเริ่มต้นของภารกิจ คุณสามารถประกาศ \"คำสาบาน\" ที่ท้าทายและเฉพาะเจาะจงกับ GM ได้ (เช่น ข้าสาบานว่าจะไม่มีผู้บริสุทธิ์ต้องตายด้วยน้ำมือของข้า หรือข้าสาบานว่าจะโค่นผู้นำของเป้าหมายด้วยตัวคนเดียว) หากคุณทำภารกิจสำเร็จโดยที่ยังรักษาคำสาบานไว้ได้ เมื่อจบภารกิจคุณจะได้รับ แต้มปณิธาน (Conviction Points - CP) ตามค่า Sanity ที่เหลืออยู่ของคุณ (ต่ำสุด 1) หากคุณจงใจละเมิดคำสาบาน คุณจะสูญเสีย CP ที่มีอยู่ทั้งหมดและไม่สามารถได้รับ CP เพิ่มได้อีกจนกว่าจะทำการไถ่โทษ (ตามที่ GM กำหนด)"},{"code":"A3","name":"ผู้ล่าอสูรยักษ์","nameEn":"Titans Hunter","stats":{"STR":1,"PER":1},"text":"Trait (Titan Fall): เมื่อคุณสร้างความเสียหายใส่เป้าหมายที่มีขนาดใหญ่ (Large) ขึ้นไป คุณสามารถบังคับให้เป้าหมายนั้นทอย STR Saving Throw (DC = 5 + STR Mod. ของคุณ) หากเป้าหมายล้มเหลว จะทำให้เป้าหมายติดสภาวะ Slowed จนถึงเทิร์นถัดไปของคุณ แต่หากเป้าหมายทอยออก Critical Failed จะติด Stuned แทน"},{"code":"A4","name":"ผู้ปลดแอกทาส","nameEn":"Slave Liberator","stats":{"STR":1,"AGI":1},"text":"Trait (The Unstopable): เมื่อคุณหรือพันธมิตร 1 คนใน Engagement Zone ตกอยู่ในสภาวะที่ทำให้เคลื่อนที่ไม่ได้หรือเคลื่อนที่ได้ช้าลง (เช่น Slowed, Grappled หรือ Root) คุณสามารถจ่าย 1 Action Point ในเทิร์นตัวเอง และทอย 10 STR Check หากสำเร็จ จะล้มล้างสถานะนั้นได้"},{"code":"A5","name":"ผู้รักษาวิญญาณ","nameEn":"Spirit Tender Shaman","stats":{"INT":1,"VIT":1},"text":"Trait (Ancestral Knowledge): 1 ครั้งต่อการพักยาว (Long Rest) คุณสามารถใช้เวลา 10 นาทีในการทำสมาธิเพื่อเชิญวิญญาณบรรพบุรุษได้ เลือกทักษะความรู้ (Knowledge Skill) 1 อย่างที่คุณไม่มีความชำนาญ (Proficiency) เป็นเวลา 1 ชั่วโมงหลังจากนี้ คุณจะถือว่ามีความชำนาญในทักษะนั้นๆ ในระดับ 1st Level Proficiency"}],"specialAdulthood":[],"archetype":"Fighter / Damage Dealer","sizes":["Large"],"notes":[],"knowledgeGrants":[],"evolver":false,"uniqueGroups":["Orcarim"]},{"id":"necrobug","name":"Necrobug / Mok'Nars","intro":["เนโครบัค หรือ ม็อคนาส์ (Mok'Nars) คือเผ่าแมลงทรงปัญญาขนาดมหึมา หนึ่งในเผ่าทรงปัญญาพวกแรกของคีรันนาที่ถือกำเนิดร่วมยุคกับมังกร พฤกษา และออร์คาริม รังของพวกเขาแผ่อยู่ในอุโมงค์และดันเจี้ยนใต้ผืนดิน รวมกันหลายพันล้านตน และแบกหน้าที่เฝ้าทางเชื่อมสู่โลกใต้พิภพมาแต่บรรพกาล พวกเขาคอยล่าอสูรที่พยายามขึ้นมาบนผิวดิน ไร่นาข้างบนจะอุดมหรือไม่ จึงขึ้นอยู่กับว่ารังข้างล่างแข็งแรงแค่ไหน ร่างไคตินของเนโครบัคเป็นบ้านของจุลชีพนับไม่ถ้วนที่เรียกว่า Necroflora พวกเขาจึงแทบไม่รู้จักโรคและพิษ แต่ผู้ใดกินเนื้อของพวกเขาโดยไม่มีภูมิคุ้มกันพอจะเสี่ยงติดโรคแมลงผี","สังคมรังปกครองด้วยฟีโรโมน สมาชิกทุกตนลงเสียงผ่านกลิ่นเพื่อเลือกตัวแทน และตัวแทนเลือก The Queen ขึ้นเป็นศูนย์กลางของรังโดยมีสภาคอยตรวจสอบ เนโครบัคไม่เคยคิดครองโลก ทว่าทุกครั้งที่ขึ้นมาบนดิน พวกเขากลับถูกคนแคระกดค่าแรง ถูกไนท์เอลฟ์ไล่ล่า และถูกซินเฟรย์กับมนุษย์จับไปทดลอง เพราะรูปร่างที่เหมือนสัตว์สงครามทำให้เผ่าอื่นหวาดระแวงอยู่เสมอ","ส่วนในชีวิตประจำวัน เนโครบัคสุภาพ มีอารมณ์ขัน ชอบถกเถียงด้วยหลักฐาน และรักครอบครัวสุดหัวใจ ชีวิตที่อาจจบลงในการล่าครั้งหน้าสอนให้พวกเขาใส่ใจแค่วันนี้ และยกย่องผู้เฒ่าที่รอดมาได้ยิ่งกว่าใคร"],"raw":{"STR":12,"AGI":8,"VIT":12,"PER":11,"INF":7,"INT":6},"extra":10,"age":"ตัวอ่อน (Larva) จะเปลี่ยนรูปร่างครั้งใหญ่เมื่ออายุ 9 ถึง 12 ปี แล้วจึงนับว่าโตเต็มวัย อายุขัยเฉลี่ยอยู่ที่ 50 ถึง 60 ปี อยู่ได้ถึง 90 ถึง 100 ปี ในสภาพแวดล้อมที่เหมาะสม และบางตนที่ระบบจุลชีพสมบูรณ์เป็นพิเศษอยู่ได้เกิน 150 ปี วัยชราเริ่มราวอายุ 40 ถึง 50 ปี ถึงอย่างนั้น อายุคาดเฉลี่ยของเนโครบัคที่เพิ่งเข้าวัยเจริญพันธุ์มีเพียงราว 15 ปี เพราะต้องออกล่าอสูรแทบทุกวัน","size":"ยืนเต็มตัวสูงราว 2.2 ถึง 3 เมตร ลำตัวยาว 2.5 ถึง 3.5 เมตร หนักราว 230 ถึง 500 กิโลกรัม สายที่พัฒนามาเพื่อการทหารหรือแรงงานหนักอาจหนักเกิน 700 กิโลกรัม ขนาดของคุณคือ ใหญ่ (Large)","speed":"ความเร็วในการ Dash ของคุณคือ 2 เมตรต่อวินาที และการวิ่ง 6 เมตรต่อวินาที หากขาคู่หน้าว่างทั้งสองข้าง คุณสามารถลดลำตัวลงต่ำแล้ววิ่งด้วยหกขาได้ 8 เมตรต่อวินาที คุณปีนพื้นผิวหยาบอย่างผนังหินหรือเปลือกไม้ได้ด้วยความเร็วเท่ากับ Dash และนอกการต่อสู้ คุณขุดดินอ่อนได้ราว 1 เมตรต่อนาที","languages":"คุณเข้าใจภาษากลาง (Common Greatland) เมื่อได้ยิน อ่านและเขียนได้ แต่พูดออกเสียงไม่ได้ (ดูไร้วาจา) คุณสื่อสารด้วยภาษามือสากล (Common Sign Languages) และสัญญาณรัง (Brood Signal)","benefits":[],"traits":[{"name":"เปลือกไคตินซ้อนชั้น","nameEn":"Layered Chitin","text":"ร่างของคุณนับว่าสวมเกราะชั้นใน (Inner) ที่มี 1 Natural Armor ในทุกตำแหน่งร่างกายตลอดเวลา เปลือกนี้ไม่สามารถถอดได้และไม่มีค่า Durability ให้ลด คุณสวมเกราะชั้นนอก (Outer) ทับได้โดยไม่ติดโทษจากการสวมเกราะสองชั้น แต่สวมเกราะชั้นในชิ้นอื่นไม่ได้ และหากได้รับ Natural Armor จากแหล่งอื่น ให้ใช้ค่าที่สูงกว่าเพียงค่าเดียว"},{"name":"ระบบนิเวศเดินได้","nameEn":"Walking Ecosystem","text":"Necroflora ในร่างของคุณย่อยสลายสิ่งแปลกปลอมอยู่ตลอดเวลา ทำให้คุณมีภูมิคุ้มกัน (Immune) ต่อโรคติดเชื้อที่ไม่ได้เกิดจากเวทมนตร์หรือคำสาปทุกชนิด คุณได้รับ Advantage ในการ Saving Throw ต่อพิษ (Poison) และสามารถกินเนื้อดิบ อาหารบูด หรือซากสัตว์ได้โดยไม่ป่วยและไม่เสีย Sanity จากรูปลักษณ์หรือรสชาติ สัตว์ประเภท Beast ที่ไม่ใช่อสูรและไม่ได้ผ่านการฝึกจะไม่เลือกคุณเป็นเหยื่อ มันจะไม่โจมตีคุณก่อน เว้นแต่คุณโจมตีมันก่อน มันจนมุม หรือกำลังปกป้องรังของมัน และสัตว์พวกนั้นจะไม่กล้า Devour คุณเลย ไม่ว่ากรณีใดก็ตาม ส่วนผู้ที่กินเนื้อของคุณ หากไม่มี Super Metabolism หรือภูมิคุ้มกันต่อโรค ต้องทอย VIT Saving Throw (DC 10) หากล้มเหลวจะติดโรคแมลงผี โดย GM เป็นผู้กำหนดการลุกลาม เมื่อคุณตาย ต้องเผาร่างของคุณภายใน 1 วัน มิฉะนั้น Necroflora บางส่วนจะกลายเป็นเชื้อรุกรานพื้นที่รอบศพ"},{"name":"ขนรับสัมผัสและประสาทรับกลิ่น","nameEn":"Setae & Scent","text":"ขนรับสัมผัส (Setae) ทั่วร่างและขาทั้งสี่รับแรงสั่นสะเทือนกับกระแสลม และคุณรับกลิ่นกับสารเคมีในอากาศได้ละเอียดกว่าเผ่าส่วนใหญ่ ทำให้คุณได้รับ Advantage ในการทอย PER Check เพื่อระบุหรือตามรอยด้วยกลิ่น คุณรับรู้ตำแหน่งและขนาดโดยประมาณของสิ่งมีชีวิตทุกตนที่เคลื่อนที่บนพื้นผิวเดียวกับคุณภายในระยะ 10 เมตร และสิ่งมีชีวิตที่หายใจทุกตนในเขตปะทะเดียวกับคุณ แม้มองไม่เห็นก็ตาม สิ่งมีชีวิตเหล่านั้นซ่อนตัว (Hidden) จากคุณไม่ได้ และภายในเขตปะทะที่มีความมืด ม่านหมอก และสภาวะล่องหน (Invisible) จะไม่ทำให้คุณติด Disadvantage ในการ Attack และ Defend ต่อมัน การรับรู้นี้บอกเพียงตำแหน่งและขนาด คุณจึงไม่รู้หน้าตา สี หรือตัวอักษร สิ่งมีชีวิตนอกเขตปะทะที่อยู่ในสภาวะ [ลอยตัว] หรืออยู่นิ่งสนิทจะหลุดจากการรับรู้นี้"}],"hindrances":[{"name":"ไร้วาจา","nameEn":"Voiceless","text":"คุณเข้าใจภาษาพูดแต่เปล่งเสียงเป็นถ้อยคำไม่ได้ คุณจึงร่ายเวทที่มีวิธีร่ายแบบเสียงร่าย (Utterance: U) ไม่ได้ และติด Disadvantage ในการทอย INF Check กับผู้ที่ไม่รู้ทั้งภาษามือสากลและสัญญาณรัง ข้อหลังนี้ไม่มีผลกับการข่มขู่ด้วยท่าทาง รูปร่าง การเขียนสื่อสารกับผู้ที่อ่านออกในสถานการณ์ที่ไม่เร่งรีบ และการสื่อสารผ่านวอกโซโฟน (Voxophone) ที่จับคู่กันไว้"},{"name":"กายที่ผลาญทุกสิ่ง","nameEn":"Hypermetabolic Purge","text":"ระบบเผาผลาญที่ช่วยคุณต้านพิษกำจัดฤทธิ์ยาทิ้งก่อนที่ม
